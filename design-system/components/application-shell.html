<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorilla HIS — Precision Application Shell Candidate v3</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-family-base);background:var(--color-bg-canvas);color:var(--color-text-primary)}
.app-shell{min-height:100vh;display:grid;grid-template-columns:var(--layout-command-rail-width) 1fr;grid-template-rows:var(--layout-topbar-height) 1fr;background:var(--color-bg-canvas)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:var(--space-5);padding:0 var(--space-5);background:rgba(255,255,255,.96);border-bottom:1px solid var(--color-border-optical);box-shadow:var(--shadow-optical);position:sticky;top:0;z-index:var(--z-sticky)}
.brand{display:flex;align-items:center;gap:var(--space-3);min-width:0}.brand-mark{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--radius-sm);background:linear-gradient(145deg,var(--color-blue-600),var(--color-blue-700));color:var(--color-text-inverse);font-size:var(--font-size-2xs);font-weight:var(--font-weight-bold);box-shadow:var(--shadow-control)}.product-name{font-size:var(--font-size-sm);font-weight:var(--font-weight-heavy);letter-spacing:var(--letter-spacing-product)}
.module-context{display:flex;align-items:center;gap:var(--space-3);padding-left:var(--space-5);border-left:1px solid var(--color-border-subtle);color:var(--color-text-secondary);font-size:var(--font-size-xs)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.command-rail{background:linear-gradient(180deg,var(--color-bg-command-rail),var(--color-gray-950));padding:var(--space-2) var(--space-2) var(--space-3);display:flex;flex-direction:column;gap:var(--space-1);border-right:1px solid rgba(255,255,255,.04)}
.rail-item{position:relative;width:100%;min-height:46px;display:grid;place-items:center;border:0;border-radius:var(--radius-md);background:transparent;color:var(--color-gray-400);cursor:pointer;transition:background var(--transition-fast),color var(--transition-fast),transform var(--transition-fast)}
.rail-item:hover{background:rgba(255,255,255,.06);color:var(--color-white)}.rail-item:active{transform:translateY(1px)}
.rail-item.is-active{background:rgba(255,255,255,.96);color:var(--color-primary-action);box-shadow:var(--shadow-control)}
.rail-item.is-active::before{content:"";position:absolute;left:calc(var(--space-2) * -1);top:12px;bottom:12px;width:3px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--color-blue-500)}
.rail-label{position:absolute;left:calc(100% + var(--space-2));padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);background:var(--color-gray-900);color:var(--color-white);white-space:nowrap;font-size:var(--font-size-2xs);opacity:0;pointer-events:none;transform:translateX(-4px);transition:opacity var(--transition-fast),transform var(--transition-fast);box-shadow:var(--shadow-elevated);z-index:3}.rail-item:hover .rail-label{opacity:1;transform:translateX(0)}
.workspace{min-width:0;overflow:auto;padding:var(--space-3);background:var(--color-bg-canvas)}
.work-surface{min-height:calc(100vh - var(--layout-topbar-height) - var(--space-6));background:var(--color-bg-surface);border:1px solid var(--color-border-optical);border-radius:var(--radius-lg);box-shadow:var(--shadow-optical);overflow:hidden}
.page-context{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);min-height:58px;padding:var(--space-3) var(--space-5);background:linear-gradient(180deg,var(--color-bg-surface),var(--color-bg-surface-subtle));border-bottom:1px solid var(--color-border-subtle)}
.context-left{min-width:0}.breadcrumb{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);letter-spacing:var(--letter-spacing-technical)}.page-title{margin:var(--space-1) 0 0;font-size:var(--font-size-xl);font-weight:var(--font-weight-heavy);line-height:var(--line-height-tight)}
.context-right{display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.sync-dot{width:7px;height:7px;border-radius:var(--radius-full);background:var(--color-status-normal);box-shadow:0 0 0 3px var(--color-status-normal-bg)}
.content{width:100%;max-width:var(--layout-content-max-width);margin:0 auto;padding:var(--space-5)}
@media(max-width:900px){.module-context{display:none}.workspace{padding:0}.work-surface{border-radius:0;border-left:0;border-right:0}.content{padding:var(--space-4)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<!--
PRECISION APPLICATION SHELL CANDIDATE v3
Authority: ../VISUAL_DNA.md

This shell protects Gorilla HIS continuity but is NOT a Gold Standard.

Craft intent:
- quiet premium top identity;
- compact command rail with tactile states and contextual tooltip;
- S0 Canvas around a refined S1 Work Surface instead of flat white edge-to-edge dryness;
- optical border + extremely restrained depth;
- page context integrated into the work surface;
- feature design still begins from Decision Architecture, not from shell/component slots.

Do not mechanically copy this shell when workflow requires a different Human-approved archetype.
Font Awesome classes are semantic handoff contracts; mockups must not load CDN/Kit.
-->
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true">G</div><div class="product-name">GORILLA HIS</div></div>
  <div class="module-context">Hospital Command Center <span>·</span> Central Hospital</div>
  <div class="topbar-right"><span>Live · 14:38</span><span>Operations Commander</span></div>
</header>
<nav class="command-rail" aria-label="Primary navigation">
  <button class="rail-item is-active" aria-label="Overview"><i class="fa-solid fa-chart-line"></i><span class="rail-label">Overview</span></button>
  <button class="rail-item" aria-label="Operational work"><i class="fa-solid fa-list-check"></i><span class="rail-label">Operational work</span></button>
  <button class="rail-item" aria-label="Capacity"><i class="fa-solid fa-bed"></i><span class="rail-label">Capacity</span></button>
  <button class="rail-item" aria-label="Configuration"><i class="fa-solid fa-gear"></i><span class="rail-label">Configuration</span></button>
</nav>
<section class="workspace">
  <div class="work-surface">
    <header class="page-context">
      <div class="context-left"><div class="breadcrumb">OPERATIONS / COMMAND</div><h1 class="page-title">Decision-oriented page title</h1></div>
      <div class="context-right"><span class="sync-dot" aria-hidden="true"></span><span>Live source connected</span></div>
    </header>
    <main class="content">
      <!-- Compose from Decision Architecture: Situation → Evidence → Exception → Action → Detail. -->
    </main>
  </div>
</section>
</div>
</body>
</html>
