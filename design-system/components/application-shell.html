<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorilla HIS — Application Shell Candidate v2</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-family-base);background:var(--color-bg-surface);color:var(--color-text-primary)}
.app-shell{min-height:100vh;display:grid;grid-template-columns:var(--space-8) 1fr;grid-template-rows:var(--layout-topbar-height) 1fr}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:0 var(--space-4);border-bottom:1px solid var(--color-border);background:var(--color-bg-surface);position:sticky;top:0;z-index:var(--z-sticky)}
.brand{display:flex;align-items:center;gap:var(--space-3)}.brand-mark{width:var(--space-7);height:var(--space-7);display:grid;place-items:center;background:var(--color-brand-mark);color:var(--color-text-inverse);border-radius:var(--radius-sm);font-weight:var(--font-weight-bold);font-size:var(--font-size-xs)}.product-name{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.module-name,.topbar-context{font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.nav-rail{border-right:1px solid var(--color-border);background:var(--color-bg-surface);padding-top:var(--space-2)}.rail-item{width:100%;min-height:var(--space-8);display:grid;place-items:center;border:0;border-left:2px solid transparent;background:transparent;color:var(--color-text-secondary);cursor:pointer}.rail-item:hover{background:var(--color-gray-50);color:var(--color-text-primary)}.rail-item.is-active{border-left-color:var(--color-primary-action);background:var(--color-blue-50);color:var(--color-primary-action)}
.workspace{min-width:0;overflow:auto}.page-context{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-5) var(--space-2);border-bottom:1px solid var(--color-border)}.breadcrumb{font-size:var(--font-size-xs);color:var(--color-text-secondary)}.page-title{margin:var(--space-1) 0 0;font-size:var(--font-size-xl);line-height:var(--line-height-tight)}.context-meta{font-size:var(--font-size-xs);color:var(--color-text-secondary);text-align:right}.content{width:100%;max-width:var(--layout-content-max-width);margin:0 auto;padding:var(--space-4) var(--space-5) var(--space-6)}
</style>
</head>
<body>
<!--
APPLICATION SHELL CANDIDATE v2
Authority: ../VISUAL_DNA.md

Purpose: reduce generic heavy-sidebar/admin-template character and give the work surface visual priority.
This is a product-continuity shell candidate, not a Human-approved Gold Standard.

Craft intent:
- compact top identity;
- narrow precision navigation rail;
- continuous white work surface;
- active navigation = precise indicator + subtle tone, not a large filled pill;
- no ambient shadow;
- feature composition begins inside main content and is governed by Decision Architecture.

Feature teams may add contextual secondary navigation when workflow requires it, but must preserve the quiet work-surface hierarchy.
Font Awesome classes are semantic handoff contracts; no CDN/Kit.
-->
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true">G</div><div><div class="product-name">GORILLA HIS</div><div class="module-name">Module / Work Area</div></div></div>
  <div class="topbar-context">Hospital / Site · User / Role</div>
</header>
<nav class="nav-rail" aria-label="Primary navigation">
  <button class="rail-item is-active" aria-label="Primary work area"><i class="fa-solid fa-house" aria-hidden="true"></i></button>
  <button class="rail-item" aria-label="Worklist"><i class="fa-solid fa-list-check" aria-hidden="true"></i></button>
  <button class="rail-item" aria-label="Configuration"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
</nav>
<section class="workspace">
  <div class="page-context">
    <div><div class="breadcrumb">Module / Section</div><h1 class="page-title">Decision-oriented page title</h1></div>
    <div class="context-meta">Operational context · Last update · Sync state</div>
  </div>
  <main class="content">
    <!-- Compose from Decision Question: Situation → Evidence → Exception → Action → Detail. Do not start from a card grid. -->
  </main>
</section>
</div>
</body>
</html>
