<!--
  Component: Buttons — Precision Control v2
  Authority: ../VISUAL_DNA.md + ../tokens.css + ../icon-rules.md
  Reuse interaction/craft; do not mechanically force where workflow requires another control.
-->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Gorilla HIS — Precision Buttons</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { font-family:var(--font-family-base); background:var(--color-bg-page); color:var(--color-text-primary); padding:var(--space-7); }
  h2 { font-size:var(--font-size-lg); margin:var(--space-6) 0 var(--space-3); }
  .row { display:flex; gap:var(--space-3); margin-bottom:var(--space-6); flex-wrap:wrap; align-items:center; }
  .btn {
    appearance:none;
    min-height:40px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:var(--space-2);
    padding:0 var(--space-5);
    border:1px solid transparent;
    border-radius:var(--radius-md);
    font-family:var(--font-family-base);
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-semibold);
    line-height:1;
    letter-spacing:.005em;
    cursor:pointer;
    transition:background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast), color var(--transition-fast);
    box-shadow:var(--shadow-control);
  }
  .btn:hover { transform:translateY(-1px); }
  .btn:active { transform:translateY(0); }
  .btn:focus-visible { outline:0; box-shadow:0 0 0 3px var(--color-blue-100), var(--shadow-control); }
  .btn--primary { background:var(--color-primary-action); color:var(--color-text-inverse); border-color:var(--color-blue-600); }
  .btn--primary:hover { background:var(--color-primary-action-hover); border-color:var(--color-blue-700); }
  .btn--primary:active { background:var(--color-primary-action-pressed); }
  .btn--secondary { background:linear-gradient(180deg,var(--color-white),var(--color-gray-25)); color:var(--color-text-primary); border-color:var(--color-border-strong); }
  .btn--secondary:hover { background:var(--color-white); border-color:var(--color-blue-200); color:var(--color-blue-700); }
  .btn--quiet { background:transparent; color:var(--color-text-secondary); border-color:transparent; box-shadow:none; }
  .btn--quiet:hover { background:var(--color-gray-100); color:var(--color-text-primary); }
  .btn--danger { background:var(--color-danger-action); color:var(--color-text-inverse); }
  .btn--critical { background:var(--color-status-critical); color:var(--color-text-inverse); border-color:var(--color-red-600); }
  .btn:disabled { opacity:.46; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn--icon { width:40px; padding:0; }
  .btn__icon-slot { width:16px; height:16px; display:grid; place-items:center; flex:0 0 16px; }
  .btn__icon-slot::before { content:""; width:8px; height:8px; border-radius:var(--radius-full); background:currentColor; opacity:.72; }
  .note { max-width:760px; color:var(--color-text-secondary); font-size:var(--font-size-sm); line-height:var(--line-height-normal); }
</style>
</head>
<body>
  <h2>Primary / Secondary / Quiet</h2>
  <div class="row">
    <button class="btn btn--primary"><span class="btn__icon-slot" aria-hidden="true"></span>บันทึกข้อมูล</button>
    <button class="btn btn--secondary">ยกเลิก</button>
    <button class="btn btn--quiet">ดูรายละเอียด</button>
    <button class="btn btn--primary" disabled>กำลังบันทึก...</button>
  </div>
  <h2>Clinical / destructive</h2>
  <div class="row">
    <button class="btn btn--danger">ลบรายการ</button>
    <button class="btn btn--critical">ยืนยันความเสี่ยงสำคัญ</button>
  </div>
  <p class="note">Icon slot ใน preview นี้เป็นเพียง optical placeholder ของ component preview. ใน mockup จริงต้องใช้ Font Awesome semantic class ตาม <code>icon-rules.md</code>; ห้าม Emoji และห้ามแทน main navigation ด้วย abbreviation หากมี semantic icon ที่เหมาะสม.</p>
</body>
</html>
