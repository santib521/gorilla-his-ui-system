<!--
  Component: Buttons
  วิธีใช้: คัดลอก <style> ส่วน .btn* และ markup <button> ที่ต้องการไปวางใน mockup ของคุณ
  ต้องมี tokens.css inline อยู่ใน <style> ของไฟล์ mockup ด้วยเสมอ (ไฟล์นี้ <link> ไว้แค่เพื่อ preview)
-->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Component Preview — Buttons</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { font-family: var(--font-family-base); background: var(--color-bg-page); padding: var(--space-7); }
  h2 { font-size: var(--font-size-lg); margin-bottom: var(--space-4); }
  .row { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); flex-wrap: wrap; align-items: center; }

  .btn {
    font-family: var(--font-family-base);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    padding: var(--space-3) var(--space-5);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    min-height: 44px;
    transition: background var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
  }
  .btn:focus-visible { outline: 2px solid var(--color-blue-500); outline-offset: 2px; }

  .btn--primary { background: var(--color-primary-action); color: var(--color-text-inverse); }
  .btn--primary:hover { background: var(--color-primary-action-hover); }

  .btn--secondary { background: var(--color-white); color: var(--color-text-primary); border-color: var(--color-border); }
  .btn--secondary:hover { background: var(--color-gray-50); }

  .btn--danger { background: var(--color-danger-action); color: var(--color-text-inverse); }
  .btn--danger:hover { background: var(--color-danger-action-hover); }

  .btn--critical { background: var(--color-status-critical); color: var(--color-text-inverse); }
  .btn--critical:hover { background: var(--color-red-700); }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn--icon { padding: var(--space-3); width: 44px; justify-content: center; }
</style>
</head>
<body>
  <h2>Primary / Secondary / Danger</h2>
  <div class="row">
    <button class="btn btn--primary">บันทึกข้อมูล</button>
    <button class="btn btn--secondary">ยกเลิก</button>
    <button class="btn btn--danger">ลบรายการ</button>
    <button class="btn btn--critical">ยืนยันการแพ้ยา</button>
    <button class="btn btn--primary" disabled>กำลังบันทึก...</button>
  </div>

  <h2>Icon Button</h2>
  <div class="row">
    <button class="btn btn--secondary btn--icon" aria-label="ค้นหา">🔍</button>
    <button class="btn btn--secondary btn--icon" aria-label="พิมพ์">🖨️</button>
  </div>
</body>
</html>
