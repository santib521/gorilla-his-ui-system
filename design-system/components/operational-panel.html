<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operational Panel</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:var(--space-5);font-family:var(--font-family-base);background:var(--color-bg-page);color:var(--color-text-primary)}
.panel{background:var(--color-bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}.panel-header{min-height:var(--space-8);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-border);background:var(--color-gray-50)}
.panel-title{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}.panel-context{font-size:var(--font-size-xs);color:var(--color-text-secondary)}.panel-body{padding:var(--space-3)}
.panel-table{width:100%;border-collapse:collapse;font-size:var(--font-size-xs)}.panel-table th,.panel-table td{padding:var(--space-2);border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle}.panel-table th{font-weight:var(--font-weight-medium);color:var(--color-text-secondary);background:var(--color-gray-50)}.panel-table tr:last-child td{border-bottom:0}
.status{display:inline-flex;align-items:center;gap:var(--space-1);font-weight:var(--font-weight-medium)}.status::before{content:"";width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full);background:var(--color-status-info)}.status.warning{color:var(--color-status-warning)}.status.warning::before{background:var(--color-status-warning)}.status.critical{color:var(--color-status-critical)}.status.critical::before{background:var(--color-status-critical)}
.panel-footer{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-top:1px solid var(--color-border);background:var(--color-gray-50)}.action-slot{font-size:var(--font-size-xs);color:var(--color-text-secondary)}
</style></head>
<body>
<!-- Operational Panel: structural/data container only. Prefer this/table/split panels over oversized dashboard cards. Actions inserted in .action-slot MUST reuse design-system/components/buttons.html; this component does not define its own button language. -->
<section class="panel">
 <header class="panel-header"><div><div class="panel-title">ER Flow</div><div class="panel-context">Updated 10:42 · HIMS live</div></div><span class="status warning">Attention required</span></header>
 <div class="panel-body">
  <table class="panel-table"><thead><tr><th>Queue</th><th>Current</th><th>Target</th><th>Status</th></tr></thead><tbody>
   <tr><td>Triage</td><td>19</td><td>&lt;15</td><td><span class="status warning">Above threshold</span></td></tr>
   <tr><td>Waiting for Doctor</td><td>11</td><td>&lt;10</td><td><span class="status warning">Monitor</span></td></tr>
   <tr><td>Waiting for Bed</td><td>12</td><td>&lt;5</td><td><span class="status critical">Escalate</span></td></tr>
  </tbody></table>
 </div>
 <footer class="panel-footer"><div class="action-slot">Insert approved `buttons.html` controls here.</div></footer>
</section>
</body></html>
