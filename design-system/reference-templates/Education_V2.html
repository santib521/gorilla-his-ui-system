<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gorilla HIS — ระบบ Education นักศึกษาแพทย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Gorilla HIS tokens (subset, from design-system/tokens.css v2.0) ===== */
:root{
  color-scheme: light only;
  --blue-50:#eef0fd;--blue-100:#dfe3fb;--blue-500:#6366f1;--blue-600:#4f46e5;--blue-700:#4338ca;--blue-900:#24205f;
  --brand:#0f8b8d;--teal-50:#edf8f8;--teal-100:#d7efef;
  --green-50:#ecfdf3;--green-500:#16a34a;--green-700:#15803d;
  --red-50:#fef2f2;--red-100:#fee2e2;--red-500:#dc2626;--red-600:#b91c1c;--red-700:#991b1b;
  --orange-50:#fff7ed;--orange-100:#ffedd5;--orange-500:#ea580c;--orange-600:#c2410c;
  --amber-50:#fffbeb;--amber-500:#d97706;
  --g25:#fbfcfd;--g50:#f7f9fb;--g75:#f2f5f8;--g100:#edf1f5;--g150:#e7ebf0;--g200:#dce2e8;--g300:#c7d0d9;--g400:#96a2af;--g500:#687584;--g600:#4d5967;--g700:#374250;--g800:#222d3a;--g900:#121b27;--g950:#0b121d;--white:#fff;
  --rail:#101927;--sidebar:#121b27;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --sh-optical:0 1px 0 rgba(255,255,255,.72) inset,0 1px 2px rgba(18,27,39,.035);
  --sh-control:0 1px 2px rgba(18,27,39,.08),0 1px 0 rgba(255,255,255,.82) inset;
  --sh-elev:0 8px 28px rgba(18,27,39,.12),0 2px 6px rgba(18,27,39,.07);
  --sh-overlay:0 18px 48px rgba(18,27,39,.18),0 4px 12px rgba(18,27,39,.08);
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--g75);color:var(--g900);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Shell ===== */
.app{height:100vh;min-height:0;overflow:hidden;display:grid;grid-template-columns:64px 240px 1fr;grid-template-rows:52px minmax(0,1fr)}
.app.side-collapsed{grid-template-columns:64px 1fr}
.app.side-collapsed .sidebar{display:none}
.app.side-collapsed .topbar{grid-column:1/-1}
/* dashboard landing: SEARCH PATIENT panel removed to save space — search moves to page header (.hdr-search) */
.app.no-search-side{grid-template-columns:64px 1fr}
.app.no-search-side .sidebar{display:none}
.side-collapse-btn{margin-left:auto;border:0;background:transparent;color:var(--g400);cursor:pointer;font-size:14px;padding:4px;border-radius:6px}
.side-collapse-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.search-panel .side-collapse-btn:hover{background:var(--g100);color:var(--blue-700)}
.rail-item.railtoggle{margin-top:auto;color:var(--g400)}
.side-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.side-meta .mm{font-size:10px;color:var(--g400);background:rgba(255,255,255,.06);border-radius:6px;padding:1px 6px}
.side-item.rich{align-items:flex-start;flex-direction:column;gap:3px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 18px;background:rgba(255,255,255,.97);border-bottom:1px solid rgba(18,27,39,.10);box-shadow:var(--sh-optical);position:sticky;top:0;z-index:200}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:27px;height:27px;display:grid;place-items:center;border-radius:var(--radius-sm);background:linear-gradient(145deg,var(--brand),#0b6d6f);color:#fff;font-weight:700;font-size:12px;box-shadow:var(--sh-control)}
.product{font-weight:700;letter-spacing:.06em;font-size:13px}
.mod-ctx{padding-left:16px;border-left:1px solid var(--g150);color:var(--g600);font-size:12px;display:flex;align-items:center;gap:8px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--g600)}
.roleswitch{display:flex;gap:4px;background:var(--g100);border:1px solid var(--g200);border-radius:var(--radius-full);padding:3px}
.roleswitch button{border:0;background:transparent;padding:5px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600;color:var(--g600);cursor:pointer;display:flex;align-items:center;gap:6px}
.roleswitch button.on{background:var(--white);color:var(--blue-700);box-shadow:var(--sh-control)}

/* command rail */
.rail{min-height:0;overflow-y:auto;overflow-x:visible;background:linear-gradient(180deg,var(--rail),var(--g950));padding:8px 8px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid rgba(255,255,255,.04)}
.rail-item{position:relative;width:100%;min-height:46px;display:grid;place-items:center;border:0;border-radius:var(--radius-md);background:transparent;color:var(--g400);cursor:pointer;transition:.14s var(--ease);font-size:18px}
.rail-item:hover{background:rgba(255,255,255,.06);color:#fff}
.rail-item.on{background:rgba(255,255,255,.96);color:var(--blue-600);box-shadow:var(--sh-control)}
.rail-item.on::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 4px 4px 0;background:var(--blue-500)}
.rail-item .lab{position:absolute;left:calc(100% + 8px);padding:4px 9px;border-radius:8px;background:var(--g900);color:#fff;white-space:nowrap;font-size:11px;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.14s;box-shadow:var(--sh-elev);z-index:3}
.rail-item:hover .lab{opacity:1;transform:translateX(0)}
.rail-item .badge{position:absolute;top:6px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* sidebar (context nav) */
.sidebar{background:var(--sidebar);color:var(--g300);padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-h{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--g500);padding:12px 10px 6px}
.side-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);color:var(--g300);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-size:13px;font-weight:500}
.side-item:hover{background:rgba(255,255,255,.06);color:#fff}
.side-item.on{background:var(--blue-600);color:#fff;box-shadow:var(--sh-control)}
.side-item .sic{width:18px;text-align:center;font-size:15px;opacity:.9}
.side-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:9px;font-weight:600}
.side-item.on .cnt{background:rgba(255,255,255,.25)}
.side-user{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--g400);display:flex;gap:10px;align-items:center}
.side-user .av{width:30px;height:30px;border-radius:var(--radius-full);background:var(--blue-700);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

/* workspace */
.workspace{overflow:auto;min-height:0;padding:14px;background:var(--g75)}
.surface{min-height:calc(100vh - 52px - 28px);background:var(--white);border:1px solid rgba(18,27,39,.10);border-radius:var(--radius-lg);box-shadow:var(--sh-optical);overflow:clip}
.workspace:has(.teaching-context) .surface{overflow:visible}
.page-ctx{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px;padding:6px 22px;background:linear-gradient(180deg,var(--white),var(--g25));border-bottom:1px solid var(--g150)}
.ptitle:empty{display:none}
/* Compare Mode: slide-in drawer showing what the doctor has actually recorded in the real EMR */
/* condensed patient banner: a small fixed strip that fades in once the full banner has scrolled out of view.
   Deliberately position:fixed (not sticky-in-flow) so it never depends on an ancestor's overflow/height quirks. */
.compact-banner{position:fixed;top:52px;left:64px;right:0;z-index:150;background:var(--white);border-bottom:1px solid var(--g200);box-shadow:0 6px 16px rgba(18,27,39,.08);padding:9px 22px;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--g700);transform:translateY(-10px);opacity:0;pointer-events:none;transition:transform .16s ease,opacity .16s ease}
.compact-banner.show{transform:translateY(0);opacity:1;pointer-events:auto}
.compact-banner .cb-av{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#e7c6a8,#d9a97f);display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.compact-banner .cb-name{font-weight:800;color:var(--g900);white-space:nowrap}
.compact-banner .cb-meta{color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-banner .cb-chip{background:var(--blue-50);color:var(--blue-700);border-radius:999px;padding:2px 10px;font-weight:700;font-size:11px;flex:none}
.compact-banner .cb-tag{margin-left:auto;color:#8a5106;font-weight:700;font-size:11px;flex:none;display:flex;align-items:center;gap:5px;white-space:nowrap}
@media(max-width:900px){.compact-banner{left:0}}
.compare-drawer{position:fixed;top:52px;right:0;bottom:0;width:480px;max-width:94vw;background:var(--white);border-left:1px solid var(--g200);box-shadow:-10px 0 28px rgba(18,27,39,.14);transform:translateX(100%);transition:transform .22s ease;z-index:300;display:flex;flex-direction:column}
.compare-drawer.open{transform:translateX(0)}
.compare-drawer .cd-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--g150);font-weight:800;background:var(--g25)}
.compare-drawer .cd-head .x{margin-left:auto;cursor:pointer;color:var(--g500);display:grid;place-items:center}
.compare-drawer .cd-sub{padding:8px 16px;font-size:11.5px;color:var(--g500);border-bottom:1px solid var(--g150);background:#fbfdff}
.compare-drawer .cd-body{padding:14px 16px;overflow:auto;flex:1}
.compare-drawer .cd-group{margin-bottom:16px}
.compare-drawer .cd-group-h{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--blue-700);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--blue-100)}
.ipd-chart .cd-group{margin-bottom:14px}.ipd-chart .cd-group-h{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--blue-700);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--blue-100);display:flex;gap:6px;align-items:center}
.compare-fab{position:fixed;bottom:22px;right:22px;z-index:290;display:flex;align-items:center;gap:8px;background:var(--blue-600);color:#fff;border:0;border-radius:var(--radius-full);padding:11px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 8px 20px rgba(37,99,235,.35)}
.compare-fab:hover{background:var(--blue-700)}
@media(max-width:640px){.compare-drawer{top:0}}
/* Original (y45/y67/Extern/MS5) compare drawer: view-only, so neutral greys instead of accent colours */
.compare-drawer.cd-muted .cd-head{background:var(--g25);color:var(--g800)}
.compare-drawer.cd-muted .cd-head .ic{color:var(--g500)}
.compare-drawer.cd-muted .cd-sub{background:var(--g25);color:var(--g500)}
.compare-drawer.cd-muted .cd-group-h{color:var(--g600);border-bottom-color:var(--g200)}
.compare-drawer.cd-muted .emr-rec{border-left-color:var(--g300);background:var(--white)}
.compare-drawer.cd-muted .emr-rec .h,.compare-drawer.cd-muted .emr-rec .h .ic{color:var(--g700)}
.compare-drawer.cd-muted .readonly-mark{background:var(--g100);color:var(--g500);border-color:var(--g200)}
.compare-drawer.cd-muted .soap-k{background:var(--g100);color:var(--g600)}
.refdocs-drawer{position:fixed;top:52px;right:0;bottom:0;width:480px;max-width:94vw;background:var(--white);border-left:1px solid var(--g200);box-shadow:-10px 0 28px rgba(18,27,39,.14);transform:translateX(100%);transition:transform .22s ease;z-index:301;display:flex;flex-direction:column}
.refdocs-drawer.open{transform:translateX(0)}
.refdocs-drawer .cd-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--g150);font-weight:800;background:var(--g25)}
.refdocs-drawer .cd-head .x{margin-left:auto;cursor:pointer;color:var(--g500);display:grid;place-items:center}
.refdocs-drawer .cd-sub{padding:8px 16px;font-size:11.5px;color:var(--g500);border-bottom:1px solid var(--g150);background:#fbfdff}
.refdocs-drawer .rd-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid var(--g150);background:var(--g25)}
.refdocs-drawer .rd-tab{border:1px solid var(--g200);background:var(--white);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--g600);cursor:pointer}
.refdocs-drawer .rd-tab.on{background:var(--blue-700,#1d4ed8);border-color:var(--blue-700,#1d4ed8);color:#fff}
.refdocs-drawer .cd-body{padding:14px 16px;overflow:auto;flex:1}
.refdocs-drawer .cd-group{margin-bottom:16px}
.refdocs-drawer .cd-group-h{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--blue-700);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--blue-100)}
@media(max-width:640px){.refdocs-drawer{top:0}}
.refdocs-edge-tab{position:fixed;right:0;top:160px;z-index:290;display:flex;align-items:center;justify-content:center;padding:10px 7px;background:var(--blue-700,#1d4ed8);color:#fff;border:1px solid var(--blue-700,#1d4ed8);border-right:none;border-radius:10px 0 0 10px;box-shadow:-2px 0 10px rgba(18,27,39,.18);cursor:pointer;transition:background .15s ease}
.refdocs-edge-tab:hover{background:var(--blue-800,#1e40af)}
.refdocs-edge-tab.on{background:var(--blue-800,#1e40af)}
.refdocs-edge-tab span{display:none}
.refdocs-edge-tab .pin-ind{position:absolute;top:-5px;right:-5px;background:#f59e0b;border-radius:50%;width:10px;height:10px;box-shadow:0 0 0 2px #fff}
.refdocs-edge-tab .pin-ind .ic{display:none}
.refdocs-action-menu{position:fixed;z-index:302;background:var(--white);border:1px solid var(--g200);border-radius:10px;box-shadow:0 10px 28px rgba(18,27,39,.18);min-width:200px;overflow:hidden;padding:6px}
.refdocs-action-menu .am-lab{padding:6px 10px 4px;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--g500)}
.refdocs-action-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--g800);cursor:pointer}
.refdocs-action-menu button:hover{background:var(--g100)}
.refdocs-action-menu button.on{background:var(--blue-50,#eff6ff);color:var(--blue-700,#1d4ed8)}
.refdocs-drawer .cd-head .pin{margin-left:auto;cursor:pointer;color:var(--g500);display:grid;place-items:center;padding:2px}
.refdocs-drawer .cd-head .pin.on{color:#d97706}
.refdocs-drawer .cd-head .x{margin-left:8px}
.crumb{font-size:11px;color:var(--g500);letter-spacing:.045em}
.ptitle{margin:3px 0 0;font-size:21px;font-weight:700;line-height:1.2}
.page-ctx .rt{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--g600)}
.content{padding:12px 22px 20px;max-width:1600px;margin:0 auto}

/* header search — replaces the old SEARCH PATIENT sidebar panel on dashboard landings */
.hdr-search{display:flex;align-items:center;gap:8px;background:var(--g50);border:1px solid var(--g200);border-radius:var(--radius-full);padding:6px 12px 6px 10px}
.hdr-search .ic{color:var(--g400);font-size:13px}
.hdr-search input{border:0;background:transparent;box-shadow:none;padding:2px 0;font-size:12.5px;width:150px;color:var(--g900)}
.hdr-search input:focus{outline:none;box-shadow:none}
.hdr-fin{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--g500);border-left:1px solid var(--g200);padding-left:9px;white-space:nowrap;cursor:pointer;user-select:none}
.hdr-fin input{width:13px;height:13px;cursor:pointer}
@media(max-width:900px){.hdr-search input{width:100px}.hdr-fin{display:none}}

/* NON-OFFICIAL global banner */
.training-banner{display:flex;align-items:center;gap:10px;background:repeating-linear-gradient(135deg,var(--amber-50),var(--amber-50) 14px,#fff6df 14px,#fff6df 28px);border:1px solid var(--amber-500);color:#7a4a06;border-radius:var(--radius-md);padding:9px 14px;font-size:12.5px;font-weight:600;margin-bottom:16px;box-shadow:var(--sh-optical)}
.training-banner .ic{font-size:16px;color:var(--orange-600)}

/* patient banner */
.pt-banner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(180deg,#eaf1fb,#f5f8fd);border:1px solid var(--blue-100);border-radius:var(--radius-lg);padding:10px 18px;margin-bottom:8px;position:sticky;top:0;z-index:140;box-shadow:var(--sh-optical);transition:padding .16s ease,border-radius .16s ease,box-shadow .16s ease}
.pt-banner.is-compact{padding:7px 12px;border-radius:0 0 var(--radius-md) var(--radius-md);box-shadow:0 8px 18px rgba(18,27,39,.12)}
.pt-banner.is-compact .pav{width:30px;height:30px;font-size:0}
.pt-banner.is-compact .pav .ic{font-size:14px}
.pt-banner.is-compact .pn{font-size:14px}
.pt-banner.is-compact .pm{font-size:10.5px;margin-top:0}
.pt-banner.is-compact .dx .l{display:none}
.pt-banner.is-compact .dx .v{font-size:12px;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-banner .pav{width:44px;height:44px;border-radius:var(--radius-full);background:var(--blue-700);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.pt-banner .pn{font-size:17px;font-weight:700}
.pt-banner .pm{font-size:12px;color:var(--g600);margin-top:2px}
.pt-banner .chip{background:var(--white);border:1px solid var(--g200);border-radius:var(--radius-full);padding:3px 11px;font-size:12px;font-weight:600;color:var(--g700)}
.pt-banner .dx{margin-left:auto;text-align:right}
.pt-banner .dx .l{font-size:10px;color:var(--g500);letter-spacing:.05em}
.pt-banner .dx .v{font-size:14px;font-weight:700;color:var(--blue-900)}
.pt-banner .banner-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pt-banner .banner-updated{font-size:10px;color:var(--g500);white-space:nowrap}
.pt-banner .banner-refresh{width:30px;height:30px;padding:0;justify-content:center;border-radius:50%}
.pt-banner.is-compact .banner-updated{display:none}

/* generic */
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:0}
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--radius-lg);box-shadow:var(--sh-optical)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--g150);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.card-h .sub{margin-left:auto;font-size:11px;color:var(--g500);font-weight:500}
.card-b{padding:14px 16px}
/* v46 — IPD Daily Workflow header/tabs compacted so the first screenful reaches today's Progress Note with less scrolling */
[data-ipd-panel]>.card-h{padding:8px 14px;font-size:12.5px}
[data-ipd-panel]>.card-b{padding:10px 14px}
[data-ipd-panel] .review-tabs{margin:0 0 6px}
.muted{color:var(--g500)}
.small{font-size:12px}
.xs{font-size:11px}
h3.sec{font-size:13px;font-weight:700;margin:2px 0 12px;letter-spacing:.02em}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--g700);margin:0 0 5px}
textarea,input[type=text],select{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--g300);border-radius:var(--radius-md);padding:9px 11px;background:var(--white);color:var(--g900);box-shadow:var(--sh-optical)}
textarea{min-height:74px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:2px solid var(--blue-100);border-color:var(--blue-500)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--g300);background:var(--white);color:var(--g800);border-radius:var(--radius-md);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--sh-control);transition:.14s}
.btn:hover{background:var(--g50)}
.btn:active{transform:translateY(1px)}

.ds-row .di{width:30px;height:30px;border-radius:7px;background:var(--teal-50);color:#0b6d6f;display:grid;place-items:center;flex:none}
.ds-row .dn{font-weight:700;font-size:13px}
.ds-row .dm{font-size:11px;color:var(--g500)}
.ds-row .df{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 8px}
.ds-row .df.tab{background:var(--blue-50);color:var(--blue-700)}
.ds-row .df.syr{background:var(--teal-50);color:#0b6d6f}
.ds-empty{padding:12px;color:var(--g400);font-size:12px;font-style:italic}
.opd-orderblock{border:1px solid var(--g200);border-radius:10px;overflow:visible;margin-bottom:12px}
.opd-orderblock .g-h{padding:10px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;border-radius:10px 10px 0 0}
.opd-orderblock.takehome .g-h{background:#eef6ec;color:var(--green-700)}
.opd-orderblock.onevisit .g-h{background:#eef1fb;color:var(--blue-700)}
.opd-orderblock .g-b{padding:12px 14px}
.ordersheet{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.order-day{font-size:10.5px;font-weight:800;color:var(--g500);letter-spacing:.035em;text-transform:uppercase;margin:10px 0 5px;padding-top:8px;border-top:1px dashed var(--g200)}
.order-day:first-child{margin-top:0;padding-top:0;border-top:0}
.os-group{border:1px solid var(--g200);border-radius:10px;overflow:hidden}
.os-group .g-h{padding:10px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.os-oneday .g-h{background:#eaf1fb;color:var(--blue-700)}
.os-cont .g-h{background:#e9f7ee;color:var(--green-700)}
.os-group .g-b{padding:12px 14px}
.os-line{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--g200);border-left:3px solid var(--orange-500);border-radius:8px;margin-bottom:8px;background:var(--white)}
.os-line.approved{border-left-color:var(--green-500)}
.os-line .txt{flex:1;font-size:12.5px}
.os-line .rm{border:0;background:transparent;color:var(--red-500);cursor:pointer;font-size:13px}
.os-empty{color:var(--g400);font-size:12px;font-style:italic;padding:8px}
.os-add{display:flex;gap:8px;margin-top:6px}
.os-add input{flex:1}

.soap-modal{max-width:900px!important}
.soap-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.soap-h .ttl{color:var(--blue-600);font-weight:800;font-size:16px}
.soap-start{display:inline-flex;align-items:center;gap:6px;background:var(--blue-600);color:#fff;border:0;border-radius:8px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer}
.soap-star{color:var(--blue-500);font-size:15px;background:none;border:0;cursor:pointer}
.soap-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0}
.soap-time{display:flex;align-items:center;gap:6px}
.soap-time input{width:52px;text-align:center}
.soap-field{position:relative;margin-top:14px}
.soap-field .lbl{position:absolute;left:0;top:9px;font-weight:800;color:var(--g700);font-size:14px;width:18px;text-align:center;z-index:1}
.soap-field textarea{padding-left:26px;background:#f4f8fe;border-color:#d5e3f6;min-height:64px}
.soap-mic{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--blue-500);color:#fff;display:grid;place-items:center;font-size:12px;border:0;cursor:pointer}
.soap-subtoolbar{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:6px;color:var(--blue-500)}
.soap-lastvital{background:#d99a2b;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:700;font-size:11.5px;cursor:pointer}
.soap-rt{display:flex;align-items:center;gap:14px;border:1px solid #d5e3f6;border-bottom:0;border-radius:8px 8px 0 0;background:var(--g25);padding:8px 12px;color:var(--g600);font-size:15px;margin-left:26px}
.soap-rt .tmpl{font-weight:700;font-size:12.5px;color:var(--g700)}
.soap-field.rt textarea{border-radius:0 0 8px 8px}
.stub{font-size:10px;color:var(--g400);font-style:italic}

/* ===== Drug-order dialog CSS, scoped under #rxRoot — aligned to the app's own EMR design tokens (:root) =====
   Consolidated single source of truth (previously 3+ overlapping/overridden layers of #rxRoot .modal/.body/.section
   rules plus 5 separate @media blocks; merged here into one cascade + 3 clean breakpoints, and tightened for a
   more compact, single-screen-fit default layout). */
#rxRoot{
  --navy:var(--g900); --ink:var(--g900); --muted:var(--g500); --hair:var(--g200);
  --teal:var(--blue-600); --teal-ink:var(--blue-700); --teal-tint:var(--blue-50);
  --gold:var(--amber-500); --gold-tint:var(--amber-50);
  --paper:var(--g50); --card:var(--white);
  --field-bg:var(--white); --field-border:var(--g300); --field-border-strong:var(--g400);
  --red:var(--red-600); --redbg:var(--red-50);
  --amber:#8a5106; --amberbg:var(--amber-50);
  --green:var(--green-700); --greenbg:var(--green-50);
  --r-sm:var(--radius-sm); --r-md:var(--radius-md); --r-lg:var(--radius-lg);
  --font-serif:var(--font); --font-sans:var(--font);
  color-scheme: light only;  /* pinned light — reference dark-scheme palette removed (stakeholder: "Dark mode ดูและใช้ยาก") */
  font-family:var(--font-sans);color:var(--ink);
}
#rxRoot .modal,#rxRoot input,#rxRoot select,#rxRoot textarea,#rxRoot button{font-family:var(--font-sans)}
#rxRoot .ms4-notice{display:flex;align-items:center;gap:9px;background:repeating-linear-gradient(135deg,var(--amber-50),var(--amber-50) 14px,#fff6df 14px,#fff6df 28px);color:#7a4a06;border-bottom:1px solid var(--amber-500);padding:6px 14px;font-size:11.5px;font-weight:600}
#rxRoot.ms4 .modal{border-top:3px solid var(--blue-700)}
#rxRoot.ms4 .mtitle{color:var(--blue-700);font-family:inherit;font-weight:700}
#rxRoot.ms4 .rx-noff{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-100)}
#rxRoot.ms4 .btn.primary{background:var(--blue-700);border-color:var(--blue-700)}
#rxRoot button, #rxRoot input, #rxRoot select, #rxRoot textarea{font-family:inherit}
#rxRoot .rx-noff{font-size:9.5px;font-weight:800;color:#8a5106;background:var(--amber-50);border:1px solid var(--amber-500);border-radius:20px;padding:2px 9px;margin-left:8px;vertical-align:middle}
#rxRoot .rx-red{color:var(--red)!important;font-weight:800}

/* ---- overlay + modal shell ---- */
#rxRoot .back{position:fixed;inset:0;z-index:1200;background:rgba(11,18,29,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:10px}
#rxRoot .back.open{display:flex}
#rxRoot .modal{width:min(900px,96vw);max-width:min(900px,96vw);height:auto;max-height:min(700px,calc(100vh - 20px));background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-overlay,0 18px 48px rgba(18,27,39,.18));overflow:hidden;position:relative;display:flex;flex-direction:column}
#rxRoot .modal>*{flex:none}
#rxRoot .modal>.body{flex:1 1 auto;min-height:0}
#rxRoot .mhead{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--hair);gap:12px;min-height:40px}
#rxRoot .mtitle{font-family:var(--font);font-size:14px;font-weight:700}
#rxRoot .mmeta{display:none}
#rxRoot .x{width:28px;height:28px;border:0;background:transparent;font-size:18px;color:var(--muted);cursor:pointer;border-radius:8px;flex:none}
#rxRoot .x:hover{background:var(--g100)}
#rxRoot .allergy-banner{display:none;align-items:center;gap:10px;background:var(--redbg);color:var(--red);padding:7px 14px;font-size:12px;font-weight:700;border-bottom:1px solid var(--red-100,#fee2e2)}
#rxRoot .allergy-banner.show{display:flex}
#rxRoot .allergy-banner .ic{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;font-size:11px}

/* ---- body: two-column grid (form + sticky order-to sidebar) ---- */
#rxRoot .body{min-height:0;overflow:auto;padding:10px 12px;background:var(--g75,var(--paper));display:grid;grid-template-columns:minmax(0,1fr) 184px;gap:10px;align-items:start}
#rxRoot .clinical{min-width:0;display:flex;flex-direction:column;gap:7px}
#rxRoot .section{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-md);padding:7px 10px}
#rxRoot .section+.section{margin-top:0}
/* dose & administration section is no longer visually distinct — one cohesive card style across the form, per app design language */
#rxRoot .section.dose-section{background:var(--card);border-color:var(--hair);box-shadow:none}
#rxRoot .section.dose-section .sectitle{color:var(--muted)}
#rxRoot .section.dose-section .sectitle:before{display:none}
#rxRoot .sectitle{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:0 0 5px;display:flex;align-items:center;gap:7px}
#rxRoot .sectitle:before{display:none}
#rxRoot .row{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:flex-start}
#rxRoot .field{display:flex;flex-direction:column;flex:0 0 auto}
#rxRoot .field.grow{flex:1 1 220px}
#rxRoot label:not(.switch){display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rxRoot .req{color:var(--red)}
#rxRoot input, #rxRoot select, #rxRoot textarea, #rxRoot .fieldline, #rxRoot .toggleline, #rxRoot .calendar-control{height:29px}
/* v45 — every bare input/select/textarea gets an explicit size (was font:inherit, so date/time + qty pickers silently
   inherited whatever ambient page font-size was in scope — that's why they looked oversized/inconsistent vs. the
   rest of the compact 10–12px scale used throughout this dialog). Unified to the same 12px body-text size the
   other rxRoot form text already converges on. */
#rxRoot input, #rxRoot select, #rxRoot textarea{border:1px solid var(--g200);border-radius:var(--r-sm);background:var(--white);color:var(--ink);font-family:inherit;font-size:12px;padding:0 9px;outline:0;transition:border-color .12s,box-shadow .12s}
#rxRoot input:hover, #rxRoot select:hover, #rxRoot textarea:hover{border-color:var(--g300)}
#rxRoot input:focus, #rxRoot select:focus, #rxRoot textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-50)}
#rxRoot input[readonly]{background:var(--g100);color:var(--muted)}
#rxRoot select{cursor:pointer}
#rxRoot .w-xs{width:68px}
#rxRoot .w-sm{width:90px}
#rxRoot .w-md{width:140px}
#rxRoot .w-lg{width:180px}
#rxRoot .w-dt{width:198px}
#rxRoot .w-freq{width:100%}
#rxRoot .fieldline{border:1px solid var(--g200);border-radius:var(--r-sm);background:var(--white);display:flex;align-items:center;overflow:hidden;transition:border-color .12s,box-shadow .12s}
#rxRoot .fieldline:hover{border-color:var(--g300)}
#rxRoot .fieldline:focus-within{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-50)}
#rxRoot .fieldline input{border:0!important;background:transparent!important;box-shadow:none!important;height:27px;width:auto;min-width:0;flex:1 1 auto;padding:0 8px 0 9px}
#rxRoot .fieldline .unit{flex:0 0 auto;padding:0 8px;color:var(--g600);background:var(--g100);border-left:1px solid var(--g200);height:100%;display:flex;align-items:center;font-size:10.5px;font-weight:600;white-space:nowrap}
#rxRoot .equiv{font-size:10px;color:var(--teal-ink);margin-top:2px}
#rxRoot .qty-hint{font-size:10px;color:var(--teal-ink);margin-top:2px;max-width:300px;line-height:1.4}
#rxRoot .qty-hint[hidden]{display:none!important}
#rxRoot .toggleline{display:flex;align-items:center;gap:7px}
/* v49 — a page-wide .switch::after rule (a different toggle component's knob, used elsewhere in the app) was bleeding
   into this modal's own .slider-based toggle, drawing a second phantom knob on top of the real one whenever "on". */
#rxRoot .switch::after{content:none}
#rxRoot .switch{position:relative;width:32px;height:18px;flex:none;margin:0;background:none}
#rxRoot .switch input{opacity:0;width:0;height:0;position:absolute}
#rxRoot .switch:before{content:"";position:absolute;inset:-10px}
#rxRoot .slider{position:absolute;inset:0;background:var(--g300);border-radius:20px;cursor:pointer;transition:.15s}
#rxRoot .slider:after{content:"";position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;left:3px;top:3px;transition:.15s}
#rxRoot .switch input:checked+.slider{background:var(--blue-600)}
#rxRoot .switch input:checked+.slider:after{transform:translateX(14px)}
#rxRoot .togglelabel{font-size:11px;color:var(--muted);font-weight:600}
#rxRoot .toggle-example{display:none;font-size:10px;color:var(--muted);margin-top:4px;max-width:170px;line-height:1.4}
#rxRoot .toggle-example.show{display:block}
#rxRoot .toggle-cluster{display:flex;align-items:flex-end;gap:16px;padding:2px 0 0 4px}
#rxRoot .toggle-cluster .field{min-width:88px}
#rxRoot .toggle-inline{display:flex;align-items:flex-start;gap:12px}
#rxRoot .toggle-inline .field{min-width:0}

/* ---- advanced / PRN / multiple / taper sub-panels (conditional, only shown when opened) ---- */
#rxRoot .prnpanel{display:none;margin-top:7px;background:var(--blue-50);border-radius:var(--r-sm);padding:7px 10px}
#rxRoot .prnpanel.show{display:block}
#rxRoot .prnpanel label{margin-bottom:4px}
#rxRoot .prnpanel select{max-width:340px;background:var(--card)}
#rxRoot .advanced-panel{display:none;margin-top:5px;padding:6px 8px;border-radius:var(--r-sm);background:var(--g50);border:1px solid var(--g200);overflow-x:auto}
#rxRoot .advanced-panel.show{display:block}
#rxRoot .advanced-title{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:10.5px;font-weight:800;color:var(--g700)}
#rxRoot .advanced-title .mode-badge{padding:2px 8px;border-radius:12px;background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100);font-size:9.5px}
#rxRoot .advanced-summary{margin-left:auto;color:var(--teal-ink);font-weight:750;font-size:10px}
#rxRoot .multi-grid{display:grid;grid-template-columns:80px repeat(3,minmax(120px,1fr));gap:4px 8px;align-items:center}
#rxRoot .multi-grid .axis{font-size:9.5px;font-weight:700;color:var(--muted)}
#rxRoot .multi-head{text-align:center;font-size:10px;font-weight:800;color:var(--ink)}
#rxRoot .multi-head label{display:inline-flex;align-items:center;gap:5px;margin:0;color:var(--ink);cursor:pointer}
#rxRoot .multi-head input[type="checkbox"]{width:13px;height:13px;accent-color:var(--blue-600)}
#rxRoot .meal-relation{height:26px!important;width:98px;padding:0 5px;font-size:10px;background:var(--card)}
#rxRoot .multi-slot-off{opacity:.38;filter:grayscale(.2)}
#rxRoot .multi-cell{display:flex;align-items:center;justify-content:center;gap:5px}
#rxRoot .multi-cell input{height:26px;width:72px;text-align:center;background:var(--card)}
#rxRoot .multi-unit{font-size:10px;color:var(--muted)}
/* v49 — column widths trimmed to actually fit inside the (narrower) left column of the two-column body without a
   horizontal scrollbar — Start/End keep just enough room for "30-Sep-2026" at the unified 12px input font. */
#rxRoot .taper-head, #rxRoot .taper-row{display:grid;grid-template-columns:20px 44px 38px minmax(110px,1fr) 36px 92px 92px 38px 18px;gap:5px;align-items:center}
#rxRoot .taper-head{font-size:9px;font-weight:800;color:var(--muted);margin-bottom:2px}
#rxRoot .taper-row{padding:2px 0;border-top:1px solid var(--g150)}
#rxRoot .taper-row input, #rxRoot .taper-row select{height:26px;padding:0 6px;background:var(--card);font-size:10px;width:100%}
#rxRoot .taper-seq{text-align:center;font-size:10px;font-weight:800;color:var(--g700)}
#rxRoot .taper-qty{text-align:center;font-size:10px;font-weight:800}
#rxRoot .row-action{width:24px;height:24px;min-width:28px;min-height:28px;border:1px solid var(--red-100,#fee2e2);border-radius:50%;background:#fff;color:var(--red);cursor:pointer;font-weight:800}
#rxRoot .add-phase{margin-top:4px;border:0;background:transparent;color:var(--blue-700);font-size:10px;font-weight:800;cursor:pointer;padding:2px 0}
#rxRoot .daysub{font-size:10px;color:var(--teal-ink);margin-top:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rxRoot .daypicker{position:relative}
#rxRoot .calendar-btn{width:100%;height:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:12px;text-align:left;padding:0 10px 0 28px;position:relative;cursor:pointer}
#rxRoot .calendar-btn:before{content:"";position:absolute;left:9px;top:50%;width:12px;height:11px;transform:translateY(-50%);border:1.5px solid currentColor;border-radius:2px;box-shadow:inset 0 3px 0 var(--white),inset 0 4.5px 0 currentColor}
#rxRoot .daypanel{position:absolute;left:0;bottom:34px;z-index:5;width:300px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--sh-elev);padding:10px;display:none}
#rxRoot .daypanel.open{display:block}
#rxRoot .daytitle{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;margin-bottom:7px}
#rxRoot .daychips{display:flex;gap:5px}
#rxRoot .daychip input{display:none}
#rxRoot .daychip span{width:34px;height:27px;display:grid;place-items:center;border:1px solid var(--hair);border-radius:7px;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer}
#rxRoot .daychip input:checked+span{background:var(--blue-50);border-color:var(--blue-600);color:var(--blue-700)}
#rxRoot .link{border:0;background:transparent;color:var(--blue-700);padding:0;font-weight:700;cursor:pointer;font-size:11px}

/* ---- dose focus, formulas, safety / override / double-check (conditional) ---- */
#rxRoot .dose-focus>label{color:var(--blue-700);font-weight:800}
#rxRoot .dose-focus .fieldline{border-color:var(--blue-500);box-shadow:0 0 0 1px var(--blue-100)}
#rxRoot .dose-focus .fieldline:hover, #rxRoot .dose-focus .fieldline:focus-within{border-color:var(--blue-600);box-shadow:0 0 0 2px var(--blue-100)}
#rxRoot .dose-focus .fieldline input{color:var(--blue-700);font-size:13.5px;font-weight:800}
#rxRoot .dose-focus .equiv{color:var(--blue-700);font-weight:700}
#rxRoot .formula{border-radius:var(--r-sm);background:var(--blue-50);color:var(--blue-700);padding:7px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11.5px}
#rxRoot .formula b{color:var(--blue-700);font-size:12.5px}
#rxRoot .formula.danger{background:var(--redbg);color:var(--red)}
#rxRoot .formula.danger b{color:var(--red)}
#rxRoot .override{max-height:0;overflow:hidden;opacity:0;background:var(--amberbg);border-radius:var(--r-sm);padding:0 11px;margin-top:0;transition:max-height .18s ease,opacity .18s ease,padding .18s ease,margin-top .18s ease}
#rxRoot .override.show{max-height:160px;opacity:1;padding:7px 11px;margin-top:7px}
#rxRoot .safety{display:flex;align-items:flex-start;gap:8px;background:var(--greenbg);border-radius:var(--r-sm);padding:8px 11px}
#rxRoot .shield{width:20px;height:20px;border-radius:7px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
#rxRoot .safetytext{font-size:11px;color:var(--green);line-height:1.4}
#rxRoot .safetytext b{display:block;font-size:11px;text-transform:none;margin-bottom:2px}
#rxRoot .safety.danger{background:var(--redbg)}
#rxRoot .safety.danger .shield{background:var(--red)}
#rxRoot .safety.danger .safetytext, #rxRoot .safety.danger .safetytext b{color:var(--red)}
#rxRoot .dblcheck{display:none;margin-top:6px;align-items:flex-start;gap:8px;background:var(--card);border:1px dashed var(--amber);border-radius:var(--r-sm);padding:7px 9px}
#rxRoot .dblcheck.show{display:flex}
#rxRoot .dblcheck input{width:15px;height:15px;margin-top:2px}
#rxRoot .dblcheck label{margin:0;font-size:11px;color:var(--amber);font-weight:600}
#rxRoot .dangerqty{border-color:var(--red)!important;background:var(--redbg)!important}
#rxRoot .dangerqty input{color:var(--red);font-weight:700}
#rxRoot .clinical-block-message{display:none}
#rxRoot .clinical-block-message.show{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;background:var(--amberbg);color:var(--amber);font-size:10px;line-height:1.35}
#rxRoot .clinical-block-message.danger{background:var(--redbg);color:var(--red)}

/* ---- context section (own med / type / start / end) — one compact row ---- */
#rxRoot .context-section{background:transparent;border-color:transparent;border-bottom:1px solid var(--hair);border-radius:0;padding:3px 2px 6px}
#rxRoot .context-section .sectitle{display:none}
#rxRoot .context-section .row{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:6px 10px;width:100%;align-items:start}
#rxRoot .context-section .field, #rxRoot .context-section input, #rxRoot .context-section select{min-width:0;width:100%}

/* ---- dose/administration main row (usage/dose/route/frequency) ---- */
#rxRoot .clinical-order-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;align-items:start}
#rxRoot .clinical-order-row>.field, #rxRoot .clinical-order-row>.toggle-inline{min-width:0}
#rxRoot .clinical-order-row input, #rxRoot .clinical-order-row select, #rxRoot .clinical-order-row .fieldline, #rxRoot .clinical-order-row .calendar-control{width:100%!important;min-width:0;max-width:100%}

#rxRoot .clinical-order-row>.daypicker{grid-column:span 1}
#rxRoot .clinical-order-row>.toggle-inline{grid-column:1 / -1;display:flex;gap:24px;padding-top:1px}

/* ---- remaining generic sections (duration/quantity/sale UOM etc) ---- */
#rxRoot .section:not(.dose-section):not(.context-section):not(.notes-section) .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px}
#rxRoot .section:not(.dose-section):not(.context-section):not(.notes-section) .row .field, #rxRoot .section:not(.dose-section):not(.context-section):not(.notes-section) .row .fieldline, #rxRoot .sale-uom{width:100%!important;min-width:0}
#rxRoot .sale-uom{width:116px}

/* ---- notes (3-up, auto-growing textareas kept small by default) ---- */
#rxRoot .notes-section{background:transparent;border:0;border-top:1px solid var(--hair);border-radius:0;padding:6px 2px 0}
#rxRoot .notes-section .sectitle{color:var(--muted);font-weight:600;margin-left:6px}
#rxRoot .notes-section .sectitle:before{display:none}

#rxRoot .notes-section textarea:focus{background:var(--card)}
#rxRoot .notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
#rxRoot .notes .field{min-width:0}
#rxRoot .notes textarea{width:100%;height:34px;min-height:34px;padding:5px 8px;resize:none;font-size:11px;line-height:1.35}
#rxRoot .notehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
#rxRoot .notehead label{margin:0}
#rxRoot .helperline{font-size:10px;color:var(--amber);margin-top:3px}

/* ---- history alert / label preview (compact, only shown when relevant) ---- */
#rxRoot .history-alert{display:none;background:var(--amberbg);border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:5px 9px;color:var(--amber);font-size:10.5px;line-height:1.4;min-height:0}
#rxRoot .history-alert.show{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
#rxRoot .history-alert b{color:var(--ink)}
#rxRoot .history-kicker{font-size:10px;font-weight:800;white-space:nowrap}
#rxRoot .history-main{font-weight:750;color:var(--ink)}
#rxRoot .history-meta{grid-column:2;text-align:left;font-size:10px;white-space:normal;color:var(--g600)}
#rxRoot .quick-hint{font-size:10px;color:var(--muted);margin-top:3px}
#rxRoot .label-preview{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:5px 9px;width:100%;min-height:0}
#rxRoot .label-preview small{display:block;color:var(--muted);font-size:9.5px;font-weight:800;margin-bottom:2px}
#rxRoot .label-main{font-size:11px;color:var(--ink);line-height:1.4}
#rxRoot .label-main b{color:var(--teal-ink)}
#rxRoot .label-note{display:none;color:var(--amber);margin-top:3px;padding-top:3px;border-top:1px dashed var(--g200)}
#rxRoot .label-note.show{display:block}
#rxRoot .invalid{box-shadow:inset 0 -2px 0 var(--red)!important}

/* ---- mode-open (quick order parsed) trims optional blocks further ---- */
#rxRoot .mode-open .notes-section{display:none}
#rxRoot .mode-open .history-alert{min-height:0;padding:4px 8px}
#rxRoot .mode-open .history-meta{display:none}
#rxRoot .mode-open .label-preview{padding:4px 8px;min-height:0}
#rxRoot .mode-open .label-preview small{display:none}

/* ---- sidebar: order-to / stock / qty / remain / price ---- */
#rxRoot .other{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-md);padding:9px;align-self:start;position:sticky;top:0;min-width:0}
#rxRoot .other.disabled{opacity:.45;pointer-events:none}
#rxRoot .othertitle{font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--navy)}
#rxRoot .othersub{font-size:9.5px;color:var(--muted);margin:2px 0 7px}
#rxRoot .warehouse-select{width:100%;height:29px;margin-top:4px;font-size:11px}
#rxRoot .orow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hair);font-size:10.5px;color:var(--muted)}
#rxRoot .orow b{color:var(--ink);font-weight:700}
#rxRoot .ostate{margin:7px 0;padding:6px 8px;border-radius:var(--r-sm);background:var(--greenbg);color:var(--green);font-size:10px;font-weight:600}
#rxRoot .ostate.bad{background:var(--redbg);color:var(--red)}
#rxRoot .price{text-align:center;font-size:10px;color:var(--muted);margin-top:5px}
#rxRoot .byom-note{display:none;background:var(--gold-tint);color:#8a5106;border-radius:var(--r-sm);padding:7px;font-size:10px;font-weight:600;text-align:center}
#rxRoot .byom-note.show{display:block}

/* ---- footer: summary + action buttons ---- */
#rxRoot .mfoot{display:flex;align-items:center;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--hair);gap:12px;background:var(--card);min-height:0}
#rxRoot .summary{flex:1;min-width:0;font-size:11px}
#rxRoot .summary small{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-bottom:2px}
#rxRoot .summary span{color:var(--muted);white-space:normal;line-height:1.35}
#rxRoot .summary b{color:var(--teal-ink)}
#rxRoot .btns{display:flex;gap:8px;flex:none}
#rxRoot .btn{height:32px;padding:0 14px;border:1px solid var(--g200);border-radius:var(--r-sm);background:var(--card);color:var(--g700);font-weight:700;cursor:pointer;font-size:12px}
#rxRoot .btn:hover{background:var(--g75)}
#rxRoot .btn.primary{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
#rxRoot .btn.primary:hover{background:var(--blue-700);border-color:var(--blue-700)}
#rxRoot .btn.primary:disabled{background:var(--g300);border-color:var(--g300);cursor:not-allowed}
#rxRoot .toast{position:fixed;z-index:30;right:20px;top:18px;background:var(--g900);color:#fff;padding:11px 15px;border-radius:9px;opacity:0;transform:translateY(-6px);transition:.2s;font-size:12.5px;box-shadow:var(--sh-elev)}
#rxRoot .toast.show{opacity:1;transform:none}

/* ---- responsive: shrink further on short viewports (laptop-height screens) ---- */
@media(max-height:760px){
#rxRoot .mhead{padding:6px 12px;min-height:36px}
#rxRoot .mtitle{font-size:13px}
#rxRoot .body{padding:7px 10px;gap:8px}
#rxRoot .clinical{gap:5px}
#rxRoot .section{padding:6px 9px}
#rxRoot .sectitle{margin-bottom:3px}

#rxRoot .fieldline input{height:25px}
#rxRoot label:not(.switch){margin-bottom:2px;font-size:9.5px}
#rxRoot .notes textarea{height:26px;min-height:26px}
#rxRoot .history-alert, #rxRoot .label-preview{padding:4px 8px}
#rxRoot .mfoot{padding:6px 12px}
#rxRoot .btn{height:29px}
#rxRoot .advanced-panel{padding:5px 8px;margin-top:4px}
#rxRoot .advanced-title{margin-bottom:4px}
#rxRoot .multi-grid{gap:3px 7px}
#rxRoot .multi-cell input{height:25px}
#rxRoot .meal-relation{height:24px!important}
#rxRoot .taper-row input, #rxRoot .taper-row select{height:25px}
}

#rxRoot .back{padding:0}
}

/* ===== MS4 (นศพ. ปี 4) — Assign → Consent → Gather → Present → Teach → Revise Note → Verify → Logbook ===== */
.workspace:has(.ms4-ctx) .surface{overflow:visible}

.ms4-row.exc td{background:var(--g25);color:var(--g500)}

.ms4-acts{display:inline-flex;gap:5px}
.ms4-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.review-tab.locked{color:var(--g400);border-style:dashed;background:var(--g25)}
.pm-switch{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--g200);border-radius:var(--radius-full);background:#fff;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--g600)}

.pm-switch .trk::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}

.pm-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 0 10px;border-radius:8px;background:var(--blue-50);border:1px solid var(--blue-100);color:var(--blue-900);font-size:12.5px}

/* MS4 workspace: single light-blue underline field, auto-growing (see autoGrowField) */
textarea.field-line,input.field-line{border:0;border-bottom:1px solid #bcd3f2;border-radius:0;background:transparent;box-shadow:none;padding:6px 2px 5px;min-height:0;height:auto;resize:none;overflow:hidden;line-height:1.55;font-size:13px;color:var(--g900);display:block}

.ms4-ctx .field-line.invalid{border-color:transparent!important;border-bottom:2px solid var(--red-500)!important;background:transparent!important}
.ms4-ctx .req-miss{color:var(--red-600)!important}
.ms4-ctx .req-miss::after{content:'! ต้องกรอก';display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--red-500);color:#fff;font-size:10px;font-weight:700;letter-spacing:0}

.pk.open .pk-m{display:block}

.pk-m .pk-none{padding:8px 10px;color:var(--g500);font-style:italic}

.pk-m .it:hover{background:#eef4fc}

.pk-m .st{border:0;background:transparent;cursor:pointer;color:var(--g400);font-size:13px}
.pk-m .st.on{color:#e0a100}
.pk-m .sub{font-size:10.5px;color:var(--g500)}

function view_dashboard(){
  if(state.role==='attending'){ return view_attending_dashboard(); }
  const s=actingStudent();
  setPage('EDUCATION','แดชบอร์ด · '+s.name.replace('นศพ. ',''));
  const all=state.assignments.filter(a=>a.s===s.id).map(a=>patient(a.p));
  const q=(state.search||'').trim().toLowerCase();
  const activeAll=p=>(state.showFinished||!p.discharged)&&(!q||p.name.toLowerCase().includes(q)||p.hn.toLowerCase().includes(q));
  // per-patient flags — the SAME numbers feed both the kpi cards above and the Patient list below,
  // so a card's count and the list you get from clicking it always match (no separately-scoped totals)
  const flagsFor=p=>{
    const en=entriesFor(s.id,p.id);
    const sub=en.filter(e=>e.status==='submitted').length, okr=en.filter(e=>e.status==='reviewed-ok'||e.officialCopyId).length;
    const returned=en.filter(e=>e.status==='returned').length, notes=en.filter(e=>e.feedback&&e.feedback.length).length;
    const ordPending=state.orders.some(o=>o.s===s.id&&o.p===p.id&&o.status==='pending')||state.discharges.some(d=>d.s===s.id&&d.p===p.id&&d.status==='pending');
    return {en,sub,okr,returned,notes,ordPending};
  };
  const forSetting=setting=>all.filter(p=>p.setting===setting).filter(activeAll);
  const ipdList=forSetting('IPD'), opdList=forSetting('OPD');
  const ctxList=state.ctx==='IPD'?ipdList:opdList;

  };
  const activeFilter=state.dashFilter&&filterDefs[state.dashFilter]?filterDefs[state.dashFilter]:null;
  let listNow=ctxList;

    +wfCard('a-green','KPI / Portfolio','goKpi',kAch+' / '+kTot,'บรรลุเป้าหมายเทอมนี้'+(kMiss>0?' · <span class="red">ขาด '+kMiss+'</span>':''))
    +'</div>';
  const m=$('#main');m.innerHTML=h;
  wireDashActions(m,s);

function wireDashActions(m,s){
  const nav={goDoc:'document',goHw:'homework',goOrders:'orders',goPrc:'procedures',goDc:'discharge',goKpi:'kpi',goAppr:'approvals'};
  m.querySelectorAll('[data-action]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();const a=b.dataset.action;
    if(a==='refresh'){toast('รีเฟรชข้อมูลแล้ว','refresh');return;}
    if(a==='portfolio'){ if(s) openPortfolioModal(s.id); return; }
    if(a==='switchCtx'){ state.ctx=b.dataset.ctx; state.dashFilter=null; render(); return; }
    if(a==='toggleFilter'){ state.dashFilter = state.dashFilter===b.dataset.filter ? null : b.dataset.filter; render(); return; }
    if(nav[a]){ state.view=nav[a]; render(); }
  });
  m.querySelectorAll('tr[data-row]').forEach(r=>r.onclick=()=>{
    if(state.role==='attending'){ const[sid,pid]=r.dataset.att.split('|'); state.selStudent=sid; state.selPatient=pid; state.reviewCtx=patient(pid).setting; state.compareOpen=true; state.view='dashboard'; render(); }
    else { const pt=patient(r.dataset.pt); if(pt) state.ctx=pt.setting; state.selPatient=r.dataset.pt; state.view='document'; render(); }
  });
}

function tsForEntry(e){
  if(e.ts) return e.ts;
  let h=0; for(let i=0;i<e.id.length;i++) h=(h*31+e.id.charCodeAt(i))>>>0;
  const day=12+(h%4), hh=8+(h%10), mm=(h*7)%60;
  const pad=n=>String(n).padStart(2,'0');
  return pad(day)+' ก.ย. 2569 '+pad(hh)+':'+pad(mm);
}
function studentEntryBox(e,opts={}){
  // plain, paper-like log line: "<date time> : <text>" + a green check when a doctor has
  // approved it, plus a small note icon when that approval came with feedback.
  const approved=e.status==='reviewed-ok';
  const hasNote=!!(e.feedback&&e.feedback.length>0);
  const ts=tsForEntry(e);
  if(e.soap){
    const statusHint=approved?'<span class="tag tag-approved">ผ่าน</span>':e.status==='returned'?'<span class="tag tag-rejected">ไม่ผ่าน · ต้องแก้</span>':'<span class="tag '+(e.status==='submitted'?'tag-review':'tag-draft')+'">'+(e.status==='submitted'?'รอตรวจ':'ร่าง')+'</span>';
    const fb=hasNote?'<div class="log-fb">'+e.feedback.map(f=>ic('comment')+' '+esc(f.text)+' <span class="muted">— '+f.by+'</span>').join('<br>')+'</div>':'';
    return '<div class="log-entry" data-entry="'+e.id+'"><div style="display:flex;align-items:center;gap:7px"><span class="log-ts">'+ts+'</span>'+(approved?'<span class="log-approved" title="แพทย์รับรองแล้ว">'+ic('checkc')+'</span>':'')+statusHint+(opts.actions?'<span class="log-actions" style="margin-left:auto">'+opts.actions+'</span>':'')+'</div>'
      +'<div class="soap-readonly">'+['S','O','A','P'].map(k=>'<div class="soap-k">'+k+'</div><div class="soap-v">'+esc(e.soap[k]||'—')+'</div>').join('')+'</div>'+fb+'</div>';
  }
  const oneLine=String(e.text).replace(/\\n/g,' ');
  const LIMIT=110;
  const isLong=oneLine.length>LIMIT;
  const shownEsc=esc(isLong?oneLine.slice(0,LIMIT):oneLine);
  const fullEsc=esc(oneLine);
  const approvedIcon=approved?'<span class="log-approved" title="แพทย์รับรองแล้ว">'+ic('checkc')+'</span>':'';
  const noteIcon=hasNote?'<span class="log-note" title="มี Feedback จากอาจารย์">'+ic('note')+'</span>':'';
  const statusHint=approved?'<span class="tag tag-approved">ผ่าน</span>':e.status==='returned'?'<span class="tag tag-rejected">ไม่ผ่าน · ต้องแก้</span>':'<span class="tag '+(e.status==='submitted'?'tag-review':'tag-draft')+'">'+(e.status==='submitted'?'รอตรวจ':'ร่าง')+'</span>';
  let fb='';
  if(hasNote){
    fb='<div class="log-fb">'+e.feedback.map(f=>ic('comment')+' '+esc(f.text)+' <span class="muted">— '+f.by+'</span>').join('<br>')+'</div>';
  }
  let h='<div class="log-entry" data-entry="'+e.id+'">'
    +'<span class="log-ts">'+ts+'</span> : '
    +'<span class="log-txt" data-full="'+fullEsc.replace(/"/g,'&quot;')+'">'+shownEsc+(isLong?'…':'')+'</span>'
    +(isLong?' <span class="log-more" data-entrymore>ดูเพิ่มเติม</span>':'')
    +approvedIcon+noteIcon+statusHint
    +(opts.actions?'<span class="log-actions">'+opts.actions+'</span>':'')
    +fb+'</div>';
  if(e.officialCopyId){
    const oc=state.patients.flatMap(p=>p.emr).find(r=>r.id===e.officialCopyId);
    if(oc) h+='<div class="log-entry" data-official="'+oc.id+'"><span class="log-ts">'+ts+'</span> : <span class="log-txt">'+esc(oc.text)+'</span> <span class="log-approved" title="เข้าสู่ EMR จริงแล้ว">'+ic('checkc')+'</span><span class="log-who">OFFICIAL · '+oc.author+'</span></div>';
  }
  return h;
}

  h+='</div>';
  const m=$('#main');m.innerHTML=h;

  m.querySelectorAll('[data-action="openRealEmr"]').forEach(b=>b.onclick=()=>openRealEmr(b.dataset.pt));
  m.querySelectorAll('[data-action="toggleCompare"]').forEach(b=>b.onclick=()=>{ state.compareOpen=!state.compareOpen; renderCompareDrawer(); });
  wireLogMore(m);
  m.querySelectorAll('[data-sectoggle]').forEach(hd=>hd.onclick=(e)=>{ if(e.target.closest('button')||e.target.closest('.tools'))return; const sec=hd.closest('.emr-sec'); const body=sec.querySelector('.emr-sec-body'); const col=sec.classList.toggle('collapsed'); body.hidden=col; });
  m.querySelectorAll('[data-inline-save]').forEach(b=>b.onclick=()=>commitInlineEntry(s,p,b.closest('[data-inline-kind]'),'draft'));
  m.querySelectorAll('[data-inline-send]').forEach(b=>b.onclick=()=>commitInlineEntry(s,p,b.closest('[data-inline-kind]'),'submitted'));
  m.querySelectorAll('[data-soap-save]').forEach(b=>b.onclick=()=>commitInlineSoap(s,p,b.closest('[data-inline-soap]'),'draft'));
  m.querySelectorAll('[data-soap-send]').forEach(b=>b.onclick=()=>commitInlineSoap(s,p,b.closest('[data-inline-soap]'),'submitted'));
  m.querySelectorAll('[data-dc-send]').forEach(b=>b.onclick=()=>commitInlineDischarge(s,p,b.closest('.discharge-inline')));
  /* MS Note input/visibility handled by the shared delegated handler (msNoteBodyHtml) */
  m.querySelectorAll('[data-dispo-pick]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.dispoPick; state.opdDispo[p.id]=v; const box=b.closest('[data-dispo]'); box.dataset.dispo=v;
    box.querySelectorAll('[data-dispo-pick]').forEach(x=>{x.classList.toggle('on',x.dataset.dispoPick===v);x.setAttribute('aria-checked',x.dataset.dispoPick===v);});
    box.querySelectorAll('[data-dispo-panel]').forEach(x=>x.hidden=x.dataset.dispoPanel!==v);
  });
  m.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>{
    const e=state.entries.find(x=>x.id===b.dataset.submit); e.status='submitted'; e.submitted=true;
    audit({act:'submit-homework',by:s.id,entry:e.id});

  });
  m.querySelectorAll('[data-revise]').forEach(b=>b.onclick=()=>openReviseEntryModal(b.dataset.revise));
  wireOrderArea(s,p,m);
  m.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.nav; m.querySelectorAll('.emr-nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    if(t){ const sec=document.getElementById(t); if(sec){ if(sec.classList.contains('collapsed')){sec.classList.remove('collapsed');const bd=sec.querySelector('.emr-sec-body');if(bd)bd.hidden=false;} sec.scrollIntoView({behavior:'smooth',block:'start'}); sec.style.transition='background .6s'; sec.style.background='#eef4ff'; setTimeout(()=>sec.style.background='',700); if(t==='sec-msnote'){const ta=sec.querySelector('[data-msnote-text]'); if(ta) setTimeout(()=>ta.focus({preventScroll:true}),450);} } }
    else toast('ส่วนนี้เป็น read-only ในชั้นฝึก (แสดงตาม EMR จริง)','info');

  // A1: auto-focus the drug-search so the doctor can type a drug immediately (cursor ready); don't steal focus from a text field the user is editing inside the chart

  const typingInMain=ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.closest && ae.closest('#main');
  if(firstDs && !typingInMain){ try{ firstDs.focus({preventScroll:true}); }catch(e){ firstDs.focus(); } }

function commitInlineEntry(s,p,box,status){
  const text=box.querySelector('[data-inline-text]').value.trim();
  if(!text){toast('กรุณากรอกเนื้อหา','warn');box.querySelector('textarea').focus();return;}
  const kind=box.dataset.inlineKind,id='ENT-'+(state.entries.length+20);
  state.entries.push({id,s:s.id,p:p.id,kind,ctx:p.setting,text,status,officialCopyId:null,submitted:status==='submitted',feedback:[]});
  audit({act:status==='submitted'?'create-and-submit-entry':'create-draft-entry',by:s.id,entry:id,kind});
  toast(status==='submitted'?'บันทึกและส่งให้อาจารย์ตรวจแล้ว':'บันทึกร่างแล้ว',status==='submitted'?'send':'save');
  render();
}
function commitInlineSoap(s,p,box,status){
  const val=k=>(box.querySelector('[data-soap="'+k+'"]')||{}).value?.trim()||'';
  const S=val('S'),O=val('O'),A=val('A'),P=val('P');
  if(!S&&!O&&!A&&!P){toast('กรุณากรอกอย่างน้อยหนึ่งช่อง S/O/A/P','warn');box.querySelector('textarea').focus();return;}
  const text='S: '+(S||'-')+'\nO: '+(O||'-')+'\nA: '+(A||'-')+'\nP: '+(P||'-');
  const id='ENT-'+(state.entries.length+20);
  state.entries.push({id,s:s.id,p:p.id,kind:'SOAP',ctx:p.setting,text,status,officialCopyId:null,submitted:status==='submitted',feedback:[],soap:{S,O,A,P,date:now}});
  audit({act:status==='submitted'?'create-and-submit-soap':'create-soap-draft',by:s.id,entry:id});
  toast(status==='submitted'?'บันทึก SOAP และส่งให้อาจารย์ตรวจแล้ว':'บันทึกร่าง SOAP แล้ว',status==='submitted'?'send':'save');
  render();
}
function commitInlineDischarge(s,p,box){
  if(ms4Blocked('discharge-submit'))return;
  if(box.dataset.dispo==='admit'){
    const adx=box.querySelector('[data-dc-admit-dx]').value.trim(), ward=box.querySelector('[data-dc-ward]').value.trim(), note=box.querySelector('[data-dc-admit-note]').value.trim();
    if(!adx){toast('กรุณาระบุ Admit Diagnosis','warn');return;}
    if(!note){toast('กรุณาเขียน Admit note','warn');return;}
    const id='DCH-'+(state.discharges.length+1);
    state.discharges.push({id,s:s.id,p:p.id,outcome:'admit',dcDx:adx,admitWard:ward,note,homeMeds:'',advice:'',status:(state.role==='intern'?'approved':'pending')});
    audit({act:'request-admit',by:s.id,dc:id});
    toast(state.role==='intern'?'สั่ง Admit แล้ว · OFFICIAL':'ส่งคำสั่ง Admit แล้ว · รออาจารย์ Approve','send');return render();
  }
  const dcDx=box.querySelector('[data-dc-dx]').value.trim();
  const typed=box.querySelector('[data-dc-med]').value.trim();
  const rx=state.orders.filter(o=>o.s===s.id&&o.p===p.id&&o.orderType==='take-home').map(o=>o.text);
  const homeMeds=[...rx,typed].filter(Boolean).join(' | '),advice=box.querySelector('[data-dc-advice]').value.trim();
  if(!dcDx){toast('กรุณาระบุ Discharge Diagnosis','warn');return;}
  if(!homeMeds){toast('กรุณาระบุหรือสั่งยากลับบ้าน','warn');return;}
  const id='DCH-'+(state.discharges.length+1);
  state.discharges.push({id,s:s.id,p:p.id,dcDx,homeMeds,advice,status:(state.role==='intern'?'approved':'pending'),...(box.dataset.dispo?{outcome:'home',note:advice}:{})});
  audit({act:'request-discharge',by:s.id,dc:id});
  toast(state.role==='intern'?'สั่งจำหน่ายและยากลับบ้านแล้ว · OFFICIAL':'ส่งคำสั่งจำหน่ายและยากลับบ้านแล้ว · รออาจารย์ Approve','send');render();
}
function openReviseEntryModal(eid){
  const e=state.entries.find(x=>x.id===eid);
  openModal(ic('pen')+' แก้ไขและส่งตรวจอีกครั้ง',
    '<div class="help" style="margin-bottom:10px">'+ic('comment')+'ทบทวนข้อเสนอแนะของอาจารย์ แล้วแก้ไขบันทึกก่อนส่งตรวจอีกครั้ง</div><textarea id="reviseTxt" style="min-height:180px">'+esc(e.text).replace(/<br>/g,'\n')+'</textarea>',
    'บันทึกและส่งตรวจ',()=>{
      const txt=$('#reviseTxt').value.trim(); if(!txt){toast('กรุณากรอกเนื้อหา','warn');return;}
      e.previousText=e.text; e.text=txt; e.status='submitted'; e.submitted=true; e.revision=(e.revision||1)+1;
      audit({act:'revise-and-resubmit',by:e.s,entry:e.id,revision:e.revision});

    });

    const days=[...new Set(lines.map(o=>o.date||'วันนี้'))];
    days.forEach(day=>{
      b+='<div class="order-day">'+day+'</div>';
      lines.filter(o=>(o.date||'วันนี้')===day).forEach(o=>b+=orderLineHtml(o));

function orderAreaOPD(s,p){
  const rx=state.orders.filter(o=>o.s===s.id&&o.p===p.id&&o.orderType==='take-home');
  const ov=state.orders.filter(o=>o.s===s.id&&o.p===p.id&&o.orderType==='one-visit');
  let b='<div class="xs muted" style="margin-bottom:10px">'+ic('info')+' OPD visit — บันทึกคำสั่งสำหรับการมาตรวจครั้งนี้และใบสั่งยากลับบ้าน · ทุกคำสั่งรออาจารย์แพทย์อนุมัติ</div>';
  // one-visit orders (investigations / one-time treatment)
  b+='<div class="opd-orderblock onevisit"><div class="g-h">'+ic('flask')+'คำสั่งครั้งเดียว (One-visit: Lab / X-ray / หัตถการ)</div><div class="g-b">';
  if(!ov.length)b+='<div class="os-empty">ยังไม่มีรายการ</div>';
  ov.forEach(o=>b+=orderLineHtml(o));
  b+='<div class="os-add" style="margin-top:8px"><input type="text" id="os-one-visit" placeholder="เช่น CBC, CXR, ECG, ล้างแผล..."><button class="btn ghost sm" data-addorder="one-visit">'+ic('send')+'สั่ง</button></div>';
  b+='</div></div>';
  // take-home prescription (drug orders here are take-home Rx)
  b+='<div class="opd-orderblock takehome"><div class="g-h">'+ic('pills')+'ใบสั่งยากลับบ้าน (Take-home prescription)</div><div class="g-b">';

function wireOrderArea(s,p,m){
  // free-text (non-drug) orders
  m.querySelectorAll('[data-addorder]').forEach(b=>b.onclick=()=>{
    if(ms4Blocked('order-submit'))return;
    const type=b.dataset.addorder; const inp=$('#os-'+type); const txt=inp?inp.value.trim():'';
    if(!txt){toast('กรุณากรอกรายการ Order','warn');return;}
    const id='ORD-'+(state.orders.length+20);
    state.orders.push({id,s:s.id,p:p.id,ctx:state.ctx,text:txt,status:(state.role==='intern'?'approved':'pending'),date:now,orderType:type});
    audit({act:'place-order-pending',by:s.id,order:id,orderType:type});
    toast(orderTypeLabel(type)+(state.role==='intern'?' → OFFICIAL · เข้า EMR จริงแล้ว':' → สถานะ "รอ Approve"'),'pills'); render();
  });
  m.querySelectorAll('[data-rmorder]').forEach(b=>b.onclick=()=>{ state.orders=state.orders.filter(o=>o.id!==b.dataset.rmorder); toast('ลบรายการ Order แล้ว','x'); render(); });
  // drug type-ahead search -> dialog
  m.querySelectorAll('.ds-input').forEach(inp=>{
    const type=inp.dataset.dstype; const res=m.querySelector('[data-dsres="'+type+'"]');
    const renderRes=()=>{
      const q=inp.value.trim().toLowerCase();
      if(!q){res.classList.remove('show');res.innerHTML='';return;}
      const hits=DRUG_CATALOG.filter(d=>(d.name+' '+d.generic+' '+d.code).toLowerCase().includes(q));
      if(!hits.length){res.innerHTML='<div class="ds-empty">ไม่พบยา "'+esc(q)+'"</div>';res.classList.add('show');return;}
      res.innerHTML=hits.map(d=>{
        const isSyr=/syrup|ยาน้ำ/i.test(d.form+d.generic);
        return '<div class="ds-row" data-pick="'+d.id+'" data-type="'+type+'"><div class="di">'+ic('pills')+'</div><div><div class="dn">'+d.name+'</div><div class="dm">'+d.generic+' · '+d.strength+' · '+d.form+(d.highAlert?' · High Alert':'')+'</div></div><span class="df '+(isSyr?'syr':'tab')+'">'+d.saleUom+'</span></div>';
      }).join('');
      res.classList.add('show');
      res.querySelectorAll('[data-pick]').forEach(r=>r.onclick=()=>{ res.classList.remove('show'); inp.value=''; openDrugOrderModal(s,p,type,r.dataset.pick); });
    };
    inp.oninput=renderRes;
    inp.onfocus=renderRes;
    inp.onblur=()=>setTimeout(()=>res.classList.remove('show'),200);
  });
}

function selectFrequency(times,timing,code=''){

function parseQuickOrder(){
  let raw=$rx('quickSig').value.trim().toLowerCase().replace(/½/g,'0.5').replace(/หลังอาหาร/g,' pc ').replace(/ก่อนอาหาร/g,' ac ').replace(/ก่อนนอน/g,' hs ').replace(/รับประทาน/g,' po ').replace(/เมื่อมีอาการ/g,' prn ').replace(/,/g,' ').replace(/\s+/g,' ');
  if(!raw)return;
  let schedule=raw.match(/\b(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)\b/);
  let doseMatch=raw.match(/^(\d+(?:\.\d+)?)/);
  let xMatch=raw.match(/(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)/);
  let codeMatch=raw.match(/\b(od|qd|bid|tid|qid|q4h|q6h|q8h|q12h)\b/);
  let thaiTimes=(raw.match(/วันละ\s*(\d+)\s*ครั้ง/)||[])[1];
  let sv=schedule?schedule.slice(1).map(Number):[];
  let dose=schedule?Math.max(...sv):xMatch?+xMatch[1]:(doseMatch?+doseMatch[1]:NaN);
  let times=schedule?sv.filter(Boolean).length:xMatch?+xMatch[2]:(+thaiTimes||({od:1,qd:1,bid:2,tid:3,qid:4,q4h:6,q6h:4,q8h:3,q12h:2}[codeMatch?codeMatch[1]:'']||0));
  let timing=(raw.match(/\b(ac|pc|hs)\b/)||[])[1]||'';
  let orderDays=(raw.match(/(?:\bx\b|\bfor\b)\s*(\d+)\s*(?:d|day|days)\b/)||raw.match(/นาน\s*(\d+)\s*วัน/)||[])[1];
  if(!times&&timing==='hs')times=1; if(!times&&/\b(stat|now)\b/.test(raw))times=1;
  if(!dose||!times){ $rx('quickSig').classList.add('invalid'); return } $rx('quickSig').classList.remove('invalid');
  $rx('dose').value=dose;
  if(/\bprn\b/.test(raw)){ $rx('prn').checked=true }
  if(schedule){ $rx('multiple').checked=true; $rx('taper').checked=false; ['multiDose1','multiDose2','multiDose3'].forEach((id,i)=>$rx(id).value=sv[i]||0); }
  if(orderDays)$rx('duration').value=+orderDays;
  if(selectFrequency(times,timing,codeMatch?codeMatch[1]:''))calculate(!!orderDays,true);
}

  $rx('change').onchange=()=>{ let w=whs.find(x=>x.name===$rx('change').value); whStock=w.name==='OPD Pharmacy'?med.stock:med.stock*w.factor; rxRender(); };
  $rx('close').onclick=$rx('cancel').onclick=rxCloseM;

/* ========== ATTENDING ========== */
function scardHtml(s){
  const assigned=state.assignments.filter(a=>a.s===s.id).map(a=>patient(a.p));
  const work=attendingWork(s.id),activeIds=new Set(work.pending.map(x=>x.p));
  Object.keys(state.msNotes).forEach(k=>{const [si,pi]=k.split('|'),mn=state.msNotes[k];if(si===s.id&&mn.visible&&String(mn.text).trim())activeIds.add(pi);}); /* visible MS Note makes the patient reviewable */
  const active=assigned.filter(p=>activeIds.has(p.id)),ipd=active.filter(p=>p.setting==='IPD').length,opd=active.filter(p=>p.setting==='OPD').length;
  const relatedIds=new Set(work.pending.concat(work.doneItems).map(x=>x.p));
  const related=assigned.filter(p=>relatedIds.has(p.id)),completed=Math.max(0,related.length-active.length);
  const pct=related.length?Math.round(completed*100/related.length):100;
  return '<div class="scard" data-scard="'+s.id+'"><div class="scard-top"><div class="photo" data-portfolio="'+s.id+'" style="background:linear-gradient(145deg,'+s.photoColor+',#2a2a5a)">'+s.initials+'</div>'
    +'<div><div class="nm">'+s.name+'</div><div class="me">'+ic('cap')+' ปี '+s.year+' · '+s.major+'</div>'
    +'<div class="me" style="margin-top:4px">'+ic('tablet')+' '+(s.tier==='y45'?'บันทึกเวชระเบียนเพื่อการเรียน':'บันทึกเวชระเบียน + เสนอ Order')+'</div></div></div>'
    +'<div class="scard-work"><div class="scard-work-row"><b>ผู้ป่วยที่ต้องตรวจ '+active.length+' คน</b><span class="detail">IPD '+ipd+' · OPD '+opd+'</span></div>'
    +'<div class="scard-work-row"><span>ตรวจครบแล้ว '+completed+'/'+related.length+' คน · เหลือ '+active.length+' คน</span><span class="detail">'+pct+'%</span></div><div class="scard-progress"><i style="width:'+pct+'%"></i></div></div>'
    +'<div class="scard-foot"><button class="btn primary sm" data-open-student="'+s.id+'" style="width:100%;justify-content:center" '+(work.remaining?'':'disabled')+'>'+ic('eye')+(work.remaining?'ตรวจงานค้าง':'ตรวจครบแล้ว')+'</button></div></div>';
}
function attendingWork(sid){
  const pending=[],done=[];let review=0,approval=0,soap=0,opdDoc=0,order=0,discharge=0;
  state.entries.filter(e=>e.s===sid&&isReviewableEntry(e)&&e.status!=='draft').forEach(e=>{
    const x={p:e.p,type:e.kind==='SOAP'?'SOAP':'OPD documentation'};
    if(e.status==='submitted'){pending.push(x);review++;if(e.kind==='SOAP')soap++;else opdDoc++;}
    else if(e.status==='reviewed-ok'||e.officialCopyId)done.push(x);

function soapFromRecord(r){
  if(r.soap) return r.soap;
  if(!/progress|soap/i.test(r.kind||'')) return null;
  const out={};
  String(r.text||'').split(/\n/).forEach(line=>{
    const m=line.match(/^\s*([SOAP])\s*:\s*(.*)$/i); if(m) out[m[1].toUpperCase()]=m[2];
  });
  return Object.keys(out).length?out:null;
}
function officialRecordHtml(r){
  const soap=soapFromRecord(r);

    body='<div class="soap-readonly">'+['S','O','A','P'].map(k=>'<div class="soap-k">'+k+'</div><div class="soap-v">'+esc(soap[k]||'—')+'</div>').join('')+'</div>';
  } else body='<div style="margin-top:4px">'+esc(r.text)+'</div>';
  return '<div class="emr-rec"><div class="h">'+ic('checkc')+' '+r.kind+'<span class="readonly-mark">'+ic('eye')+'READ ONLY</span></div><div class="xs muted mono">'+r.author+' · '+r.date+'</div>'+body+'</div>';

// Groups a real-EMR record under the same section heading used on the student's own page,
// so Compare Mode reads as a side-by-side comparison rather than one undifferentiated list.
const CD_GROUPS=['CC & PI / History','Physical Examination','Progress Notes (SOAP)','Orders','Diagnosis','Discharge / Follow-up','อื่นๆ'];
const OPD_CD_GROUPS=['CC / HPI','Physical Examination','Diagnosis & Plan','Order','Discharge / Follow-up'];
function emrGroupFor(kind,setting){
  const k=(kind||'').toLowerCase();
  if(setting==='OPD'){
    if(k.includes('cc/hpi')||k.includes('history')||k.includes('opd note')) return 'CC / HPI';
    if(k.includes('physical')) return 'Physical Examination';
    if(k.includes('diagnos')) return 'Diagnosis & Plan';
    if(k.includes('order')) return 'Order';
    if(k.includes('discharge')||k.includes('follow-up')||k.includes('follow up')||k.includes('disposition')) return 'Discharge / Follow-up';
    return 'CC / HPI';
  }
  if(k.includes('admission')||k.includes('history')) return 'CC & PI / History';
  if(k.includes('physical')) return 'Physical Examination';
  if(k.includes('progress')||k.includes('soap')) return 'Progress Notes (SOAP)';
  if(k.includes('order')) return 'Orders';
  if(k.includes('diagnos')) return 'Diagnosis';
  if(k.includes('discharge')) return 'Discharge / Follow-up';
  return 'อื่นๆ';
}
function renderCompareDrawer(){
  const root=$('#compareDrawer'); if(!root) return;
  if(state.ipdCompareTab){ if(renderIpdCompareDrawer()) return; }
  const ms5Case=state.role==='y45'&&state.view==='ms4case';   /* MS5 on the shared case page keeps the ordinary (unlocked) EMR Compare */
  if(state.role==='ms4'||(MS4_VIEWS.includes(state.view)&&!ms5Case)||state.view==='ms4review'){ return renderMs4CompareDrawer(); }
  const studentCompare=state.role!=='attending'&&(state.view==='document'||ms5Case);
  const attendingCompare=state.role==='attending'&&state.view==='dashboard'&&state.selStudent;
  const show=state.compareOpen && state.selPatient && (studentCompare||attendingCompare);
  if(!show){ root.classList.remove('open'); return; }
  const p=patient(state.selPatient);
  if(!p){ root.classList.remove('open'); return; }
  root.classList.add('cd-muted');
  let b='<div class="cd-head">'+ic('hospital')+'<span>Compare · สิ่งที่แพทย์ลงจริงใน EMR</span><span class="x" id="cdClose">'+ic('x')+'</span></div>'
    +'<div class="cd-sub">'+ic('info')+' '+(attendingCompare?'อาจารย์กำลังเทียบงานของ '+student(state.selStudent).name+' กับ ':'เปรียบเทียบกับ ')+'EMR จริงของ '+p.name+' · Patient/Visit เดียวกัน · อ่านอย่างเดียว</div>'
    +'<div class="cd-body">';
  b+='<div class="cd-group"><div class="cd-group-h">Final diagnosis (EMR)</div><div class="emr-rec"><b>'+esc(p.dx||'—')+'</b></div></div>';
  if(!p.emr.length){
    b+='<div class="emr-empty">ยังไม่มีบันทึกจริงใน EMR สำหรับ Visit นี้</div>';
  } else {
    const byGroup={};
    p.emr.forEach(r=>{ const g=emrGroupFor(r.kind,p.setting); (byGroup[g]=byGroup[g]||[]).push(r); });
    const groups=p.setting==='OPD'?OPD_CD_GROUPS:CD_GROUPS;
    groups.forEach(g=>{
      const recs=byGroup[g]||[];
      b+='<div class="cd-group"><div class="cd-group-h">'+g+'</div>';
      if(!recs.length)b+='<div class="emr-empty">— ไม่มีข้อมูลใน EMR จริงสำหรับส่วนนี้ —</div>';
      else recs.forEach(r=>b+=officialRecordHtml(r));
      b+='</div>';
    });
  }
  b+='</div>';
  root.innerHTML=b;
  root.classList.add('open');
  $('#cdClose').onclick=()=>{ state.compareOpen=false; renderCompareDrawer(); };
}

/* ================= v35 — ONE Clinical Case Workspace for MS4 + MS5 =================
   view_ms4case() is the only renderer of the case page. MS5 (y45) cases are built here from MS5's OWN patient list
   (state.assignments of y45 students → state.patients PT-xx, with CC / PI / PE / meds pulled from state.entries, state.ms5.opd and PT_SUMMARY)
   into the same case shape as state.ms4Cases, so every section / AI step / Quick Pick / handler is the same code.
   MS5 cases are kept out of state.ms4Cases (MS4 attending queues / ledger / vault never see them). */
function isMs5(){return state.role==='y45';}
function isCaseRole(){return state.role==='ms4'||state.role==='y45';}
function ms5PtCc(p){
  const q=((state.ms5&&state.ms5.opd)||[]).find(o=>o.pid===p.id);
  const hx=state.entries.filter(e=>e.p===p.id&&e.kind==='History'&&(student(e.s)||{}).tier==='y45').map(e=>String(e.text).split(/\\n|\n/)).flat();
  const l=hx.find(x=>/^CC:/.test(x));
  return (l&&l.replace(/^CC:\s*/,'').trim())||(q&&q.cc)||(p.setting==='OPD'?'มาตรวจติดตาม '+String(p.dx||'').replace(/\s*\(F\/U\).*$/,''):String(p.dx||''));
}
function ms5CasePatient(id){
  const p=patient(id); if(!p) return undefined;
  return Object.assign({},p,{cc:ms5PtCc(p),admitType:p.setting==='OPD'?(/F\/U/.test(p.dx||'')?'OPD follow-up (นัดติดตาม)':'OPD walk-in'):'Admission'});
}
function ms5SeedCase(st,p){
  const q=((state.ms5&&state.ms5.opd)||[]).find(o=>o.pid===p.id);

function ms4MigrateDx(w){

/* ---- PRESENT LEDGER: the only place presentStatus can change.
   not_ready → ready_to_present (student's "ส่ง Present") → presented (ATTENDING ONLY: "บันทึกว่า Present เสร็จแล้ว") ---- */
const PRESENT_LEDGER=(()=>{
  const st={}; let sealed=false;
  return Object.freeze({
    init(id,v){ if(sealed||id in st) return; st[id]=['not_ready','ready_to_present','presented'].includes(v)?v:'not_ready'; },
    seal(){ sealed=true; },
    status(id){ return st[id]||'not_ready'; },
    markReady(id){
      const c=ms4Case(id), me=actingStudent();
      if(state.role!=='ms4'||!c||!me||c.s!==me.id||c.exception) return false;
      if(st[id]!=='not_ready') return false;
      st[id]='ready_to_present'; return true;
    },
    markPresented(id){
      if(state.role!=='attending') return false;          // never the student, never automatic
      if(st[id]!=='ready_to_present') return false;
      st[id]='presented'; return true;
    },
    returnToEdit(id){
      /* v41 — attending sends the case back to the student for edits BEFORE presenting (e.g. wants more detail first).
         Only valid from ready_to_present (student already submitted); reopens editing by reverting to not_ready. */
      if(state.role!=='attending') return false;
      if(st[id]!=='ready_to_present') return false;
      st[id]='not_ready'; return true;
    }
  });
})();

function ms4Reviewed(c){return !c.exception&&c.presentStatus==='presented'&&!!(c.oralReview&&c.oralReview.outcome)&&ms4TopicsDone(c);}
function ms4AckPending(c){return ms4Reviewed(c)&&!c.ackAt;}

// Waiting Logbook: Y = acknowledged cases; X = Educationally Verified (incl. acknowledged) but "ปิด Logbook" not yet confirmed
function ms4LogPendingClose(c){return ms4EducVerified(c)&&!c.logClosedAt;}

function ms4Stage(c){
  if(c.exception) return null;

const MS4_STAGE_HINT={todo:'ยังซักประวัติ/เขียน Note อยู่ หรือยังไม่กดส่ง Present',wait:'กดส่งแล้ว รออาจารย์ฟัง Present / ประเมิน Oral / ตรวจ Note — รวมเคสที่รับทราบผลตรวจแล้วแต่ Note ยังไม่ผ่าน (จะเข้า เสร็จสมบูรณ์ เมื่ออาจารย์ตรวจ Note ผ่าน)',fix:'อาจารย์ส่ง Note กลับพร้อมความเห็น — ต้องแก้แล้วส่งใหม่ (เมนู แก้ Note ที่ถูกส่งกลับ)',ack:'อาจารย์ตรวจ Oral + รายหัวข้อครบแล้ว (ผลผ่านหรือไม่ผ่านก็ได้) — ต้องเปิดอ่านและกดรับทราบ',done:'Oral ผ่าน + รับทราบแล้ว + Note ผ่าน → เข้า Logbook อัตโนมัติ แล้วกดปิด Logbook'};
