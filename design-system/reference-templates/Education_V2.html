function ms4TaskStatus(c){
  if(c.exception) return [MS4_EXC[c.exception.type][0],'tag-exc'];
  const st=ms4Stage(c);
  if(st==='done') return c.logClosedAt?['เสร็จสมบูรณ์ · ปิด Logbook แล้ว','tag-approved']:['เสร็จสมบูรณ์ · รอปิด Logbook','tag-approved'];
  if(st==='fix') return ['ต้องแก้ · อาจารย์ส่ง Note กลับ','tag-rejected'];
  if(st==='ack') return ['ตรวจเสร็จ · รอรับทราบ','tag-pending'];
  if(st==='wait'){ const ns=c.note.status;
    if(c.presentStatus==='ready_to_present') return ['ส่งแล้ว · รออาจารย์ฟัง Present','tag-pending'];
    if(ns==='submitted'||ns==='resubmitted') return [ms4Acked(c)?'รับทราบผลตรวจแล้ว · รออาจารย์ตรวจ Note (ยังไม่เข้า Logbook)':'ส่งแล้ว · รออาจารย์ตรวจ Note','tag-review'];
    if(ms4Acked(c)) return ['รับทราบผลตรวจแล้ว · รอส่ง/ตรวจ Note (ยังไม่เข้า Logbook)','tag-review'];
    return ['ส่งแล้ว · รออาจารย์ประเมิน Oral','tag-pending']; }

function lineDiff(a,b){
  const A=String(a).split('\n'),B=String(b).split('\n'),n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){out.push(['=',A[i]]);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){out.push(['-',A[i]]);i++;} else {out.push(['+',B[j]]);j++;} }
  while(i<n)out.push(['-',A[i++]]); while(j<m)out.push(['+',B[j++]]);
  return out;
}

function ms4IcdLabel(code){const x=MS4_ICD10.find(r=>r[0]===code);return x?x[0]+' — '+x[1]:'';}
function ms4IcdMatch(v){v=String(v||'').trim();if(!v)return null;const up=v.toUpperCase();return MS4_ICD10.find(r=>(r[0]+' — '+r[1]).toUpperCase()===up||r[0]===up||r[0]===up.split(/\s/)[0])||null;}
/* v37 — flag when the recorded CC/History uses a sex-specific term that doesn't match the patient's recorded sex (e.g. "ปวดอัณฑะ" on a female patient) — likely a typo/wrong-CC-picked or something the student should re-confirm with the patient, not a silent app error. */
const SEX_TERM_RULES=[
  [/อัณฑะ|องคชาต|ถุงอัณฑะ|ต่อมลูกหมาก|หนังหุ้มปลายอวัยวะเพศ|น้ำอสุจิ|อวัยวะเพศชาย/i,'ชาย'],
  [/ประจำเดือน|ตกขาว|ปวดประจำเดือน|มดลูก|รังไข่|ตั้งครรภ์|แพ้ท้อง|ช่องคลอด|ปีกมดลูก|ปากมดลูก/i,'หญิง']
];
function sexMismatchTerm(text,sex){
  const t=String(text||''); if(!t.trim()||!sex) return null;
  for(const[re,need] of SEX_TERM_RULES){ const m=re.exec(t); if(m&&sex!==need) return {term:m[0],need}; }
  return null;
}
function sexMisHtml(text,sex,fieldKey){
  const m=sexMismatchTerm(text,sex);
  return '<div class="sexmis-warn'+(m?' show':'')+'" data-sexmis="'+(fieldKey||'')+'">'+(m?(ic('warn')+'<span><b>ตรวจสอบอีกครั้ง:</b> อาการ “'+esc(m.term)+'” มักพบเฉพาะเพศ'+m.need+' แต่ผู้ป่วยรายนี้ระบุเพศ'+esc(sex||'—')+' — อาจพิมพ์/เลือก CC ผิด หรือมีประเด็นที่ต้องซักเพิ่มเติม</span>'):'')+'</div>';
}
function ms4Field(label,key,val,ph,opts){
  opts=opts||{};
  const lab='<label>'+label+(opts.req?' <span class="req">*</span>':'')+'</label>';
  if(opts.locked) return '<div class="ms4-field">'+lab+'<div class="ms4-ro'+(String(val).trim()?'':' empty')+'">'+(String(val).trim()?esc(val):'— ไม่ได้บันทึก —')+'</div></div>';
  const input='<textarea class="field-line" rows="1" data-bind="'+key+'" placeholder="'+escA(ph)+'">'+esc(val)+'</textarea>';
  return '<div class="ms4-field">'+lab+input+'</div>';
}

function ms4ReqKeys(c){
  const w=ms4Work(c), keys=[];
  ['cc','hpi','vitals','pos','problemRep'].forEach(k=>{if(!String(w[k]).trim())keys.push(k);});
  if(!ms4DxList(w).length) keys.push('dx.0.icd');
  w.dx.forEach((d,i)=>{ if(String(d.icd).trim()&&!d.code) keys.push('dx.'+i+'.icd'); if(String(d.icd).trim()&&!String(d.reason).trim()) keys.push('dx.'+i+'.reason'); });
  if(ms4DxList(w).length&&!w.dx.some(d=>d.type==='principal'&&String(d.icd).trim())) keys.push('dx.principal');
  return keys;
}
function ms4MarkInvalid(c){
  const bad=new Set(ms4ReqKeys(c)), all=['cc','hpi','vitals','pos','problemRep',...ms4Work(c).dx.flatMap((d,i)=>['dx.'+i+'.icd','dx.'+i+'.reason'])];
  document.querySelectorAll('#main .pk-miss').forEach(x=>x.remove());
  all.forEach(k=>{const x=document.querySelector('#main [data-bind="'+k+'"]'); if(!x) return; const b=bad.has(k); x.classList.toggle('invalid',b); x.toggleAttribute('data-missing',b);
    const f=x.closest('.ms4-field'); const lab=f&&f.querySelector(':scope>label'); if(lab) lab.classList.toggle('req-miss',b);
    else if(b){ const m=document.createElement('span'); m.className='pk-miss'; m.setAttribute('data-miss-for',k); m.textContent=k.endsWith('.reason')?'! ต้องกรอกเหตุผล':(x.value.trim()?'! ต้องเลือกจากรายการ ICD-10':'! ต้องกรอก Diagnosis'); (x.closest('.pk')||x).insertAdjacentElement('afterend',m); } });
  const pm=document.querySelector('#ms4-dx [data-dx-principal-miss]'); if(pm) pm.remove();
  if(bad.has('dx.principal')){ const r=document.querySelector('#ms4-dx .ms4-dx .dx-type'); if(r) r.insertAdjacentHTML('afterend','<span class="pk-miss" data-dx-principal-miss style="grid-column:3/4">! ต้องเลือก Principal 1 ข้อ</span>'); }
  return bad.size;
}
const NOTE_REQ=[['Chief complaint','Chief complaint'],['Present illness','Present illness'],['  V/S','V/S'],['  Positive findings','Positive findings'],['Problem representation','Problem representation'],['__ddx','Diagnosis ICD-10 (≥1)']];
function ms4NoteMissing(txt){
  const L=String(txt||'').split('\n');
  return NOTE_REQ.filter(([lab])=>{
    if(lab==='__ddx'){ const i=L.findIndex(l=>/^Diagnosis \(ICD-10\)/.test(l)); if(i<0) return true; for(let j=i+1;j<L.length&&L[j].startsWith('  ');j++){ if(/^\s+\d+\.\s*\S/.test(L[j])) return false; } return true; }
    const l=L.find(x=>x.startsWith(lab+':')); return !l||!l.slice(lab.length+1).trim();
  }).map(x=>x[1]);
}
function ms4NoteReqHtml(c){
  const miss=new Set(ms4NoteMissing(c.note.draft)), show=!!(state.ms4NoteInvalid||{})[c.id];
  return '<div class="note-req" data-note-req><span class="xs muted" style="align-self:center">หัวข้อที่ต้องมีข้อมูล <span class="req">*</span></span>'+NOTE_REQ.map(([,t])=>'<span class="nr'+(miss.has(t)?(show?' invalid':''):' ok')+'" data-note-req-item="'+escA(t)+'"'+(miss.has(t)&&show?' data-missing':'')+'>'+esc(t)+'</span>').join('')+'</div>';
}
function ms4NoteRefreshReq(c){
  const box=document.querySelector('[data-note-req]'); if(box) box.outerHTML=ms4NoteReqHtml(c);
  const ta=$('#ms4NoteText'); if(ta) ta.classList.toggle('invalid',!!(state.ms4NoteInvalid||{})[c.id]&&ms4NoteMissing(c.note.draft).length>0);
}
function ms4Validate(c){
  const w=ms4Work(c), miss=[];
  if(!w.cc.trim())miss.push('Chief complaint'); if(!w.hpi.trim())miss.push('Present illness');
  if(!w.vitals.trim())miss.push('Vital signs'); if(!w.pos.trim())miss.push('Positive findings'); if(!w.problemRep.trim())miss.push('Problem representation');
  const dd=ms4DxList(w); if(!dd.length)miss.push('Diagnosis (ICD-10) อย่างน้อย 1 ข้อ');
  const badIcd=w.dx.map((d,i)=>[d,i]).filter(([d])=>String(d.icd).trim()&&!d.code).map(([,i])=>i);
  if(badIcd.length)miss.push('Diagnosis ข้อ '+badIcd.map(i=>i+1).join(', ')+' ต้องเลือกจากรายการ ICD-10');
  if(dd.length&&!dd.some(d=>d.type==='principal'))miss.push('ต้องเลือก Principal diagnosis 1 ข้อ');
  const noReason=w.dx.map((d,i)=>[d,i]).filter(([d])=>String(d.icd).trim()&&!String(d.reason).trim()).map(([,i])=>i);
  if(noReason.length)miss.push('เหตุผลของ Diagnosis ข้อ '+noReason.map(i=>i+1).join(', '));
  return {miss,noReason};
}

function ms4Timeline(c){
  const n=c.note; if(!n.events.length) return '<div class="pf-empty">ยังไม่มีการส่งตรวจ — Version แรกจะถูกสร้างเมื่อกด "ส่งตรวจ"</div>';
  const lab={submitted:'ส่งตรวจ',resubmitted:'ส่งใหม่',returned:'ส่งกลับให้แก้ไข',verified:'ผ่านการตรวจด้านการศึกษา'};
  let h='<div class="pf-timeline" data-timeline>';
  n.events.forEach(ev=>{
    const cls=ev.type==='returned'?' ret':ev.type==='verified'?' ok':'';
    h+='<div class="pf-t-item'+cls+'" data-tl-event="'+ev.type+'" data-tl-v="'+ev.v+'"><div class="pf-t-date mono">'+esc(ev.at)+' · '+esc(ev.by)+'</div>';
    if(ev.type==='submitted'||ev.type==='resubmitted'){
      const ver=n.versions[ev.v-1];
      h+='<div class="pf-t-name">Version '+ev.v+' · '+lab[ev.type]+' <span class="tag tag-draft" style="margin-left:4px">'+ic('lock')+'immutable</span></div>';
      if(ver.prompt&&ver.prompt.length) h+='<div class="xs muted" style="margin-top:2px">แก้ไขตาม Feedback: '+ver.prompt.map(esc).join(' · ')+'</div>';
      h+='<details class="rev-ver" data-version="'+ver.v+'"><summary>ดูเนื้อหา Version '+ver.v+'</summary><pre>'+esc(ver.text)+'</pre></details>';
      if(ver.v>1) h+='<details class="rev-ver" data-diff="'+ver.v+'"><summary>ดูฉบับก่อนหน้า · เปลี่ยนแปลงจาก Version '+(ver.v-1)+' (line diff)</summary><pre>'+diffHtml(n.versions[ver.v-2].text,ver.text)+'</pre></details>';
    } else if(ev.type==='returned'){
      h+='<div class="pf-t-name">'+lab.returned+' · Version '+ev.v+(ev.due?' <span class="xs muted">กำหนดส่งแก้ '+esc(ev.due)+'</span>':'')+'</div>';
      h+=n.comments.filter(x=>x.v===ev.v).map(x=>'<div class="ms4-cmt">'+ic('comment')+' <span class="t">'+esc(x.tag)+'</span><b>'+esc(x.sec)+':</b> '+esc(x.text)+'</div>').join('');
    } else {
      h+='<div class="pf-t-name" style="color:var(--green-700)">'+ic('checkc')+' '+lab.verified+' · Version '+ev.v+'</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

function ms4AnnotatedNote(c,cm){
  const v=c.note.versions[c.note.versions.length-1]; if(!v) return '';
  const MAP=[[/^Chief complaint/,'CC / HPI'],[/^Present illness/,'CC / HPI'],[/^Past history/,'Past / Family / Social history'],[/^Family \/ Social/,'Past / Family / Social history'],[/^Physical examination/,'Physical examination'],[/^Problem list/,'Problem list / representation'],[/^Problem representation/,'Problem list / representation'],[/^Diagnosis/,'Diagnosis (ICD-10)'],[/^Proposed investigation/,'Proposed investigation']];
  const blocks=[]; let cur=null;
  String(v.text).split('\n').forEach(line=>{ if(!line.trim()){ cur=null; return; }
    if(/^\s/.test(line)&&cur){ cur.lines.push(line); return; }
    const m=MAP.find(x=>x[0].test(line)); cur={sec:m?m[1]:null,lines:[line]}; blocks.push(cur); });
  const secNo={}; cm.forEach((x,i)=>{ (secNo[x.sec]=secNo[x.sec]||[]).push(i+1); });
  let out='<div data-annotated-note style="margin-top:12px"><div class="small" style="font-weight:700;margin-bottom:6px">'+ic('note')+' Note ที่คุณส่งไป (Version '+v.v+' · '+esc(v.at)+') — <span style="background:#fff2b8;padding:0 6px;border-radius:4px">ส่วนที่ไฮไลต์</span> คือจุดที่อาจารย์ให้แก้</div><div style="background:#fff;border:1px solid #f3c1c1;border-radius:8px;padding:8px 10px">';
  let lastSec=null;
  blocks.forEach(b=>{ const hit=b.sec&&secNo[b.sec]; const first=hit&&lastSec!==b.sec; lastSec=b.sec;
    out+='<div style="margin:2px 0;padding:3px 8px;border-left:4px solid '+(hit?'#dc2626':'transparent')+';background:'+(hit?'#fff2b8':'transparent')+';border-radius:4px"><pre style="margin:0;white-space:pre-wrap;font:inherit;font-size:12.5px">'+esc(b.lines.join('\n'))+'</pre>'
      +(hit&&first?'<div class="xs" style="color:#b91c1c;font-weight:700;margin-top:2px">'+ic('comment')+' ข้อ '+secNo[b.sec].join(', ')+': '+secNo[b.sec].map(i=>esc(cm[i-1].text)).join(' / ')+'</div>':'')+'</div>'; });
  const whole=cm.filter(x=>x.sec==='ทั้งฉบับ'); if(whole.length) out+='<div class="xs" style="color:#b91c1c;font-weight:700;margin-top:6px">'+ic('comment')+' ทั้งฉบับ: '+whole.map(x=>esc(x.text)).join(' / ')+'</div>';
  return out+'</div></div>';
}

function ms4Compare(c,emr){
  const w=ms4Work(c);
  const corpus={History:[w.cc,w.hpi,w.pmh,w.fhsh].join(' '),PE:[w.vitals,w.pos,w.neg].join(' '),Dx:ms4DxList(w).map(d=>d.icd+' '+d.reason).join(' ')+' '+w.problemRep,Investigation:w.invest.map(x=>x.test).join(' ')};
  const ok=[],miss=[];
  (emr.facts||[]).forEach(f=>{ const t=String(corpus[f.sec]||'').toLowerCase(); (f.kw.some(k=>t.includes(k.toLowerCase()))?ok:miss).push(f); });
  return {ok,miss};
}
function ms4CmpLists(res){
  const li=(f,good)=>'<li class="'+(good?'cmp-ok':'cmp-miss')+'">'+ic(good?'checkc':'warn')+'<span>'+esc(f.text)+'</span><span class="cmp-sec">'+f.sec+'</span></li>';

    +'<div><div class="small" style="font-weight:800;color:var(--orange-600);margin-bottom:4px">'+ic('warn')+' จุดตกหล่น ('+res.miss.length+')</div><ul class="cmp-list" data-missed>'+(res.miss.map(f=>li(f,false)).join('')||'<li class="muted">ไม่มี</li>')+'</ul></div></div>';
}

function ms4Corrections(sid){
  const rows=[];
  ms4CasesFor(sid).forEach(c=>{
    c.note.events.forEach((ev,i)=>{ if(ev.type!=='returned') return;
      const fixedBy=c.note.events.slice(i+1).find(e=>e.type==='resubmitted'||e.type==='verified');
      rows.push({c,ev,comments:c.note.comments.filter(x=>x.v===ev.v),fixed:!!fixedBy,fixedAt:fixedBy?fixedBy.at:null});
    });
  });
  return rows;
}
function ms4Themes(sid){
  const m={};
  ms4CasesFor(sid).forEach(c=>{
    c.note.comments.forEach(x=>{ (m[x.tag]=m[x.tag]||{n:0,cases:new Set()}); m[x.tag].n++; m[x.tag].cases.add(c.id); });
    ((c.oralReview&&c.oralReview.tags)||[]).forEach(t=>{ (m[t]=m[t]||{n:0,cases:new Set()}); m[t].n++; m[t].cases.add(c.id); });
  });
  return Object.entries(m).map(([tag,v])=>({tag,n:v.n,cases:v.cases.size})).sort((a,b)=>b.n-a.n);
}

function ms4GroupSummary(c){ const L=ms4LineEval(c); return MS4_EVAL_GROUPS.map(([g,hs])=>{ const r=hs.map(h=>L[h]&&L[h].result); if(!r.some(Boolean)) return ''; const f=r.filter(x=>x==='fail').length, p=r.filter(x=>x==='pass').length; return '<div>'+(f?'<span class="topic-fail">ไม่ผ่าน '+f+'</span>':'<span class="topic-pass">ผ่าน</span>')+' · '+esc(g)+' <span class="muted">('+p+'/'+hs.length+')</span></div>'; }).join('')||'<span class="muted">—</span>'; }

// Parse the real EMR records into the same headings as the student panel (heuristic, label-based: "CC:", "HPI:", "PMH:", "PE:", "Plan:" + record kind)
function ms4EmrFields(emr){
  const F={}; MS4_CMP_HEADS.forEach(k=>F[k]=[]);
  const VS=/^(T\s*\d|BP\b|PR\b|RR\b|HR\b|SpO2|BW\b)/i, NEG=/(normal|clear|\bno\b|ไม่มี|ไม่พบ)/i;
  (emr&&emr.records||[]).forEach(r=>{
    const kind=String(r.kind).toLowerCase();
    if(/lab|investigation|procedure|imaging/.test(kind)){ F['Investigation'].push(r.text); return; }
    if(/order/.test(kind)){ F['Proposed med.'].push(r.text); return; }
    String(r.text).split('\n').forEach(line=>{
      const m=line.match(/^\s*(CC|HPI|PMH|PE|Dx|Plan)\s*:\s*(.*)$/i); if(!m) return;
      const lab=m[1].toUpperCase(), val=m[2].trim();
      if(lab==='CC') F['CC'].push(val);
      else if(lab==='HPI') F['HPI'].push(val);
      else if(lab==='PMH') F['History'].push(val);
      else if(lab==='PLAN') F['Proposed med.'].push(val);
      else if(lab==='PE') val.split(/\s*[·,]\s*/).filter(Boolean).forEach(x=>{ if(VS.test(x)) F['V/S'].push(x); else if(NEG.test(x)) F['PE (−)'].push(x); else F['PE (+)'].push(x); });
    });
    if(/admission/.test(kind)) F['Discharge Type'].push('Admit');
    else if(/discharge/.test(kind)||/d\/c home|กลับบ้าน/i.test(r.text)) F['Discharge Type'].push('กลับบ้าน');
  });
  if(emr&&emr.finalDx) F['Diagnosis (ICD-10)'].push(emr.finalDx);
  const out={}; MS4_CMP_HEADS.forEach(k=>out[k]=[...new Set(F[k])].join(k==='V/S'||k.startsWith('PE')?', ':' · ')); return out;
}
function ms4EmrSummary(emr){const F=ms4EmrFields(emr);return MS4_CMP_HEADS.map(k=>ms4CmpLine(k,F[k],'emr')).join('')+'<details class="rev-ver" style="margin-top:8px"><summary>ดูบันทึกต้นฉบับ ('+((emr&&emr.records)||[]).length+' รายการ)</summary>'+((emr&&emr.records)||[]).map(officialRecordHtml).join('')+'</details>';}

  if(a==='ready'&&c.tier==='ms5') return ms5CaseSubmit(c);

function ms4TogglePresentMode(t){
  if(t.disabled) return;
  const c=ms4Case(t.dataset.pmCase); if(!c) return;
  if(isMs4()){ if(c.s!==actingStudent().id) return; }
  else return;
  if(c.consent.status!=='confirmed'){ toast('ยืนยัน Consent ก่อนเปิด Present Mode','warn'); return; }
  if(ms4AckPending(c)){ toast('Case ตรวจเสร็จแล้ว · ไม่สามารถเปิด Present Mode','warn'); return; }
  c.presentMode=!c.presentMode; if(c.presentMode) ms4PmReset(c);
  audit({act:'ms4-present-mode-'+(c.presentMode?'on':'off'),by:state.role,case:c.id});
  if(isMs4()&&state.view!=='ms4case'){ state.view='ms4case'; state.ms4CompareOpen=false; }
  toast(c.presentMode?'Present Mode: ON · View Only ยกเว้น Teacher Feedback':'Present Mode: OFF · กลับสู่โหมดแก้ไข',c.presentMode?'lock':'unlock');
  render();
}

    c.note.draft=ms4AddendumDraft(c); if((state.ms4NoteInvalid||{})[c.id]) ms4NoteRefreshReq(c); return; }

const GEMINI_API_KEY='AIzaSyDJQyfNaBx2bwP8JvYOQmkGwTUoCYROEeU';
const GEMINI_MODEL='gemini-3.8-flash';
async function geminiCall(prompt,schema){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent?key='+GEMINI_API_KEY;
  const body={contents:[{parts:[{text:prompt}]}]};
  if(schema) body.generationConfig={responseMimeType:'application/json',responseSchema:schema};
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),12000);
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
    clearTimeout(tm);
    if(!res.ok) throw new Error('Gemini HTTP '+res.status);
    const data=await res.json();
    const text=data.candidates&&data.candidates[0]&&data.candidates[0].content.parts[0].text;
    if(!text) throw new Error('Gemini: empty response');
    return schema?JSON.parse(text):text;
  }catch(err){ clearTimeout(tm); throw err; }
}

/* v34 — shared demographic/clinical context (age, sex, underlying, vitals/PE already typed) appended to every Gemini prompt for more precise suggestions.
   Pulled ONLY from existing case/patient records already in this mockup — never the patient's name/HN, so nothing identifying is added to what goes to the API. */
function qpPatientCtx(scope){
  let p=null, vitals='';
  if(scope==='ms4'){ const c=ms4Current(); if(c){ p=ms4Patient(c.pid); const w=ms4Work(c); vitals=[w.vitals,w.pos].filter(Boolean).join(' / '); } }
  else if(scope==='ms5'){ const pid=state.ms5Draft&&state.ms5Draft.pid; if(pid){ p=xPt(pid); vitals=(state.ms5Draft&&state.ms5Draft.o)||''; } }
  if(!p) return '';
  const S=PT_SUMMARY[p.id]||{chronic:[]};
  const parts=[];
  if(p.age) parts.push('อายุ '+p.age+' ปี');
  if(p.sex) parts.push('เพศ'+p.sex);
  if(S.chronic&&S.chronic.length) parts.push('โรคประจำตัว (Underlying): '+S.chronic.join(', '));
  if(vitals&&String(vitals).trim()) parts.push('Vital signs / PE ล่าสุดที่บันทึกไว้: '+String(vitals).trim());
  return parts.length?parts.join(' · '):'';
}

/* v40 — optional speech-to-text (Web Speech API) for the Quick Pick free-text box, mainly for MS5 Progress Note dictation.
   Transcribes live into the free-text box; stopping (button click again, or the browser auto-ending the session) behaves exactly
   like clicking "ให้ AI แนะนำ..." — it hands the dictated text straight into the same suggestion pipeline used for typed text. */
function qpMicToggle(scope){
  const M=state.qpMic=state.qpMic||{};
  const cur=M[scope]||{on:false};
  if(cur.on){ if(cur.rec){ try{ cur.rec.stop(); }catch(e){} } return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('เบราว์เซอร์นี้ไม่รองรับ Speech-to-text — ใช้ Chrome บนคอมพิวเตอร์/Android หรือพิมพ์แทน','warn'); return; }
  let rec; try{ rec=new SR(); }catch(e){ toast('ไม่สามารถเปิดไมโครโฟนได้','warn'); return; }
  rec.lang='th-TH'; rec.continuous=true; rec.interimResults=true;
  const base=(($('#main').querySelector('[data-qp="'+scope+'"] [data-qp-free-input]')||{}).value||'').trim();
  M[scope]={on:true,rec,base};
  render();
  rec.onresult=(ev)=>{
    let finalTxt='', interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) finalTxt+=r[0].transcript; else interim+=r[0].transcript; }
    if(finalTxt) M[scope].base=(M[scope].base?M[scope].base+' ':'')+finalTxt.trim();
    const ta=$('#main').querySelector('[data-qp="'+scope+'"] [data-qp-free-input]');
    if(ta){ ta.value=(M[scope].base+' '+interim).trim(); }
  };
  rec.onerror=()=>{ toast('ไมโครโฟนใช้งานไม่ได้ หรือไม่ได้รับอนุญาต','warn'); };
  rec.onend=()=>{
    const wasOn=M[scope]&&M[scope].on;
    M[scope]={on:false,rec:null};
    const ta=$('#main').querySelector('[data-qp="'+scope+'"] [data-qp-free-input]');
    const txt=(ta&&ta.value||'').trim();
    render();
    if(wasOn&&txt) qpFreeCcFetch(scope,txt);
  };
  try{ rec.start(); }catch(e){ M[scope]={on:false,rec:null}; render(); }

function ddxCtx(w){
  const strip=s=>String(s||'').replace(/(ไม่มี|ปฏิเสธ|denies?\s|no\s)[^,\n/]*/gi,' ');
  const cc=strip(w.cc), pi=strip(w.hpi), pe=strip([w.vitals,w.pos].join('\n')), all=[cc,pi,pe].join('\n');
  const bp=/BP\s*:?\s*(\d{2,3})\s*\/\s*(\d{2,3})/i.exec([w.vitals,w.pos].join(' ')); const sys=bp?+bp[1]:0, dia=bp?+bp[2]:0;
  const tm=/\bT\s*:?\s*(\d{2}(?:\.\d)?)\s*°?/i.exec(pe); const temp=tm?+tm[1]:0;
  return {cc,pi,pe,all,sys,dia,bpHigh:sys>=140||dia>=90,bpCrisis:sys>=180||dia>=120,hypo:!!bp&&sys<90,
    fever:temp>=37.8||/มีไข้|ไข้สูง|ไข้ หนาวสั่น|fever/i.test(cc+' '+pi),
    ha:/ปวดศีรษะ|ปวดหัว|headache/i.test(cc), focal:/อ่อนแรง|ปากเบี้ยว|พูดไม่ชัด|hemipar|motor power/i.test(all),
    uti:/ปัสสาวะ|แสบขัด|cva tender|uti/i.test(all)};
}
function ddxReady(w){ return !!(String(w.cc||'').trim()&&String(w.hpi||'').trim()&&[w.vitals,w.pos,w.neg].some(v=>String(v||'').trim())); }
function ddxSuggest(w){ if(!ddxReady(w)) return null; const x=ddxCtx(w); const r=DDX_RULES.find(r=>r.t(x)); return r?{rule:r,ctx:x}:{rule:null,ctx:x}; }

async function ms4DdxGenAI(w){

  const schema={type:'object',properties:{dx:{type:'array',items:{type:'object',properties:{name:{type:'string'},icd:{type:'string'},reason:{type:'string'},ruleOut:{type:'array',items:{type:'string'}}},required:['name','icd','reason']}}},required:['dx']};
  const res=await geminiCall(prompt,schema);
  if(!res||!Array.isArray(res.dx)||!res.dx.length) throw new Error('Gemini DDx: empty/bad shape');
  const dx=res.dx.slice(0,5).map(d=>[String(d.name||'').trim(),String(d.icd||'').trim().toUpperCase(),String(d.reason||'').trim(),Array.isArray(d.ruleOut)?d.ruleOut.map(x=>String(x||'').trim()).filter(Boolean).slice(0,3):[]]).filter(d=>d[0]&&d[1]);
  if(!dx.length) throw new Error('Gemini DDx: no usable rows');
  dx.forEach(([nm,code])=>{ if(code&&!MS4_ICD10.some(r=>r[0]===code)) MS4_ICD10.push([code,nm]); });
  return dx;
}

function ddxRuleOutHtml(nm,have){

function ms4InvAddRow(w,test,reason){ /* shared by "+ เพิ่ม Investigation" and the Rule-Out chips */
  if(test&&w.invest.some(x=>String(x.test).trim().toLowerCase()===test.toLowerCase())) return -1;
  const e=w.invest.findIndex(x=>!String(x.test).trim()&&!String(x.reason).trim());
  if(test&&e>=0){ w.invest[e]={test,reason:reason||''}; return e; }
  w.invest.push({test:test||'',reason:reason||''}); return w.invest.length-1;
}

const SIGN_STATUS={none:['ยังไม่ขอลายเซ็น','tag-draft'],pending:['รอลายเซ็น','tag-pending'],approved:['ลงนามแล้ว','tag-approved'],returned:['ส่งกลับ','tag-rejected'],closed:['ปิดเคสโดยอาจารย์','tag-exc']};

function ms5Note(pid,author){ return state.ms5.notes.filter(n=>n.pid===pid).slice(-1)[0]||null; }
function ms5PendingReview(){ return state.ms5.notes.filter(n=>n.status==='submitted'||n.status==='resubmitted'); }
function ms5Editable(n){ return !n||['none','draft','returned'].includes(n.status); }
function ms5Verify(nid,cmt){ const n=state.ms5.notes.find(x=>x.id===nid); if(!n) return; n.status='verified'; if(cmt) n.comments.push({by:xMe(),at:nowTs(),text:cmt}); n.events.push({t:'ผ่านการตรวจ',by:xMe(),at:nowTs()}); audit({a:'ms5-verify',id:nid}); toast('SOAP ผ่านการตรวจแล้ว · รอ Save to HIS (เมนู Save to HIS)'); render(); }
function ms5Return(nid,cmt){ const n=state.ms5.notes.find(x=>x.id===nid); if(!n) return; n.status='returned'; n.comments.push({by:xMe(),at:nowTs(),text:cmt}); n.events.push({t:'ส่งกลับให้แก้ไข',by:xMe(),at:nowTs()}); audit({a:'ms5-return',id:nid}); toast('ส่งกลับให้ '+ipdTierLabel(n.author)+' แก้ไขแล้ว','undo'); render(); }
function ms5ReviewModal(nid){

  $('#ms5RevOk').onclick=()=>{ const c=revLinesCollect(rows); if(c.fails.length){ toast('มี '+c.fails.length+' ข้อที่ติ๊ก “ไม่ผ่าน” — ใช้ปุ่มส่งกลับให้แก้','warn'); return; } n.lineEval=c.ev; const v=$('#ms5RevCmt').value.trim(); closeModal(); ms5Verify(nid,v); };
  if($('#ms5RevHis')) $('#ms5RevHis').onclick=()=>{ const c=revLinesCollect(rows); if(c.fails.length){ toast('มี '+c.fails.length+' ข้อที่ติ๊ก “ไม่ผ่าน” — ใช้ปุ่มส่งกลับให้แก้','warn'); return; } n.lineEval=c.ev; const v=$('#ms5RevCmt').value.trim(); closeModal(); ms5Verify(nid,v); const n2=state.ms5.notes.find(x=>x.id===nid); n2.hisAt=nowTs(); n2.hisBy=xMe(); render(); hisDialog([{kind:'Progress Note (SOAP)',pid:n2.pid,sid:n2.author}],n2.hisAt,n2.hisBy); };
  $('#ms5RevClose').onclick=()=>{ closeModal(); closeDocCase('soap',nid); };
  $('#ms5RevRet').onclick=()=>{ const c=revLinesCollect(rows), v0=$('#ms5RevCmt').value.trim(); if(!c.fails.length&&!v0){ $('#ms5RevCmt').classList.add('invalid'); toast('ติ๊ก “ไม่ผ่าน” อย่างน้อย 1 ข้อ หรือระบุเหตุผลที่ส่งกลับ','warn'); return; } if(c.fails.some(f=>!f.note)){ toast('ข้อที่ไม่ผ่านต้องระบุหมายเหตุ','warn'); return; } n.lineEval=c.ev; closeModal(); ms5Return(nid,revFailText(c.fails,v0)); };
}
function cosignSet(id,status,cmt){
  const c=state.cosign.find(x=>x.id===id); if(!c) return;
  c.status=status; c.by=xMe(); c.byAt=nowTs(); c.cmt=cmt||'';
  const o=c.oid&&state.orders.find(x=>x.id===c.oid);
  if(o){ o.cosign=status; if(status==='cosigned'&&o.status==='pending'){ o.status='approved'; o.approvedBy=xMe(); } }
  audit({a:'cosign-'+status,id}); toast(status==='cosigned'?'Co-sign แล้ว · รอ Save to HIS เข้า HIS':'ส่งกลับให้ Extern แก้ไข',status==='cosigned'?'checkc':'undo'); render();
}
function procSign(id,status,cmt){ const x=state.procedures.find(p=>p.id===id); if(!x) return; x.sign={...(x.sign||{}),status,by:xMe(),byAt:nowTs(),cmt:cmt||''}; audit({a:'proc-sign-'+status,id}); toast(status==='approved'?'ลงนามรับรองหัตถการแล้ว':'ส่งกลับคำขอลายเซ็น',status==='approved'?'checkc':'undo'); render(); }

function ms5RailBadge(){ const me=actingStudent(); return state.ms5.notes.filter(n=>n.author===me.id&&n.status==='returned').length+state.ms5.labs.filter(l=>l.flag!=='normal'&&!l.ms5Ack&&ms5Visible(l.pid)).length; }
function ms5Visible(pid){ return state.ms5.ward.some(w=>w.pid===pid)||state.ms5.opd.some(o=>o.pid===pid); }
function ms5Pipeline(me){
  const all=state.ms5.notes.filter(n=>n.author===me.id).concat(Object.keys(state.ms5.history).reduce((a,pid)=>a.concat(state.ms5.history[pid].filter(e=>e.author===me.id&&e.status==='verified')),[]));
  const c=f=>all.filter(f).length;
  return [['1. ยังไม่ส่งตรวจ','draft','k-cyan',c(n=>n.status==='draft'||n.status==='none')],['2. ส่งแล้ว · รอผู้ตรวจ','clock','k-orange',c(n=>n.status==='submitted'||n.status==='resubmitted')],['3. ส่งกลับ · ต้องแก้','undo','k-red',c(n=>n.status==='returned')],['4. ผ่านการตรวจ · รอ Save to HIS','checkc','k-cyan',c(n=>n.status==='verified'&&!n.hisAt)],['5. เข้า HIS แล้ว','save','k-green',c(n=>n.status==='verified'&&!!n.hisAt)]];
}
function ms5PipeHtml(me){ const P=ms5Pipeline(me), tot=P.reduce((a,x)=>a+x[3],0);
  return '<div class="kpi-row kpi-onerow" data-ms5-pipeline>'+P.map(x=>kpiCard(x[2],x[1],x[3],x[0],'')).join('')+'</div><div class="xs muted" style="margin:-4px 0 10px">Progress Note ของฉันทั้งหมด '+tot+' ฉบับ = '+P.map(x=>x[3]).join(' + ')+' (ฉบับหนึ่งอยู่ได้ขั้นเดียว)</div>'; }

      +'<td>'+(mine(w)?'<span class="tag tag-review">ของฉัน</span>':'<span class="tag tag-draft">'+esc(student(w.owner).name.replace('นศพ. ',''))+'</span>')+'</td>'
      +'<td>'+xTag(WARD_STATUS,w.status)+'</td>'

/* v30 — shared SOAP Progress Note builder (was MS5-only). Parameterized by ctx so MS4 IPD and MS5 Ward use the SAME component + the SAME note store (state.ms5.notes) + NOTE_STATUS lifecycle. */
/* v44 — universal chart convention: entries stay chronological, oldest (Day 1) on top, New SOAP builder appended at the very bottom.
   Each day collapses to one summary line (date/time · เขียนโดย · ตรวจโดย · Status) by default; only the latest day auto-expands, so a
   long admission doesn't force scrolling through every prior day just to reach today's entry — expand/collapse-all + a "jump to today's
   form" shortcut cover the rest. */
function soapEntryExpandKey(pid,i){ return pid+'|'+i; }
function soapEntryExpanded(pid,i,total){
  state.soapExpand=state.soapExpand||{};
  const k=soapEntryExpandKey(pid,i);
  return k in state.soapExpand ? state.soapExpand[k] : (i===total-1);
}
function soapFeedEntryHtml(pid,i,total){
  const H=state.ms5.history[pid]||[], e=H[i];
  const approved=e.status==='verified';
  const dotCls=approved?'st-ok':e.status==='returned'?'st-ret':(e.status==='submitted'||e.status==='resubmitted')?'st-pend':'st-draft';
  const statusHint=approved?'<span class="tag tag-approved">ผ่าน</span>':e.status==='returned'?'<span class="tag tag-rejected">ไม่ผ่าน · ต้องแก้</span>':e.status==='submitted'||e.status==='resubmitted'?'<span class="tag tag-review">รอตรวจ</span>':'<span class="tag tag-draft">ร่าง</span>';
  const fb=e.comment?'<div class="log-fb">'+ic('comment')+' '+esc(e.comment)+' <span class="muted">— '+esc(e.reviewer||'')+(e.reviewAt?' · '+e.reviewAt:'')+'</span></div>':'';
  const expanded=soapEntryExpanded(pid,i,total);
  const reviewer=e.reviewer?('ตรวจโดย '+esc(e.reviewer)):(e.status==='submitted'||e.status==='resubmitted'?'รอผู้ตรวจ':(e.status==='none'||!e.status?'':'ยังไม่ส่งตรวจ'));
  return '<div class="log-entry soap-day'+(expanded?'':' collapsed')+'" data-entry="soap-'+pid+'-'+i+'">'
    +'<div class="log-entry-head" data-x="soapEntryToggle" data-k="'+soapEntryExpandKey(pid,i)+'" role="button" aria-expanded="'+expanded+'">'
    +'<span class="chev">'+ic('arrow')+'</span><span class="soap-day-status '+dotCls+'"></span>'
    +'<span class="log-ts">Day '+(i+1)+' · '+e.date+(e.time?' '+e.time+' น.':'')+'</span>'
    +(approved?'<span class="log-approved" title="แพทย์รับรองแล้ว">'+ic('checkc')+'</span>':'')+statusHint
    +'<span class="xs muted">เขียนโดย '+esc(student(e.author).name)+(reviewer?' · '+reviewer:'')+'</span>'
    +'<span class="xs muted" style="margin-left:auto">'+(expanded?'ย่อ':'ขยายดู')+'</span></div>'
    +'<div class="log-entry-body">'
    +'<div class="soap-readonly">'+[['S',e.s],['O',e.o],['A',e.a],['P',e.p]].map(kv=>'<div class="soap-k">'+kv[0]+'</div><div class="soap-v">'+esc(kv[1]||'—')+'</div>').join('')+'</div>'+fb
    +'</div></div>';
}

  const H=(state.ms5.history||{})[pid]||[];

    const allOpen=H.every((e,i)=>soapEntryExpanded(pid,i,H.length));
    b+='<div class="soap-feed-head"><span class="xs muted">'+ic('clock')+' ประวัติ Progress Note · '+H.length+' วัน (เก่า→ใหม่ ตามลำดับเวลา)</span>'

  /* v48 — "ยังไม่เริ่มเขียน" added no information (the empty form below already says that); only show the status tag once

      +qpPanelHtml('ms5',d.dx||p.cc)+'</div>'
      +ms5AdviseHtml(pid);
  b+=sexMisHtml(d.s,p.sex,'ms5s')
    +xTa('ms5S','S — Subjective (อาการ / สิ่งที่ผู้ป่วยบอก)',d.s,'เช่น ไข้ลดลง ไอน้อยลง ทานได้',!ed,2)
    +xTa('ms5O','O — Objective (V/S · PE · Lab ใหม่)',d.o,'T, BP, PR, RR, SpO2 · PE · Lab',!ed,2)
    +xTa('ms5A','A — Assessment',d.a,'Problem / Dx · แนวโน้มดีขึ้น/แย่ลง',!ed)

function stuTier(){ return state.role==='ms4'?'ms4':state.role==='y67'?'y67':'y45'; }
function stuProcDef(k){ return STU_PROCS.find(p=>p.k===k)||(state.customProcs||[]).find(p=>p.k===k)||null; }
function stuProcsFor(sid){ return state.procedures.filter(x=>x.s===sid&&x.lv); }
function stuProcSt(x){ return (x.sign&&x.sign.status)||'none'; }
function stuProcProgress(sid,tier){
  const L=stuProcsFor(sid), LR=typeof liveReq==='function'?liveReq(sid):null;
  return STU_PROCS.filter(d=>!LR||(LR.procs[d.k]||0)>0).concat(LR?Object.keys(LR.procs).filter(k=>!STU_PROCS.some(p=>p.k===k)).map(stuProcDef).filter(Boolean):[]).map(d=>{ const mine=L.filter(x=>x.pk===d.k||(d.custom&&x.name===d.n));
    const ok=mine.filter(x=>stuProcSt(x)==='approved'&&x.lv>=d.lv).length, pend=mine.filter(x=>stuProcSt(x)==='pending').length;
    const req=LR?LR.procs[d.k]:d.req[tier]; const PR=typeof priorOf==='function'?priorOf(sid):{procs:{}}, GL=typeof curGoal==='function'?curGoal(tier).procs[d.k]:null; return {d,req,cum:(PR.procs[d.k]||0)+ok,goal:GL,ok,pend,total:mine.length,state:ok>=req?'done':(ok>0||pend>0||mine.length)?'prog':'none'}; });
}

function stuPortfolioData(me,tier){
  const D={cases:[],evalRows:[],fb:[],rotation:'',supervisor:ATT_NAME,noteTotal:0,noteVerified:0};
  if(tier==='ms4'){
    const cs=ms4CasesFor(me.id);
    D.rotation=(cs[0]&&cs[0].rotation)||me.major; D.supervisor=[...new Set(cs.map(c=>c.supervisor))].join(', ')||ATT_NAME;
    D.cases=cs.map(c=>{ const p=ms4Patient(c.pid), emr=MS4_EMR_VAULT.canRead(c.id)?MS4_EMR_VAULT.read(c.id):null;
      return {setting:c.setting,dept:c.rotation,dx:emr&&emr.finalDx?emr.finalDx:'(รอเฉลยหลัง Present) '+p.cc,status:c.exception?'exc':ms4EducVerified(c)?'verified':c.presentStatus==='presented'?'presented':'active'}; });
    const oral={}; cs.forEach(c=>{ if(c.oralReview&&c.oralReview.outcome) oral[c.oralReview.outcome]=(oral[c.oralReview.outcome]||0)+1; });
    const note={}; cs.filter(c=>!c.exception).forEach(c=>{ note[c.note.status]=(note[c.note.status]||0)+1; });
    let lp=0,lf=0; cs.forEach(c=>{ Object.values(ms4LineEval(c)).forEach(x=>{ if(x.result==='pass')lp++; else if(x.result==='fail')lf++; }); });
    D.evalRows.push(['Oral Presentation',MS4_OUTCOME_ORDER.filter(k=>oral[k]).map(k=>'<span class="tag '+MS4_OUTCOMES[k][1]+'">'+MS4_OUTCOMES[k][0]+' '+oral[k]+'</span>').join(' ')||'<span class="muted">ยังไม่มี</span>']);
    D.evalRows.push(['Written Note ('+ms4NoteKind({setting:'IPD'})+'/OPD)',Object.keys(note).map(k=>'<span class="tag '+NOTE_STATUS[k][1]+'">'+NOTE_STATUS[k][0]+' '+note[k]+'</span>').join(' ')]);
    D.evalRows.push(['ประเมินรายบรรทัด (เทียบ EMR)','<span class="topic-pass">ผ่าน '+lp+'</span> · <span class="topic-fail">ไม่ผ่าน '+lf+'</span>']);
    D.noteTotal=cs.filter(c=>!c.exception).length; D.noteVerified=cs.filter(c=>!c.exception&&c.note.status==='verified').length;
    cs.forEach(c=>{ const p=ms4Patient(c.pid), r=c.oralReview;
      if(r&&r.teachingNote) D.fb.push({src:'Oral · '+p.cc,by:r.by||c.supervisor,text:r.teachingNote});
      if(r&&r.keyLearning) D.fb.push({src:'Key learning · '+p.cc,by:r.by||c.supervisor,text:r.keyLearning});
      (c.note.comments||[]).forEach(x=>D.fb.push({src:'Note v'+x.v+' · '+x.sec,by:x.by,at:x.at,text:x.text})); });
  } else if(tier==='y67'){
    D.rotation=me.major+' · Ward / ER / OPD';
    const cs=state.cosign.filter(c=>c.s===me.id), ords=state.orders.filter(o=>o.s===me.id), dcs=state.discharges.filter(d=>d.s===me.id);
    const pids=[...new Set(cs.map(c=>c.pid).concat(ords.map(o=>o.p),dcs.map(d=>d.p)))];
    pids.forEach(pid=>{ const p=xPt(pid), ok=ords.some(o=>o.p===pid&&o.status==='approved')||dcs.some(d=>d.p===pid&&d.status==='approved'); D.cases.push({setting:p.setting||'IPD',dept:me.major,dx:dcs.find(d=>d.p===pid&&d.dcDx)?dcs.find(d=>d.p===pid).dcDx:(p.dx||p.diagnosis||p.name),status:ok?'verified':'active'}); });
    const q={}; cs.forEach(c=>q[c.status]=(q[c.status]||0)+1);
    D.evalRows.push(['Order / Rx ที่ขอ Co-sign',Object.keys(q).map(k=>'<span class="tag '+COSIGN_STATUS[k][1]+'">'+COSIGN_STATUS[k][0]+' '+q[k]+'</span>').join(' ')||'<span class="muted">ยังไม่มี</span>']);
    const dq={}; dcs.forEach(d=>dq[d.status]=(dq[d.status]||0)+1);
    D.evalRows.push(['Discharge',Object.keys(dq).map(k=>'<span class="tag '+(k==='approved'?'tag-approved':'tag-pending')+'">'+(k==='approved'?'Approve แล้ว':'รอ Approve')+' '+dq[k]+'</span>').join(' ')||'<span class="muted">ยังไม่มี</span>']);
    D.noteTotal=cs.length; D.noteVerified=cs.filter(c=>c.status==='cosigned').length;
    cs.filter(c=>c.cmt).forEach(c=>D.fb.push({src:c.kind+' · '+xPtName(c.pid),by:c.by,at:c.byAt,text:c.cmt}));
  } else {
    D.rotation=me.major+' · Ward & OPD';
    const ward=state.ms5.ward.filter(w=>w.owner===me.id), opd=state.ms5.opd.filter(o=>o.owner===me.id), notes=state.ms5.notes.filter(n=>n.author===me.id);
    const dxOf=pid=>{ const n=notes.filter(x=>x.pid===pid).slice(-1)[0]; const p=xPt(pid); return n&&n.a?n.a:(p.dx||p.diagnosis||'(ยังไม่มี Assessment)'); };
    ward.forEach(w=>D.cases.push({setting:'IPD',dept:me.major,dx:dxOf(w.pid),status:notes.some(n=>n.pid===w.pid&&n.status==='verified')?'verified':'active'}));
    opd.forEach(o=>D.cases.push({setting:'OPD',dept:'OPD '+me.major,dx:o.dz+(o.cc?' · '+o.cc:''),status:o.status==='seen'?'verified':'active'}));
    const ns={}; notes.forEach(n=>ns[n.status]=(ns[n.status]||0)+1);
    D.evalRows.push(['SOAP Progress Note',Object.keys(ns).map(k=>'<span class="tag '+SOAP_STATUS[k][1]+'">'+SOAP_STATUS[k][0]+' '+ns[k]+'</span>').join(' ')||'<span class="muted">ยังไม่มี</span>']);
    const oq={}; opd.forEach(o=>oq[o.status]=(oq[o.status]||0)+1);
    D.evalRows.push(['OPD Present',Object.keys(oq).map(k=>'<span class="tag '+OPD_Q_STATUS[k][1]+'">'+OPD_Q_STATUS[k][0]+' '+oq[k]+'</span>').join(' ')||'<span class="muted">ยังไม่มี</span>']);
    D.noteTotal=notes.length; D.noteVerified=notes.filter(n=>n.status==='verified').length;
    notes.forEach(n=>(n.comments||[]).forEach(x=>D.fb.push({src:'SOAP · '+xPtName(n.pid),by:x.by,at:x.at,text:x.text})));
  }
  const mc=state.miniCex.filter(r=>r.sid===me.id);
  D.mc=mc;
  D.evalRows.push(['Mini-CEX / DOPS',mc.length?mc.map(r=>'<span class="tag tag-yr">'+r.type+' '+mcAvg(r)+'/5</span> <span class="xs muted">'+esc(r.task||'')+' · '+esc(r.at)+'</span>').join('<br>'):'<span class="muted">ยังไม่มีผลประเมิน</span>']);
  mc.filter(r=>r.comment).forEach(r=>D.fb.push({src:r.type+' · '+(r.task||''),by:r.by,at:r.at,text:r.comment}));
  stuProcsFor(me.id).filter(x=>x.sign&&x.sign.cmt).forEach(x=>D.fb.push({src:'หัตถการ · '+x.name,by:x.sign.by,at:x.sign.byAt,text:x.sign.cmt}));
  return D;
}

/* ---------- v23 — ACGME 6 Core Competencies (international standard) roll-up · computed live from existing evaluation data ---------- */
const ACGME_PASS_THRESHOLD=0.8;   /* เกณฑ์ขั้นต่ำต่อ domain (mock) */
const ACGME_MIN_DOMAINS=4;        /* ต้องมีข้อมูลอย่างน้อย 4 / 6 domain จึงสรุปผลรวม */
const ACGME_MC_PASS=3;            /* Mini-CEX/DOPS: คะแนน ≥ 3 (ตามที่คาดหวัง) = ผ่าน */
const ACGME_DOMAINS=[['pc','Patient Care','การดูแลผู้ป่วย'],['mk','Medical Knowledge','ความรู้ทางการแพทย์'],['pbli','Practice-Based Learning & Improvement','การเรียนรู้และพัฒนาตนเอง'],['ics','Interpersonal & Communication Skills','ทักษะการสื่อสารและมนุษยสัมพันธ์'],['prof','Professionalism','เจตคติและจรรยาบรรณ'],['sbp','Systems-Based Practice','การทำงานในระบบสุขภาพ']];
const ACGME_MAP={
  line:{'CC':'pc','HPI':'pc','History':'pc','V/S':'pc','PE (+)':'pc','PE (−)':'pc','Problem rep.':'mk','Diagnosis (ICD-10)':'mk','Investigation':'mk','Proposed med.':'mk','Discharge Type':'sbp'},
  mc:{'History taking':'pc','Physical examination':'pc','Clinical judgment':'mk','Communication':'ics','Professionalism':'prof','Organization / Efficiency':'sbp','Overall clinical care':'pc',
      'Indication & consent':'mk','Preparation / aseptic technique':'pc','Technical ability':'pc','Patient safety':'sbp','Post-procedure care':'pc'},
  oral:'ics', note:'pbli', proc:'pc'
};
function acgmeCompute(me,tier){
  const R={}; ACGME_DOMAINS.forEach(([k])=>R[k]={pass:0,total:0,src:{}});
  const add=(k,ok,src)=>{ const d=R[k]; d.total++; if(ok)d.pass++; const s=d.src[src]=d.src[src]||{pass:0,total:0}; s.total++; if(ok)s.pass++; };
  if(tier==='ms4'){
    ms4CasesFor(me.id).filter(c=>!c.exception).forEach(c=>{

    case 'inHoView': { const x=state.handovers.find(h=>h.id===k); if(!x) return; openModal(ic('clip')+' Handover · '+esc(xPtName(x.pid)),['S','B','A','R'].map(q=>'<div class="x-fld"><label>'+q+'</label><div class="ms4-ro">'+esc(x[q]||'—')+'</div></div>').join('')+(x.todo.length?'<div class="x-grp">สิ่งที่ต้องติดตาม</div>'+x.todo.map(t=>'<div class="x-chk'+(t.done?' on':'')+'"><span>'+(t.done?'☑':'☐')+' '+esc(t.t)+'</span></div>').join(''):''),null,null); return; }
    case 'escCat': state.escCat=k; return render();

function stuLogEntries(me,tier){
  const R=state.rotReq[tier], rows=[], pending=[];
  if(tier==='y45'){
    const H=state.ms5.history||{};
    Object.keys(H).forEach(pid=>{
      const mine=H[pid].filter(n=>n.author===me.id); if(!mine.length) return;
      const ok=mine.filter(n=>n.status==='verified').length, ret=mine.filter(n=>n.status==='returned').length, last=mine[mine.length-1].date;
      const row={pid,pt:xPt(pid).name,kind:'IPD · Progress Note รายวัน',detail:ok+' วันที่ผ่านการตรวจ จาก '+mine.length+' วัน',date:last,pass:ok>=R.notesPerCase};
      if(row.pass) rows.push(row); else pending.push(Object.assign(row,{why:'ผ่านการตรวจ '+ok+'/'+R.notesPerCase+' วัน'+(ret?' · ถูกส่งกลับ '+ret+' วัน (ต้องแก้ก่อน)':'')}));
    });
    const procOk=stuProcsFor(me.id).filter(x=>stuProcSt(x)==='approved').length;
    return {rows,pending,meters:[
      {label:'ผู้ป่วย IPD ที่ติดตามจนผ่านเกณฑ์',unit:'ราย',have:rows.length,need:R.ipdCases,hint:'ผ่าน = มี Progress Note ที่ตรวจแล้ว ≥ '+R.notesPerCase+' วัน'},
      {label:'หัตถการที่ลงนามแล้ว (ตามเกณฑ์หลักสูตร)',unit:'รายการ',have:stuProcProgress(me.id,'y45').filter(r=>r.state==='done').length,need:stuProcProgress(me.id,'y45').length,hint:'ครบทุกรายการตามตารางหัตถการ · ดูในเมนูหัตถการที่ได้รับมอบหมาย'}]};
  }
  const mineO=state.orders.filter(o=>o.s===me.id&&o.status==='approved');
  const byPt={}; mineO.forEach(o=>{ (byPt[o.p]=byPt[o.p]||[]).push(o); });
  Object.keys(byPt).forEach(pid=>{ const L=byPt[pid]; rows.push({pid,pt:xPt(pid).name,kind:'Order ที่ได้รับ Approve',detail:L.length+' รายการ',date:L[L.length-1].date,pass:true}); });
  state.cosign.filter(c=>c.s===me.id&&c.status!=='cosigned'&&!byPt[c.pid]).forEach(c=>pending.push({pid:c.pid,pt:xPt(c.pid).name,kind:'Order / Rx',detail:c.text,date:c.at,why:c.status==='returned'?'ถูกส่งกลับ — ต้องแก้แล้วส่ง Co-sign ใหม่':'รอ Co-sign'}));
  const dcOk=state.discharges.filter(d=>d.s===me.id&&d.status==='approved');
  dcOk.forEach(d=>rows.push({pid:d.p,pt:xPt(d.p).name,kind:'Discharge ที่ได้รับ Approve',detail:d.dcDx,date:'—',pass:true}));
  state.discharges.filter(d=>d.s===me.id&&d.status!=='approved').forEach(d=>pending.push({pid:d.p,pt:xPt(d.p).name,kind:'Discharge',detail:d.dcDx,date:'—',why:'รอ Approve'}));
  const procOk=state.procedures.filter(x=>x.s===me.id&&x.sign&&x.sign.status==='approved').length;
  return {rows,pending,meters:[
    {label:'ผู้ป่วยที่ดูแล (มี Order ที่ได้รับ Approve)',unit:'ราย',have:Object.keys(byPt).length,need:R.cases,hint:'นับจำนวนผู้ป่วยไม่ซ้ำ'},
    {label:'Discharge ที่ได้รับ Approve',unit:'ราย',have:dcOk.length,need:R.dc,hint:'ต้องผ่านอาจารย์หรือ Intern อนุมัติ'},
    {label:'หัตถการที่ลงนามแล้ว',unit:'ครั้ง',have:procOk,need:R.procs,hint:'ดูรายละเอียดที่เมนู Procedure & Sign-off'}]};
}

function groupOf(sid){ return state.groups.find(g=>g.members.includes(sid))||null; }
function activeLinks(sid){ return state.teacherLinks.filter(l=>l.s===sid&&linkStatus(l)==='active'); }
function effKpi(sid){ const s=student(sid), R=state.kpiRules, g=groupOf(sid);
  const r=R.find(x=>x.scope==='student'&&x.key===sid); if(r) return {rule:r,src:r.src||'รายบุคคล'};
  const rg=g&&R.find(x=>x.scope==='group'&&x.key===g.id); if(rg) return {rule:rg,src:'กลุ่ม · '+g.name};
  const ry=R.find(x=>x.scope==='year'&&x.key===String(s.year)); if(ry) return {rule:ry,src:'ชั้นปี '+s.year};
  return null; }
function stuActual(sid){
  let opd=0,ipd=0;
  if(student(sid).tier==='ms4'){ ms4LogbookEntries(sid).forEach(e=>{ if(e.c.setting==='IPD') ipd++; else opd++; }); }
  else { state.entries.filter(e=>e.s===sid&&(e.status==='reviewed-ok'||e.officialCopyId)).forEach(e=>{ const p=patient(e.p); if(p&&p.setting==='IPD') ipd++; else opd++; });
    ipd+=state.ms5.notes.filter(n=>n.author===sid&&n.status==='verified').length+state.ipdDocs.filter(d=>d.author===sid&&d.status==='verified').length; }
  const proc=state.procedures.filter(x=>x.s===sid&&x.sign&&x.sign.status==='approved').length;
  return {opd,ipd,proc,acc:state.kpiAcc[sid]!=null?state.kpiAcc[sid]:null};
}
