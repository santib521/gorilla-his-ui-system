      fieldRow('ลักษณะอาหารที่ทาน',ckGroup('foodType',['อาหารธรรมดา','อาหารอ่อน','อาหารเหลว','อาหารทางการแพทย์'],h.foodType))+
      fieldRow('วิธีรับประทานอาหาร',rdGroup('feed',['ทานได้เอง','ต้องมีคนป้อน','ให้อาหารทางสายยาง'],h.feed))+
      fieldRow('แอลกอฮอล์ / บุหรี่',subRd('env','alcohol',['ไม่ดื่ม','ดื่ม'],(h.env||{}).alcohol)+subRd('env','smoke',['ไม่สูบ','สูบ'],(h.env||{}).smoke))+
      fieldRow('ประวัติแพ้ยา/อาหาร',rdGroup('allergy',['no','yes'].map(function(x){return x==='no'?'ไม่มี':'มี';}),h.allergy==='yes'?'มี':'ไม่มี')+(h.allergy==='มี'?'<input class="input" value="'+E(h.allergyNote)+'" oninput="hv008Set(\'allergyNote\',this.value)" placeholder="ระบุ" style="max-width:220px;margin-top:5px">':''));
    /* §3.4 house type */
    S+='<div class="fm-note" style="margin-top:8px"><b>3.4 ลักษณะบ้านและบริเวณบ้าน</b></div>'+
      fieldRow('ประเภทที่อยู่อาศัย',rdGroup('house',['บ้านเดี่ยว','ทาวน์โฮมส์','อาคารพาณิชย์','คอนโด','ห้องแถว','อพาร์ตเมนต์/หอพัก','บ้านพักสวัสดิการ'],h.house));
    /* §3.5 home environment */
    S+='<div class="fm-note" style="margin-top:8px"><b>3.5 Home Environment (สภาพแวดล้อมในบ้าน)</b></div>'+
      fieldRow('ความสะอาดภายในบ้าน',subRd('env','clean',['สะอาด','ไม่สะอาด'],(h.env||{}).clean))+
      fieldRow('ความเป็นระเบียบ',subRd('env','tidy',['เป็นระเบียบ','ไม่เป็นระเบียบ'],(h.env||{}).tidy))+
      fieldRow('อากาศถ่ายเทในบ้าน',subRd('env','air',['มีอากาศถ่ายเท','ไม่มีอากาศถ่ายเท'],(h.env||{}).air))+
      fieldRow('ความปลอดภัยในบ้าน',subRd('env','safe',['ปลอดภัย','ไม่ปลอดภัย'],(h.env||{}).safe))+
      fieldRow('สัตว์เลี้ยง',subRd('env','pet',['ไม่มี','มี'],(h.env||{}).pet));
    /* §3.6 safety */
    S+='<div class="fm-note" style="margin-top:8px"><b>3.6 Safety (ความปลอดภัย)</b></div>'+
      fieldRow('เตียงนอน',subRd('safety','bed',['ปรับได้/มีราวกันตก','เตียงธรรมดา','นอนพื้น','ควรปรับปรุง'],(h.safety||{}).bed))+
      fieldRow('ห้องน้ำ – ส่วนขับถ่าย',subRd('safety','toilet',['ส้วมชักโครก มีราวจับ','ส้วมซึม','ควรปรับปรุง'],(h.safety||{}).toilet))+
      fieldRow('พื้นห้องน้ำ',subRd('safety','bathfloor',['ไม่ลื่น','ลื่น','มีแผ่นกันลื่น'],(h.safety||{}).bathfloor))+
      fieldRow('ลักษณะพื้นบ้าน',subRd('safety','floor',['พื้นไม้','พื้นกระเบื้อง','พื้นคอนกรีต'],(h.safety||{}).floor))+
      fieldRow('บันได',subRd('safety','stair',['ไม่มีบันได','มีราวจับ','ไม่มีราวจับ'],(h.safety||{}).stair))+
      fieldRow('ระบบไฟฟ้า/แสงสว่าง',subRd('safety','elec',['ปลอดภัย','ควรปรับปรุง','แสงสว่างเพียงพอ','แสงไม่เพียงพอ'],(h.safety||{}).elec));
    /* §3.6b social resources + §3.7 travel */
    S+='<div class="fm-note" style="margin-top:8px"><b>3.6 แหล่งทรัพยากรทางสังคมใกล้บ้าน</b></div>'+
      fieldRow('แหล่งที่พึ่งใกล้บ้าน',ckGroup('resources',['เพื่อนบ้านที่ขอความช่วยเหลือได้','โรงพยาบาล','ศูนย์บริการสาธารณสุข/รพ.สต.','สำนักงานเขต/เทศบาล/อบต.'],h.resources));
    S+='<div class="fm-note" style="margin-top:8px"><b>3.7 การเดินทางมาโรงพยาบาล</b></div>'+
      fieldRow('พาหนะ',ckGroup('travel',['รถส่วนตัว','รถญาติ/คนรู้จัก','รถโดยสารสาธารณะ','รถจ้างเหมา'],h.travel));
    /* §3.8 economic */
    S+='<div class="fm-note" style="margin-top:8px"><b>3.8 สถานะทางเศรษฐกิจ</b></div>'+
      fieldRow('ปัญหาค่าใช้จ่าย','<label class="hv-ck"><input type="checkbox" '+(h.econNoProblem?'checked':'')+' onchange="hv008Set(\'econNoProblem\',this.checked)"> ไม่มีปัญหาค่าใช้จ่าย</label>')+
      fieldRow('แหล่งรายได้',ckGroup('income',['เงินเดือน','เงินบำนาญ','เงินออม/หุ้น/ปันผล','รับเงินจากผู้อื่น','สวัสดิการรัฐ'],h.income))+
      fieldRow('ภาระหนี้สิน',rdGroup('debt',['ไม่มี','มี'],h.debt==='มี'?'มี':(h.debt==='ไม่มี'?'ไม่มี':'ไม่มี'))+(h.debt==='มี'?'<input class="input" value="'+E(h.debtNote)+'" oninput="hv008Set(\'debtNote\',this.value)" placeholder="ระบุ" style="max-width:220px;margin-top:5px">':''))+
      fieldRow('ทรัพย์สิน',ckGroup('assets',['อสังหาริมทรัพย์','ที่ดิน','ยานพาหนะ','ไม่มี'],h.assets));
    /* §4 SW opinion */
    S+='<h4 style="margin:10px 0 4px">4. ความเห็นของนักสังคมสงเคราะห์</h4>'+
      fieldRow('Social Worker Concern','<textarea class="textarea" oninput="hv008Set(\'concern\',this.value)">'+E(h.concern)+'</textarea>')+
      fieldRow('Social Intervention','<textarea class="textarea" oninput="hv008Set(\'intervention\',this.value)">'+E(h.intervention)+'</textarea>')+
      fieldRow('ข้อมูลอื่นๆ','<textarea class="textarea" oninput="hv008Set(\'other\',this.value)">'+E(h.other)+'</textarea>');
    /* Basic ADL */
    S+='<h4 style="margin:12px 0 4px">Basic ADL (Barthel Index) · เต็ม 20 คะแนน</h4>'+
      ADL_ITEMS.map(function(it,i){ return '<div class="fmrow"><div class="q"><b>'+(i+1)+'.</b> '+it[0]+'</div><div class="opts">'+it[1].map(function(o){return '<button type="button" class="opt'+(h.adl[i]===o[0]?' is-active':'')+'" onclick="hv008ADL('+i+','+o[0]+',this)">'+o[0]+' · '+o[1]+'</button>';}).join('')+'</div></div>'; }).join('')+
      '<div class="fm-note">เกณฑ์: 0–4 ติดเตียง (กลุ่ม 3) · 5–11 ติดบ้าน (กลุ่ม 2) · &gt;11 ติดสังคม (กลุ่ม 1)</div>';
    /* Zarit */
    S+='<h4 style="margin:12px 0 4px">แบบประเมินภาระการดูแล Zarit Burden (12 ข้อ) · เต็ม 48 คะแนน</h4>'+
      ZARIT_Q.map(function(q,i){ return '<div class="fmrow"><div class="q"><b>'+(i+1)+'.</b> '+q+'</div><div class="opts">'+ZARIT_OPT.map(function(o){return '<button type="button" class="opt'+(h.zarit[i]===o[0]?' is-active':'')+'" onclick="hv008Zarit('+i+','+o[0]+',this)">'+o[0]+'·'+o[1]+'</button>';}).join('')+'</div></div>'; }).join('')+
      '<div class="fm-note">เกณฑ์: 0–10 ภาระน้อย · 11–20 ปานกลาง · &gt;20 รุนแรง</div>';
    if(!opts.embedded){
      S+='<div class="fm-save-row"><button class="btn btn--secondary" onclick="saveHv008(false)"><span class="icon" data-icon="floppy-disk"></span>บันทึกร่าง (Draft)</button><button class="btn btn--primary" onclick="saveHv008(true)"><span class="icon" data-icon="floppy-disk"></span>บันทึก FM-MSW-008 สมบูรณ์</button></div>';
    }
    S+='</div></div></div>';
    return S;
  }
  function hv008Snapshot(c,status){ var h=hvWork(c); return {status:status,savedAt:new Date().toISOString(),adlTotal:adlTotal(h),adlBand:adlBand(adlTotal(h)).k,zaritTotal:zaritTotal(h),zaritBand:zaritBand(zaritTotal(h)).k,data:JSON.parse(JSON.stringify(h))}; }
  window.saveHv008=function(complete){
    var c=A(),h=hvWork(c);
    if(complete){ if(!(h.purpose&&h.purpose.length)){ toast('error','กรุณาเลือกวัตถุประสงค์การเยี่ยมบ้านอย่างน้อย 1 ข้อ'); return; } if(!(h.concern||'').trim()){ toast('error','กรุณากรอก Social Worker Concern (ข้อ 4)'); return; } }
    c.extraAssessments=c.extraAssessments||{};
    c.extraAssessments.homevisit=hv008Snapshot(c,complete?'saved':'draft');
    c.history=c.history||[]; c.history.push({type:'assess',label:(complete?'บันทึก':'บันทึกร่าง')+' FM-MSW-008 (Home visit) · ADL '+adlTotal(h)+'/20 · Zarit '+zaritTotal(h)+'/48',ts:new Date().toISOString(),actor:ACTOR});
    toast('success',(complete?'บันทึก FM-MSW-008 สมบูรณ์ (เขียว)':'บันทึกร่าง FM-MSW-008 (เหลือง)'));
    STATE.assessStep='homevisit'; render();
  };
  window.__hv008FormHtml=hv008FormHtml; window.__hv008Snapshot=hv008Snapshot; window.__hvWork=hvWork; window.__abilityFormHtml=abilityFormHtml;

  /* ------------------------------------------------------------------ Router: render real forms for ability / homevisit assessment-set items */
  var __prevMissing=window.missingAssessmentHtml;
  window.missingAssessmentHtml=function(c,id){
    if(id==='ability') return abilityFormHtml(c);
    if(id==='homevisit') return hv008FormHtml(c,{});
    return __prevMissing ? __prevMissing(c,id) : '<div class="assess-missing"><h3>'+id+'</h3><p>ยังไม่มีแบบฟอร์ม</p></div>';
  };

  /* ------------------------------------------------------------------ 2.3 Home visit drawer: SDMA re-assessment + FM-MSW-008 */
  function hv008ReadonlySummary(hvRec){
    if(!hvRec) return '<div class="fm-note">ครั้งนี้ไม่มีข้อมูล FM-MSW-008</div>';
    var d=hvRec.data||{};
    return '<div class="section" style="margin-top:12px"><div class="section-head"><h3>FM-MSW-008 (บันทึกแล้ว · Read only)</h3><span class="sub">ADL '+(hvRec.adlTotal!=null?hvRec.adlTotal+'/20 · '+hvRec.adlBand:'—')+' · Zarit '+(hvRec.zaritTotal!=null?hvRec.zaritTotal+'/48 · '+hvRec.zaritBand:'—')+'</span></div><div class="section-body">'+
      '<div class="hv-field-row"><label class="k">วัตถุประสงค์</label><div class="v">'+E((d.purpose||[]).join(', ')||'—')+'</div></div>'+
      '<div class="hv-field-row"><label class="k">Concern</label><div class="v">'+E(d.concern||'—')+'</div></div>'+
      '<div class="hv-field-row"><label class="k">Intervention</label><div class="v">'+E(d.intervention||'—')+'</div></div>'+
    '</div></div>';
  }
  var __prevRenderHVTab=window.v64RenderHomeVisitTab;
  window.v64RenderHomeVisitTab=function(active){
    if(typeof __prevRenderHVTab!=='function') return;
    __prevRenderHVTab(active);
    var m=window.__homeVisitMode; if(!m) return;
    var r=DB.consults.find(function(x){return x.id===m.id;}); if(!r) return;
    var host=document.getElementById('v64HomeVisitHost'); if(!host) return;
    var visits=r.homeVisits||[], currentIndex=visits.length, readonly=active<currentIndex;
    var formWrap=host.querySelector('.v64-hv-form'); if(!formWrap) return;
    var block=document.createElement('div'); block.className='hv008-in-visit';
    if(readonly){ block.innerHTML=hv008ReadonlySummary((visits[active]||{}).hv008); }
    else { if(!r._hv008) hvWork(r); block.innerHTML='<div class="banner banner--info" style="margin:14px 0 6px"><span class="icon" data-icon="clipboard-check"></span><div><strong>FM-MSW-008 · แบบเยี่ยมบ้าน</strong><p>บันทึกพร้อมกับ S.D.M.A. ด้านบนเมื่อกดบันทึกการเยี่ยมบ้าน</p></div></div>'+hv008FormHtml(r,{embedded:true}); }
    formWrap.appendChild(block);
    if(typeof hydrateIcons==='function') hydrateIcons(host);
    if(!readonly) setTimeout(function(){ if(window.hv008Recalc) window.hv008Recalc(); },0);
  };

  /* Seed a fresh FM-MSW-008 working copy whenever a home visit drawer opens. */
  var __prevOpenFollowUp=window.openFollowUpDrawer;
  window.openFollowUpDrawer=function(id){
    var r=DB.consults.find(function(x){return x.id===id;}); if(r) r._hv008=null;
    return __prevOpenFollowUp.apply(this,arguments);
  };

  /* On home-visit save, attach the FM-MSW-008 snapshot to the pushed visit record + mark it saved. */
  var __prevSaveHV=window.v60SaveHomeVisitSdma;
  window.v60SaveHomeVisitSdma=function(complete){
    var m=window.__homeVisitMode; var r=m?DB.consults.find(function(x){return x.id===m.id;}):null;
    var before=(r&&r.homeVisits)?r.homeVisits.length:0;
    var snap=(r&&complete)?hv008Snapshot(r,'saved'):null;
    var res=__prevSaveHV.apply(this,arguments);
    if(complete && r && r.homeVisits && r.homeVisits.length>before){
      var rec=r.homeVisits[r.homeVisits.length-1];
      rec.hv008=snap;
      r.extraAssessments=r.extraAssessments||{}; r.extraAssessments.homevisit=snap;
      r.history.push({type:'assess',label:'บันทึก FM-MSW-008 (Home visit) จากการเยี่ยมบ้าน · ADL '+(snap.adlTotal)+'/20 · Zarit '+(snap.zaritTotal)+'/48',ts:new Date().toISOString(),actor:ACTOR});
      r._hv008=null;
    }
    return res;
  };

  /* Outermost saveSdma: in home-visit mode, route straight to the home-visit handler so the
     normal SDMA "all sections complete + fresh consent" gate (v50) does not block a re-assessment
     at the visit (consent is already on file from the original assessment). Normal (non-home-visit)
     saves fall through to the existing chain unchanged. */
  var __v76SaveSdma=saveSdma;
  saveSdma=function(complete){
    if(window.__homeVisitMode){ if(window.v60SaveHomeVisitSdma(complete)) return; }
    return __v76SaveSdma(complete);
  };
})();
</script>
