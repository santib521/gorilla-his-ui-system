<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorilla HIS — งานสังคมสงเคราะห์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Gorilla HIS — Social Work Module (Consult / Request+Approval+Quota Redemption)
   Discovery Mockup — built per GORILLA_HIS_MOCKUP_Factory_Launcher_v3.4.md
   Tokens below are copied verbatim from design-system/tokens.css (Binding Reuse).
   Font: IBM Plex Sans Thai loaded via Google Fonts per Launcher §23(a) exception —
   this is the ONLY external resource in this file. Font Awesome semantic classes
   are preserved as data-fa attributes on every icon (Dev traceability contract per
   icon-rules.md) with an inline-SVG line-icon rendering because CDN loading of
   Font Awesome is prohibited in the Mockup Factory (icon-rules.md §2 fallback).
   ========================================================================== */
:root{
  --color-blue-50:#eef0fd; --color-blue-100:#dfe3fb; --color-blue-200:#c8cdf8;
  --color-blue-500:#6366f1; --color-blue-600:#4f46e5; --color-blue-700:#4338ca; --color-blue-900:#24205f;
  --color-brand-mark:#0f8b8d; --color-teal-50:#edf8f8; --color-teal-100:#d7efef;
  --color-green-50:#ecfdf3; --color-green-500:#16a34a; --color-green-700:#15803d;
  --color-red-50:#fef2f2; --color-red-100:#fee2e2; --color-red-500:#dc2626; --color-red-600:#b91c1c; --color-red-700:#991b1b;
  --color-orange-50:#fff7ed; --color-orange-100:#ffedd5; --color-orange-500:#ea580c; --color-orange-600:#c2410c;
  --color-yellow-50:#fffbeb; --color-yellow-500:#d97706;
  --color-gray-25:#fbfcfd; --color-gray-50:#f7f9fb; --color-gray-75:#f2f5f8; --color-gray-100:#edf1f5;
  --color-gray-150:#e7ebf0; --color-gray-200:#dce2e8; --color-gray-300:#c7d0d9; --color-gray-400:#96a2af;
  --color-gray-500:#687584; --color-gray-600:#4d5967; --color-gray-700:#374250; --color-gray-800:#222d3a;
  --color-gray-900:#121b27; --color-gray-950:#0b121d; --color-white:#ffffff;
  --color-status-critical:var(--color-red-600); --color-status-critical-bg:var(--color-red-50); --color-status-critical-border:var(--color-red-500);
  --color-status-warning:var(--color-orange-600); --color-status-warning-bg:var(--color-orange-50); --color-status-warning-border:var(--color-orange-500);
  --color-status-normal:var(--color-green-700); --color-status-normal-bg:var(--color-green-50); --color-status-normal-border:var(--color-green-500);
  --color-status-info:var(--color-blue-700); --color-status-info-bg:var(--color-blue-50); --color-status-info-border:var(--color-blue-500);
  --color-status-inactive:var(--color-gray-500); --color-status-inactive-bg:var(--color-gray-100); --color-status-inactive-border:var(--color-gray-300);
  --color-primary-action:var(--color-blue-600); --color-primary-action-hover:var(--color-blue-700); --color-primary-action-pressed:var(--color-blue-900); --color-primary-action-soft:var(--color-blue-50);
  --color-danger-action:var(--color-gray-700); --color-danger-action-hover:var(--color-gray-800);
  --color-bg-page:var(--color-gray-75); --color-bg-canvas:var(--color-gray-75); --color-bg-surface:var(--color-white);
  --color-bg-surface-subtle:var(--color-gray-25); --color-bg-instrument:#f9fafc; --color-bg-instrument-selected:var(--color-blue-50);
  --color-bg-elevated:var(--color-white); --color-bg-sidebar:var(--color-gray-900); --color-bg-command-rail:#101927;
  --color-border:var(--color-gray-200); --color-border-subtle:var(--color-gray-150); --color-border-strong:var(--color-gray-300); --color-border-optical:rgba(18,27,39,.10);
  --color-text-primary:var(--color-gray-900); --color-text-secondary:var(--color-gray-600); --color-text-tertiary:var(--color-gray-500);
  --color-text-inverse:var(--color-white); --color-text-technical:var(--color-gray-500);
  --font-family-base:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun","Segoe UI",Tahoma,sans-serif;
  --font-family-mono:"IBM Plex Sans Thai","Consolas","Noto Sans Mono",monospace;
  --font-size-2xs:.6875rem; --font-size-xs:.75rem; --font-size-sm:.875rem; --font-size-base:1rem;
  --font-size-lg:1.125rem; --font-size-xl:1.375rem; --font-size-2xl:1.75rem; --font-size-instrument:2rem;
  --font-weight-normal:400; --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700; --font-weight-heavy:760;
  --line-height-tight:1.22; --line-height-normal:1.5; --line-height-relaxed:1.65;
  --letter-spacing-technical:.045em; --letter-spacing-product:.06em;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-7:32px; --space-8:48px; --space-9:64px;
  --radius-xs:3px; --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px; --radius-full:9999px;
  --shadow-optical:0 1px 0 rgba(255,255,255,.72) inset,0 1px 2px rgba(18,27,39,.035);
  --shadow-control:0 1px 2px rgba(18,27,39,.08),0 1px 0 rgba(255,255,255,.82) inset;
  --shadow-elevated:0 8px 28px rgba(18,27,39,.12),0 2px 6px rgba(18,27,39,.07);
  --shadow-overlay:0 18px 48px rgba(18,27,39,.18),0 4px 12px rgba(18,27,39,.08);
  --layout-command-rail-width:64px; --layout-topbar-height:52px; --layout-content-max-width:1600px;
  --duration-micro:140ms; --duration-control:220ms; --duration-causal:320ms;
  --ease-standard:cubic-bezier(.2,.7,.2,1); --ease-emphasized:cubic-bezier(.16,1,.3,1);
  --transition-fast:var(--duration-micro) var(--ease-standard); --transition-base:var(--duration-control) var(--ease-standard); --transition-causal:var(--duration-causal) var(--ease-emphasized);
  --z-dropdown:100; --z-sticky:200; --z-modal-backdrop:900; --z-modal:1000; --z-toast:1100;
  /* module-local semantic: color-group scale (WORKING ASSUMPTION scoring, see Design Notes) */
  --group-red:#b91c1c; --group-red-bg:#fef2f2; --group-orange:#c2410c; --group-orange-bg:#fff7ed;
  --group-yellow:#a16207; --group-yellow-bg:#fffbeb; --group-green:#15803d; --group-green-bg:#ecfdf3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-family-base);background:var(--color-bg-canvas);color:var(--color-text-primary);font-size:var(--font-size-sm);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul{list-style:none}
::selection{background:var(--color-blue-100)}
.mono{font-family:var(--font-family-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- shell (adapted from application-shell.html) ---------- */
.app-shell{min-height:100vh;display:grid;grid-template-columns:var(--layout-command-rail-width) 1fr;grid-template-rows:var(--layout-topbar-height) 1fr;background:var(--color-bg-canvas)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-5);background:rgba(255,255,255,.97);border-bottom:1px solid var(--color-border-optical);box-shadow:var(--shadow-optical);position:sticky;top:0;z-index:var(--z-sticky)}
.brand{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.brand-mark{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--radius-sm);background:linear-gradient(145deg,var(--color-blue-600),var(--color-blue-700));color:var(--color-text-inverse);font-size:var(--font-size-2xs);font-weight:var(--font-weight-bold);box-shadow:var(--shadow-control)}
.product-name{font-size:var(--font-size-sm);font-weight:var(--font-weight-heavy);letter-spacing:var(--letter-spacing-product)}
.module-context{display:flex;align-items:center;gap:var(--space-2);padding-left:var(--space-4);border-left:1px solid var(--color-border-subtle);color:var(--color-text-secondary);font-size:var(--font-size-xs);white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.role-picker{display:flex;align-items:center;gap:var(--space-2);padding:6px var(--space-3);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-gray-25);font-size:var(--font-size-xs)}
.role-picker select{border:0;background:transparent;font-weight:var(--font-weight-semibold);color:var(--color-text-primary);padding:2px 4px 2px 2px;outline:none}
.role-picker .icon{color:var(--color-text-tertiary)}
.topbar-clock{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);letter-spacing:var(--letter-spacing-technical)}
.guide-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-border-strong);background:var(--color-white);border-radius:var(--radius-full);padding:6px 12px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-secondary);transition:var(--transition-fast)}
.guide-chip:hover{border-color:var(--color-blue-500);color:var(--color-blue-700)}

.command-rail{background:linear-gradient(180deg,var(--color-bg-command-rail),var(--color-gray-950));padding:var(--space-3) var(--space-2);display:flex;flex-direction:column;justify-content:flex-start;gap:var(--space-1);border-right:1px solid rgba(255,255,255,.04);transition:width var(--transition-base);overflow:hidden;min-height:0}
.rail-item{position:relative;width:100%;min-height:46px;display:grid;place-items:center;border:0;border-radius:var(--radius-md);background:transparent;color:var(--color-gray-400);transition:background var(--transition-fast),color var(--transition-fast),transform var(--transition-fast)}
.rail-item:hover{background:rgba(255,255,255,.07);color:var(--color-white)}
.rail-item:active{transform:translateY(1px)}
.rail-item.is-active{background:rgba(255,255,255,.97);color:var(--color-primary-action);box-shadow:var(--shadow-control)}
.rail-item.is-active::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--color-blue-500)}
.rail-item .rail-count{position:absolute;top:4px;right:6px;min-width:15px;height:15px;padding:0 3px;border-radius:var(--radius-full);background:var(--color-status-critical);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--color-bg-command-rail)}
.rail-label{position:absolute;left:calc(100% + 10px);padding:6px 10px;border-radius:var(--radius-md);background:var(--color-gray-900);color:#fff;white-space:nowrap;font-size:var(--font-size-2xs);opacity:0;pointer-events:none;transform:translateX(-4px);transition:opacity var(--transition-fast),transform var(--transition-fast);box-shadow:var(--shadow-elevated);z-index:5}
.rail-item:hover .rail-label{opacity:1;transform:translateX(0)}

.workspace{min-width:0;overflow:auto;padding:var(--space-3)}
.work-surface{min-height:calc(100vh - var(--layout-topbar-height) - var(--space-6));background:var(--color-bg-surface);border:1px solid var(--color-border-optical);border-radius:var(--radius-lg);box-shadow:var(--shadow-optical);overflow:hidden;display:flex;flex-direction:column}
.page-context{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);min-height:56px;padding:var(--space-3) var(--space-5);background:linear-gradient(180deg,var(--color-bg-surface),var(--color-bg-surface-subtle));border-bottom:1px solid var(--color-border-subtle);flex:0 0 auto}
.breadcrumb{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);letter-spacing:var(--letter-spacing-technical);text-transform:uppercase}
.page-title{margin:2px 0 0;font-size:var(--font-size-xl);font-weight:var(--font-weight-heavy);line-height:var(--line-height-tight)}
.context-right{display:flex;align-items:center;gap:var(--space-3)}
.content{width:100%;max-width:var(--layout-content-max-width);margin:0 auto;padding:var(--space-5);flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--radius-md);border:1px solid transparent;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);transition:var(--transition-fast);white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--color-blue-500);outline-offset:2px}
.btn--primary{background:var(--color-primary-action);color:#fff;box-shadow:var(--shadow-control)}
.btn--primary:hover{background:var(--color-primary-action-hover)}
.btn--primary:active{background:var(--color-primary-action-pressed)}
.btn--primary:disabled{background:var(--color-gray-300);color:var(--color-gray-500);cursor:not-allowed;box-shadow:none}
.btn--secondary{background:var(--color-white);color:var(--color-text-primary);border-color:var(--color-border-strong)}
.btn--secondary:hover{border-color:var(--color-blue-500);color:var(--color-blue-700)}
.btn--quiet{background:transparent;color:var(--color-text-secondary);border-color:transparent}
.btn--quiet:hover{background:var(--color-gray-100);color:var(--color-text-primary)}
.btn--danger{background:var(--color-white);color:var(--color-status-critical);border-color:var(--color-red-100)}
.btn--danger:hover{background:var(--color-red-50);border-color:var(--color-status-critical-border)}
.btn--sm{height:32px;padding:0 12px;font-size:var(--font-size-xs)}
.btn .icon{width:15px;height:15px;flex:0 0 auto}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-full);font-size:var(--font-size-2xs);font-weight:var(--font-weight-semibold);letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.badge--critical{background:var(--color-status-critical-bg);color:var(--color-status-critical);border-color:var(--color-red-100)}
.badge--warning{background:var(--color-status-warning-bg);color:var(--color-status-warning);border-color:var(--color-orange-100)}
.badge--normal{background:var(--color-status-normal-bg);color:var(--color-status-normal);border-color:#c8ecd7}
.badge--info{background:var(--color-status-info-bg);color:var(--color-status-info);border-color:var(--color-blue-100)}
.badge--inactive{background:var(--color-status-inactive-bg);color:var(--color-status-inactive);border-color:var(--color-border-strong)}
.badge--group-red{background:var(--group-red-bg);color:var(--group-red);border-color:#f3caca}
.badge--group-orange{background:var(--group-orange-bg);color:var(--group-orange);border-color:#fad9b6}
.badge--group-yellow{background:var(--group-yellow-bg);color:var(--group-yellow);border-color:#f5e3ad}
.badge--group-green{background:var(--group-green-bg);color:var(--group-green);border-color:#bfe6cf}

/* ---------- tabs ---------- */
.gtabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--color-border-subtle);padding:0 var(--space-5)}
.gtab{position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);color:var(--color-text-secondary);background:transparent;border:0;transition:var(--transition-fast)}
.gtab:hover{color:var(--color-text-primary);background:var(--color-gray-50)}
.gtab.is-active{color:var(--color-primary-action);background:var(--color-bg-instrument-selected)}
.gtab.is-active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--color-primary-action);border-radius:2px}
.gtab .count{background:var(--color-gray-200);color:var(--color-text-secondary);border-radius:var(--radius-full);padding:1px 7px;font-size:10px;font-weight:700}
.gtab.is-active .count{background:var(--color-blue-600);color:#fff}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);color:var(--color-text-secondary)}
.field .hint{font-size:var(--font-size-2xs);color:var(--color-text-tertiary)}
.field .err{font-size:var(--font-size-2xs);color:var(--color-status-critical);font-weight:var(--font-weight-medium)}
.input,.select,.textarea{height:38px;padding:0 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-white);transition:var(--transition-fast);width:100%}
.textarea{height:auto;padding:10px 12px;resize:vertical;min-height:76px;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--color-blue-500);box-shadow:0 0 0 3px var(--color-blue-100)}
.input.has-error,.select.has-error,.textarea.has-error{border-color:var(--color-status-critical);box-shadow:0 0 0 3px var(--color-red-50)}
.input:disabled,.select:disabled,.textarea:disabled{background:var(--color-gray-75);color:var(--color-text-tertiary);cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4)}
.check-row{display:flex;align-items:flex-start;gap:8px;font-size:var(--font-size-sm)}
.check-row input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);overflow:hidden}
.seg button{border:0;background:var(--color-white);padding:8px 14px;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);color:var(--color-text-secondary);border-right:1px solid var(--color-border-strong)}
.seg button:last-child{border-right:0}
.seg button.is-active{background:var(--color-primary-action);color:#fff}

/* ---------- section / instrument surfaces ---------- */
.section{border:1px solid var(--color-border-subtle);border-radius:var(--radius-lg);background:var(--color-white);margin-bottom:var(--space-4)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;user-select:none}
.section-head h3{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold)}
.section-head .sub{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);font-weight:var(--font-weight-normal)}
.section-body{padding:var(--space-4)}
.section.is-collapsed .section-body{display:none}
.section-head .chev{transition:transform var(--transition-fast);color:var(--color-text-tertiary)}
.section.is-collapsed .chev{transform:rotate(-90deg)}
.instrument{background:var(--color-bg-instrument);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}

/* ---------- patient / case context anchor ---------- */
.ctx-anchor{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5);background:linear-gradient(180deg,#fff,var(--color-gray-25));border-bottom:1px solid var(--color-border-subtle);flex:0 0 auto;flex-wrap:wrap}
.ctx-id{width:40px;height:40px;border-radius:var(--radius-md);background:var(--color-blue-50);color:var(--color-blue-700);display:grid;place-items:center;flex:0 0 auto}
.ctx-main{min-width:0}
.ctx-name{font-size:var(--font-size-base);font-weight:var(--font-weight-bold);display:flex;align-items:center;gap:8px}
.ctx-meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:3px}
.ctx-meta b{color:var(--color-text-primary);font-weight:var(--font-weight-semibold)}
.ctx-sep{color:var(--color-border-strong)}
.ctx-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- worklist ---------- */
.attention-strip{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:10px var(--space-5);background:var(--color-blue-50);border-bottom:1px solid var(--color-blue-100);font-size:var(--font-size-xs);color:var(--color-blue-900)}
.attention-strip .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--color-blue-100);padding:4px 10px;border-radius:var(--radius-full);font-weight:var(--font-weight-semibold)}
.attention-strip .pill b{color:var(--color-blue-700)}
.cmdbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border-subtle);flex-wrap:wrap}
.searchbox{position:relative;flex:1;min-width:220px;max-width:360px}
.searchbox .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-tertiary)}
.searchbox input{padding-left:36px}
.filterchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--color-border-strong);border-radius:var(--radius-full);background:#fff;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-secondary)}
.filterchip.is-active{border-color:var(--color-primary-action);color:var(--color-primary-action);background:var(--color-blue-50)}
.result-count{margin-left:auto;font-size:var(--font-size-2xs);color:var(--color-text-tertiary)}

.wl{width:100%;border-collapse:collapse}
.wl thead th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary);font-weight:var(--font-weight-semibold);padding:8px var(--space-3);border-bottom:1px solid var(--color-border-subtle);background:var(--color-gray-25);position:sticky;top:0}
.wl tbody tr{border-bottom:1px solid var(--color-border-subtle);transition:background var(--transition-fast)}
.wl tbody tr:hover{background:var(--color-gray-25)}
.wl tbody tr.is-attn{background:#ecfdf3}
.wl tbody tr.is-attn:hover{background:#e2fbe9}
.wl tbody tr.is-off{opacity:.55}
.wl tbody tr.is-off:hover{opacity:1;background:var(--color-gray-25)}
.wl td{padding:10px var(--space-3);vertical-align:middle;font-size:var(--font-size-sm)}
.wl .cid{font-family:var(--font-family-mono);font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.wl .pname{font-weight:var(--font-weight-semibold)}
.wl .is-off .pname{text-decoration:line-through;color:var(--color-text-tertiary)}
.wl .phn{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-tertiary)}
.wl .reason{color:var(--color-text-secondary);font-size:var(--font-size-xs);max-width:260px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .money{font-family:var(--font-family-mono);font-variant-numeric:tabular-nums}
.qbar-wrap{display:flex;flex-direction:column;gap:3px;min-width:120px}
.qbar-label{font-family:var(--font-family-mono);font-size:11px;color:var(--color-text-secondary);display:flex;justify-content:space-between}
.qbar{height:6px;border-radius:var(--radius-full);background:var(--color-gray-150);overflow:hidden}
.qbar > span{display:block;height:100%;background:var(--color-blue-600);border-radius:var(--radius-full);transition:width var(--transition-causal)}
.wl .rowaction{white-space:nowrap}
.new-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--color-status-normal);display:inline-block;box-shadow:0 0 0 3px var(--color-status-normal-bg)}
.emptywrap{padding:var(--space-8) var(--space-5);text-align:center;color:var(--color-text-tertiary)}
.emptywrap .icon{width:34px;height:34px;margin:0 auto var(--space-3);opacity:.5}

/* ---------- assessment workspace ---------- */
.eco-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm)}
.eco-table th{text-align:left;font-size:var(--font-size-2xs);color:var(--color-text-tertiary);font-weight:var(--font-weight-semibold);padding:6px 8px;border-bottom:1px solid var(--color-border-subtle)}
.eco-table td{padding:5px 8px;border-bottom:1px solid var(--color-gray-100)}
.eco-table input{height:32px;text-align:right;font-family:var(--font-family-mono)}
.eco-total-row td{font-weight:var(--font-weight-bold);border-top:2px solid var(--color-border-strong);border-bottom:0;background:var(--color-gray-25)}
.eco-total-row .money{font-family:var(--font-family-mono)}
.net-income{font-size:var(--font-size-lg);font-weight:var(--font-weight-heavy);font-family:var(--font-family-mono)}
.net-income.is-neg{color:var(--color-status-critical)}

.fra-grid{display:grid;grid-template-columns:1fr auto;gap:var(--space-2) var(--space-4);align-items:center}
.fra-grid .crit{font-size:var(--font-size-sm)}
.rate5{display:inline-flex;gap:4px}
.rate5 button{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--color-border-strong);background:#fff;font-size:var(--font-size-xs);font-weight:700;color:var(--color-text-secondary)}
.rate5 button.is-active{background:var(--color-blue-600);border-color:var(--color-blue-600);color:#fff}

.score-instrument{display:flex;align-items:center;gap:var(--space-5);padding:var(--space-4);border-radius:var(--radius-lg);border:1px solid var(--color-border-subtle);background:var(--color-bg-instrument)}
.score-dial{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-family:var(--font-family-mono);font-size:var(--font-size-xl);font-weight:var(--font-weight-heavy);border:6px solid var(--color-gray-200)}
.score-dial.g-red{border-color:var(--group-red);color:var(--group-red);background:var(--group-red-bg)}
.score-dial.g-orange{border-color:var(--group-orange);color:var(--group-orange);background:var(--group-orange-bg)}
.score-dial.g-yellow{border-color:var(--group-yellow);color:var(--group-yellow);background:var(--group-yellow-bg)}
.score-dial.g-green{border-color:var(--group-green);color:var(--group-green);background:var(--group-green-bg)}
.score-detail{flex:1}
.score-detail .grouplabel{font-size:var(--font-size-base);font-weight:var(--font-weight-bold);display:flex;align-items:center;gap:8px}
.score-breakdown{display:flex;gap:var(--space-5);margin-top:6px;font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.score-breakdown b{font-family:var(--font-family-mono);color:var(--color-text-primary)}
.formula-tag{font-size:10px;color:var(--color-text-tertiary);border:1px dashed var(--color-border-strong);border-radius:var(--radius-full);padding:2px 8px;margin-left:auto}

.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--color-border-strong);border-radius:var(--radius-full);padding:5px 11px;font-size:var(--font-size-xs);background:#fff;color:var(--color-text-secondary)}
.chip.is-selected{background:var(--color-blue-600);border-color:var(--color-blue-600);color:#fff}

.prior-card{border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);background:var(--color-bg-instrument);padding:var(--space-3) var(--space-4);display:flex;gap:var(--space-5);flex-wrap:wrap}
.prior-card .kv{display:flex;flex-direction:column;gap:2px}
.prior-card .kv .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-tertiary)}
.prior-card .kv .v{font-family:var(--font-family-mono);font-weight:var(--font-weight-semibold)}

.choice-card{border:2px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:var(--transition-fast);flex:1}
.choice-card:hover{border-color:var(--color-blue-300,#a5b4fc)}
.choice-card.is-selected{border-color:var(--color-primary-action);background:var(--color-blue-50)}
.choice-card h4{font-size:var(--font-size-sm);font-weight:var(--font-weight-bold);display:flex;align-items:center;gap:8px}
.choice-card p{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px}

/* ---------- entitlement / redemption dashboard ---------- */
.ent-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}
.ent-tile{border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);background:var(--color-bg-instrument);padding:var(--space-3) var(--space-4)}
.ent-tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-tertiary)}
.ent-tile .v{font-family:var(--font-family-mono);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);margin-top:4px}
.ent-tile .v small{font-size:var(--font-size-xs);font-weight:var(--font-weight-normal);color:var(--color-text-tertiary)}
.ent-tile.has-count{border-color:var(--color-status-critical)}
.big-qbar{height:12px;border-radius:var(--radius-full);background:var(--color-gray-150);overflow:hidden;margin-top:8px}
.big-qbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--color-blue-500),var(--color-blue-600));transition:width var(--transition-causal)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--color-border-subtle)}
.tl-item{position:relative;padding-bottom:var(--space-4)}
.tl-item::before{content:"";position:absolute;left:-26px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--color-blue-500)}
.tl-item.tl-visit::before{border-color:var(--color-status-normal)}
.tl-item.tl-homevisit::before{border-color:var(--color-orange-500)}
.tl-item.tl-close::before{border-color:var(--color-status-inactive);background:var(--color-gray-300)}
.tl-head{display:flex;align-items:center;gap:8px;font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold)}
.tl-time{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-family-mono)}
.tl-body{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:3px}
.tl-card{margin-top:6px;background:var(--color-bg-instrument);border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:8px 10px;font-size:var(--font-size-xs)}

/* ---------- request line items ---------- */
.items-table{width:100%;border-collapse:collapse}
.items-table th{font-size:var(--font-size-2xs);color:var(--color-text-tertiary);text-align:left;padding:6px 8px;border-bottom:1px solid var(--color-border-subtle)}
.items-table td{padding:6px 8px;border-bottom:1px solid var(--color-gray-100);vertical-align:middle}
.items-table input{height:34px}
.items-table .money-in{font-family:var(--font-family-mono);text-align:right}
.items-total{display:flex;justify-content:flex-end;gap:var(--space-6);padding:10px var(--space-3);background:var(--color-gray-25);border-top:2px solid var(--color-border-strong);font-family:var(--font-family-mono)}
.items-total .t{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.items-total .t .k{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-family-base)}
.items-total .t .v{font-weight:700}

/* ---------- alert banners ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);border:1px solid;margin-bottom:var(--space-4)}
.banner .icon{flex:0 0 auto;margin-top:1px}
.banner strong{display:block;font-size:var(--font-size-sm);margin-bottom:2px}
.banner p{font-size:var(--font-size-xs);color:var(--color-text-secondary)}
.banner--info{background:var(--color-status-info-bg);border-color:var(--color-blue-100);color:var(--color-blue-900)}
.banner--info .icon{color:var(--color-status-info)}
.banner--warning{background:var(--color-status-warning-bg);border-color:var(--color-orange-100)}
.banner--warning .icon{color:var(--color-status-warning)}
.banner--critical{background:var(--color-status-critical-bg);border-color:var(--color-red-100)}
.banner--critical .icon{color:var(--color-status-critical)}
.banner--normal{background:var(--color-status-normal-bg);border-color:#c8ecd7}
.banner--normal .icon{color:var(--color-status-normal)}
.banner--locked{background:var(--color-gray-100);border-color:var(--color-border-strong);color:var(--color-text-secondary)}

/* ---------- modal / drawer / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,18,29,.42);display:none;align-items:center;justify-content:center;z-index:var(--z-modal-backdrop);animation:fadein var(--transition-base)}
.overlay.is-open{display:flex}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:480px;max-width:92vw;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);max-height:88vh;display:flex;flex-direction:column;animation:popin var(--transition-causal)}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border-subtle)}
.modal-head h3{font-size:var(--font-size-base);font-weight:var(--font-weight-bold)}
.modal-body{padding:var(--space-5);overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:var(--space-4) var(--space-5);border-top:1px solid var(--color-border-subtle)}

.drawer-wrap{position:fixed;inset:0;z-index:var(--z-modal);display:none}
.drawer-wrap.is-open{display:block}
.drawer-back{position:absolute;inset:0;background:rgba(11,18,29,.4);animation:fadein var(--transition-base)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:560px;max-width:94vw;background:#fff;box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;transform:translateX(0);animation:slidein var(--transition-causal)}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:translateX(0);opacity:1}}
.drawer-head{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.drawer-head h3{font-size:var(--font-size-base);font-weight:var(--font-weight-bold)}
.drawer-body{padding:var(--space-5);overflow:auto;flex:1}
.drawer-foot{padding:var(--space-4) var(--space-5);border-top:1px solid var(--color-border-subtle);display:flex;justify-content:flex-end;gap:10px;flex:0 0 auto}
.iconbtn{width:32px;height:32px;border-radius:var(--radius-md);display:grid;place-items:center;background:transparent;border:0;color:var(--color-text-tertiary)}
.iconbtn:hover{background:var(--color-gray-100);color:var(--color-text-primary)}

.toastwrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:var(--z-toast)}
.toast{display:flex;align-items:center;gap:10px;background:var(--color-gray-900);color:#fff;padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-overlay);font-size:var(--font-size-sm);animation:toastin var(--transition-causal);min-width:260px}
.toast.is-error{background:var(--color-red-700)}
.toast.is-success .icon{color:#4ade80}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.hstack{display:flex;gap:var(--space-3);align-items:center}
.vstack{display:flex;flex-direction:column;gap:var(--space-3)}
.muted{color:var(--color-text-tertiary)}
.divider{height:1px;background:var(--color-border-subtle);margin:var(--space-4) 0}
.demo-note{font-size:10px;color:var(--color-text-tertiary);border-left:2px solid var(--color-border-strong);padding-left:8px;margin-top:4px}

/* ---------- Round 4 (2026-09-04): unified Consult model, consent branch, 3-worklist restructure ---------- */
.age-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);font-size:10px;font-weight:700;font-family:var(--font-family-mono);white-space:nowrap}
.age-chip.age-ok{background:var(--color-gray-100);color:var(--color-text-secondary)}
.age-chip.age-warn{background:var(--color-status-warning-bg);color:var(--color-status-warning)}
.age-chip.age-crit{background:var(--color-status-critical-bg);color:var(--color-status-critical);font-weight:800}
/* Round 5 — compact KPI tile strip, replacing the round-4 reminder banner (stakeholder feedback:
   "Dash board แบบนี้ไม่ไหว ควรเป็น Card เล็ก ๆ ... มีจำนวนเคสเป็นตัวเลขบอก"). Reuses the exact
   `.ent-tile` stat-card grammar (small uppercase label + one bold number) already established by
   the entitlement dashboard, rather than inventing a new visual language. */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3);padding:12px var(--space-5);background:var(--color-gray-25);border-bottom:1px solid var(--color-border-subtle)}
.kpi-tile{border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);background:#fff;padding:var(--space-3) var(--space-4);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s}
.kpi-tile:hover{border-color:var(--color-primary-action)}
.kpi-tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--color-text-tertiary);font-weight:600;line-height:1.3}
.kpi-tile .v{font-family:var(--font-family-mono);font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);margin-top:4px;color:var(--color-text-secondary)}
.kpi-tile.has-count{border-color:var(--color-status-critical)}
.kpi-tile.has-count .v{color:var(--color-status-critical)}
@media (max-width:900px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}
.wl-subtabs{display:flex;gap:2px;padding:0 var(--space-5);border-bottom:1px solid var(--color-border-subtle);background:var(--color-gray-25);flex-wrap:wrap}
.wl-subtab{padding:11px 16px;font-size:var(--font-size-xs);font-weight:700;color:var(--color-text-secondary);border:0;background:transparent;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.wl-subtab.is-active{color:var(--color-primary-action);border-bottom-color:var(--color-primary-action);background:#fff}
.wl-subtab .count{background:var(--color-gray-200);color:var(--color-text-secondary);border-radius:var(--radius-full);padding:1px 7px;font-size:10px;font-weight:700}
.wl-subtab.is-active .count{background:var(--color-blue-600);color:#fff}
.consent-block{display:flex;gap:var(--space-4);flex-wrap:wrap}
.followup-plan-card{border:1px solid var(--color-orange-100);background:var(--color-orange-50);border-radius:var(--radius-md);padding:10px 12px;font-size:var(--font-size-xs)}
.followup-plan-card b{color:var(--color-orange-600)}

/* ---------- Appointment / Follow-up / Signature — added 2026-09-04 per stakeholder feedback ---------- */
/* Round 7: the visit Timeline is now a single-track HORIZONTAL stepper that scrolls
   horizontally when it overflows (stakeholder: "Time line เลื่อนมาเป็นแนวนอน") — it no
   longer wraps onto two rows (the 1–6 / 7–8 wrap they objected to). nowrap + fixed-width
   steps + overflow-x:visible keeps all 8 stages on one horizontal line. See DESIGN_NOTES.md §27. */
.stage-stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:0;row-gap:18px;width:100%;margin-top:14px;padding-bottom:6px;overflow:visible}
.stage-step{min-width:0;text-align:center;position:relative;padding:0 2px}
.stage-step:not(:last-child)::after{content:"";position:absolute;top:14px;left:58%;right:-42%;height:2px;background:var(--color-border-strong);z-index:0}.stage-step:nth-child(4)::after{display:none}.stage-step:nth-child(5)::before{content:"";position:absolute;top:-12px;left:50%;height:10px;border-left:2px dashed var(--color-border-strong)}
/* clickable patient name (Round 7): the Timeline opens by clicking the patient name in a
   Worklist 2 row — the name must read as a clear affordance. */
.pname-link{color:var(--color-primary-action);font-weight:var(--font-weight-semibold);cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--color-blue-200);text-underline-offset:2px}
.pname-link:hover{text-decoration-color:var(--color-primary-action)}
.stage-step.is-done:not(:last-child)::after{background:var(--color-status-normal)}
.stage-dot{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--color-border-strong);display:grid;place-items:center;margin:0 auto;font-size:11px;font-weight:700;color:var(--color-text-tertiary);position:relative;z-index:1}
.stage-step.is-done .stage-dot{border-color:var(--color-status-normal);color:var(--color-status-normal);background:var(--color-status-normal-bg)}
.stage-step.is-current .stage-dot{border-color:var(--color-primary-action);color:var(--color-primary-action);box-shadow:0 0 0 3px var(--color-blue-100)}
.stage-label{font-size:10px;color:var(--color-text-secondary);margin-top:6px;line-height:1.3}
.sig-wrap{border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);background:#fff;display:inline-block;padding:2px}
.sig-canvas{display:block;border-radius:6px;cursor:crosshair;touch-action:none;background:#fff}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.cmp-head{font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);margin-bottom:6px}
.prior-card--col{flex-direction:column;align-items:stretch;gap:8px}
.modal--wide{width:760px}
@media (max-width:640px){.cmp-grid{grid-template-columns:1fr}}

@media print{
  .command-rail,.topbar,.attention-strip,.cmdbar,.ctx-actions,.gtabs,.no-print{display:none!important}
  .work-surface{border:0;box-shadow:none}
  body{background:#fff}
}

function ic(name,size){ size=size||16; return '<svg class="icon" data-icon="'+name+'" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>'; }
function hydrateIcons(root){
  (root||document).querySelectorAll('[data-icon]').forEach(function(el){
    if(el.tagName.toLowerCase()==='svg') return;
    var name=el.getAttribute('data-icon');
    el.innerHTML = ic(name, el.getAttribute('data-size')||16);
    el.classList.add('icon-slot');
  });
}

function fitAppointmentTimeline(){
  const roots=[].slice.call(document.querySelectorAll('*')).filter(function(el){
    return el.children.length && (el.textContent||'').trim().indexOf('ความคืบหน้าการมาใช้บริการ (8 ขั้นตอน)')===0;
  });
  if(!roots.length) return;
  const title=roots[0];
  let box=title.parentElement;
  if(!box) return;
  const scroll=box.querySelector('[style*="overflow"], .timeline-scroll, .timeline');
  if(scroll){
    scroll.style.overflowX='visible';
    scroll.style.width='100%';
    scroll.style.maxWidth='100%';
  }
  box.querySelectorAll('*').forEach(function(el){
    if(getComputedStyle(el).minWidth && parseInt(getComputedStyle(el).minWidth)>900) el.style.minWidth='0';
  });
}

function fmtDate(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }

/* NOW_FOR_DEMO = the fixed "today" this prototype simulates (matches DEFAULT_APPT_DATE and the

const NOW_FOR_DEMO = new Date('2026-09-04T09:00:00');
function daysElapsed(createdAt){ return Math.max(0, Math.floor((NOW_FOR_DEMO - new Date(createdAt)) / 86400000)); }
/* WORKING ASSUMPTION (aging threshold): the hospital evidence states the full cycle can span

   worker real lead time before the case becomes genuinely overdue. Must be confirmed with the
   hospital before being treated as a real SLA. */
function agingClass(days){ return days>30?'age-crit':(days>=15?'age-warn':'age-ok'); }
function agingChip(createdAt){ const d=daysElapsed(createdAt); return '<span class="age-chip '+agingClass(d)+'">ใช้ไปแล้ว '+d+' วัน</span>'; }

function seedAssessment(econ){

    codes:{icdz:'Z59.6 ปัญหาเศรษฐกิจ',problem:['ปัญหาเศรษฐกิจของครอบครัว'],risk:'ปานกลาง',service:'SW-102 ประเมินและวางแผนสงเคราะห์ค่ารักษา'},
    savedAt:iso(2026,6,12,14,0)};

/* amount (5th, optional arg, added round 5) — the REAL billed baht for this one visit, independent
   of the record's per-quantity approved unit price. Omitted (undefined) for every pre-round-5
   redemption, which is intentional: totalRedeemedAmount()/redeemedAmountFor() below fall back to
   the record's current unit price for any redemption with no explicit `amount`, so old seed data's
   cumulative amount is unchanged. Only supplied here where a redemption's real billed cost genuinely
   diverged from the originally-approved unit price (see CS-2016 — DESIGN_NOTES.md §25). */
function mkRedeem(no,date,retained,econ,amount){
  const s=computeScoreFrom(econ);
  const rd={visitNo:no,date:date,retained:retained,income:econ.income,expense:econ.expense,debt:econ.debt,fra:econ.fra,
    net:s.net,copay:s.copay,total:s.total,group:s.group,savedBy:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'};
  if(amount!=null) rd.amount=amount;
  return rd;
}
function hist(rows){ return rows.map(function(r){ return {type:r[0],label:r[1],ts:r[2],actor:r[3]}; }); }

/* ---------- scoring engine (WORKING ASSUMPTION — prototype formula, see Design Notes / CR-01) ---------- */
function computeScoreFrom(e){
  const income=Number(e.income||0), expense=Number(e.expense||0), debt=Number(e.debt||0), fra=Number(e.fra||0);
  const net = income-(expense+debt);
  let copay;
  if(net<=3000) copay=40; else if(net<=7000) copay=30; else if(net<=12000) copay=20; else if(net<=20000) copay=10; else copay=0;
  const total = copay+fra;
  let group='green'; if(total>=70) group='red'; else if(total>=50) group='orange'; else if(total>=30) group='yellow';
  return {net:net,copay:copay,total:total,group:group};
}
function groupLabel(g){ return {red:'กลุ่มแดง — ต้องการสงเคราะห์สูงสุด',orange:'กลุ่มส้ม — ต้องการสงเคราะห์สูง',yellow:'กลุ่มเหลือง — ต้องการสงเคราะห์ปานกลาง',green:'กลุ่มเขียว — ต้องการสงเคราะห์น้อย'}[g]; }

function getPatient(hn){ return DB.patients.find(function(p){return p.hn===hn;}); }
function getCase(hn){ return DB.cases[hn]; }
function ensureCase(hn){
  if(!DB.cases[hn]){ DB.cases[hn]={caseNo:'SW-'+String(1000+(++DB.seq.CASE)).slice(-4),status:'Open',opened:new Date().toISOString()}; }
  else if(DB.cases[hn].status==='Off'){ DB.cases[hn].status='Active'; }
  return DB.cases[hn];
}
function patientCaseSummary(hn){
  const c=getCase(hn);
  const nConsult=DB.consults.filter(function(x){return x.hn===hn;}).length;
  return {isOld:!!c,caseNo:c?c.caseNo:null,opened:c?c.opened:null,nConsult:nConsult};
}
/* Round 5 — "หน้า New Consult มีสัญลักษณ์บอก ถ้าเคยมี Consult แล้ว กดเข้าไปดูได้ว่ามีกี่ Consult
   บอกรายละเอียด วันที่ รายการ Consult เงิน Status". Real HN lookup against DB.consults (reusing
   patientCaseSummary's nConsult, already computed the same way), not a decorative badge — the
   opened list is the same live records, sorted newest-first. See DESIGN_NOTES.md §25. */
function openPriorConsultHistory(hn){
  const p=getPatient(hn);
  const list = DB.consults.filter(function(c){return c.hn===hn;}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  const rows = list.map(function(c){
    const desc = (c.hasFinancialProblem && c.items.length) ? c.items.map(function(it){return it.name+' ×'+it.qty;}).join(', ') : (c.reason||'—');
    const amount = (c.hasFinancialProblem && c.items.length) ? '฿'+fmtMoney(c.items.reduce(function(s,it){return s+it.qty*it.priceFull;},0)) : '—';
    return '<tr><td class="cid">'+c.id+'</td><td>'+fmtDate(c.createdAt)+'</td><td class="reason" title="'+desc.replace(/"/g,'')+'">'+desc+'</td><td class="money">'+amount+'</td><td>'+statusBadgeFor(c)+'</td></tr>';
  }).join('');
  const html='<div class="modal-head"><h3>ประวัติ Consult เดิม — '+p.name+' (HN '+p.hn+')</h3><button class="iconbtn" onclick="closeModal()" data-fa="fa-solid fa-xmark"><span class="icon" data-icon="xmark"></span></button></div>'+
    '<div class="modal-body"><div style="overflow-x:visible"><table class="wl"><thead><tr><th>เลขที่</th><th>วันที่</th><th>รายการ/เหตุผล</th><th>มูลค่า (บาท)</th><th>สถานะ</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="5"><div class="emptywrap">ไม่มีประวัติ Consult</div></td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="modal-foot"><button class="btn btn--secondary" onclick="closeModal()">ปิด</button></div>';
  openModal(html,true);
}

function renderRail(){
  const rail=document.getElementById('commandRail');
  const items=railItems();
  rail.innerHTML = items.map(function(it){
    const active = STATE.view===it.key || (it.key==='sw-worklist' && STATE.view==='sw-consult');
    return '<button class="rail-item'+(active?' is-active':'')+'" onclick="goto(\''+it.key+'\')" aria-label="'+it.label+'" title="'+it.label+'" data-fa="fa-solid fa-'+it.icon+'">'+
      '<span data-icon="'+it.icon+'"></span>'+(it.count?'<span class="rail-count">'+it.count+'</span>':'')+
      '<span class="rail-label">'+it.label+'</span></button>';
  }).join('');
  rail.scrollTop=0; rail.scrollLeft=0;

}
function goto(key){ STATE.view=key; STATE.activeId=null; render(); }

function tick(){ document.getElementById('clockLabel').textContent = 'วันนี้ '+ new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}); }

function render(){
  document.getElementById('roleSelect').value = STATE.role;
  renderRail();
  const ws=document.getElementById('workSurface');
  ws.innerHTML = renderView();
  hydrateIcons(ws);
  wireDynamic();
  if(window.__v48AssessmentApply) setTimeout(window.__v48AssessmentApply,0);
}
function wireDynamic(){
  document.querySelectorAll('[data-toggle-section]').forEach(function(h){
    h.onclick=function(){ h.closest('.section').classList.toggle('is-collapsed'); };
  });
  /* Signature pads embedded directly in the main content flow (e.g. the Consent block in
     viewConsultItem) aren't inside a modal/drawer openXxx() call that explicitly wires them —
     initSigPad() is idempotent (guards on canvas.__wired) so re-running it on every render is safe. */
  document.querySelectorAll('.sig-canvas').forEach(function(c){ initSigPad(c.id); });
  /* v75: minimal-paper auto-expanding textareas on the Request Consult form — grow to fit content
     (no fixed box / no scrollbar), like writing on paper. Idempotent per element. */
  document.querySelectorAll('.consult-v3 textarea').forEach(function(t){
    var grow=function(){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; };
    if(!t.__autogrow){ t.addEventListener('input',grow); t.__autogrow=true; }
    grow();
  });
}
tick(); setInterval(tick,60000);
</script>

  if(!(formConsult.reason||'').trim()){ e.reason='กรุณาระบุเหตุผล/รายละเอียดการส่งปรึกษา'; miss.push('เหตุผลการส่งปรึกษา (§3)'); }

  }

    var it0=(formConsult.items||[])[0]||{};

  }

function submitConsult(){

  }

     must pass the หน่วยตรวจสอบสิทธิ (Payor / eligibility-check) unit FIRST so สิทธิ is verified
     before Social Work assesses it. Assessment-only (โครงการ) and non-financial (สังคม/อื่น ๆ)
     referrals do NOT need eligibility verification and go straight to Social Work's Case New.
     A referral that is BOTH โครงการ and การเงิน still routes to Payor (the cost component wins). */
  var requiresBenefit = !!formConsult.hasFinancialProblem;
  var now=new Date().toISOString();
  var createLabel = requiresBenefit
    ? 'ส่ง Consult → หน่วยตรวจสอบสิทธิ (Payor) เพื่อตรวจสอบสิทธิก่อนส่ง Social Work'
    : 'ส่ง Consult → Social Work (Case New) โดยตรง — ไม่ต้องตรวจสอบสิทธิ (เคสประเมิน/สังคม)';
  DB.consults.unshift({
    id:id,hn:formConsult.hn,doctor:DOCTORS[STATE.doctorId].name,doctorLevel:DOCTORS[STATE.doctorId].level,senderPhone:formConsult.senderPhone,ward:formConsult.ward||'ไม่ระบุ',an:formConsult.an,
    diagnosis:formConsult.diagnosis,procedureDate:formConsult.procedureDate?new Date(formConsult.procedureDate).toISOString():null,lengthOfStay:formConsult.lengthOfStay,
    treatmentPlan:formConsult.treatmentPlan,indication:formConsult.indication,reason:(formConsult.reason||''),patientContribution:formConsult.patientContribution,hasAttachment:formConsult.hasAttachment,attachmentDetail:formConsult.attachmentDetail,
    consultType:formConsult.consultType,
    hasProgram:formConsult.hasProgram,programName:formConsult.programName,
    hasFinancialProblem:formConsult.hasFinancialProblem,financialItems:formConsult.financialItems.slice(),financialDetails:JSON.parse(JSON.stringify(formConsult.financialDetails||{})),
    hasSocialProblem:formConsult.hasSocialProblem,socialItems:formConsult.socialItems.slice(),socialDetails:JSON.parse(JSON.stringify(formConsult.socialDetails||{})),
    hasOther:formConsult.hasOther,otherText:formConsult.otherText,
    items:items,status:(requiresBenefit?'PendingBenefitReview':'Submitted'),createdAt:now,
    consent:null,assessment:null,notifiedPatientAt:null,receivedServiceAt:null,
    redemptions:[],homeVisits:[],needsFollowUp:false,
    benefitReview:(requiresBenefit
      ? {status:'Pending',required:true,unit:'หน่วยตรวจสอบสิทธิ (Payor)',reviewedAt:null,reviewer:null,note:''}
      : {status:'NotRequired',required:false,unit:null,reviewedAt:null,reviewer:null,note:'เคสประเมิน/สังคม — ไม่ต้องตรวจสอบสิทธิ'}),
    history:hist([['create',createLabel,now,DOCTORS[STATE.doctorId].name]])
  });
  resetFormConsult();
  if(requiresBenefit){
    toast('success','ส่ง Consult สำเร็จ · '+id+' · ส่งหน่วยตรวจสอบสิทธิ (Payor) ก่อน');
    STATE.role='benefit'; STATE.view='benefit-inbox';
  } else {
    toast('success','ส่ง Consult สำเร็จ · '+id+' · เข้า Case New (Social Work) โดยตรง');
    STATE.role='sw'; STATE.view='sw-worklist'; STATE.wlTab='new';
  }
  STATE.activeId=null;
  render();
}

<script>
/* ==========================================================================

const WL_GROUPS=[

/* classifyConsult(c) — priority-ordered single-assignment classification, unified across both
   the financial-approval path and the assessment-only path. Design decisions (not stakeholder-
   specified, flagged per the round-3 precedent of documenting tie-break rules):

       Completed is folded into the 'new' fallback bucket rather than getting its own group,
       since it is a small, transient in-between state — see DESIGN_NOTES.md §24 WORKING
       ASSUMPTION on this. */
function classifyConsult(c){
  if(c.status==='ConsentDeclined') return 'closed';
  if(c.status==='Rejected') return 'rejected';

}

  } else { statusCell='<td>'+statusBadgeFor(c)+'</td>'; }
  let action;

  else if(c.status==='Verified') action='<button class="btn btn--primary btn--sm" onclick="openConsultItem(\''+c.id+'\')">'+(c.hasFinancialProblem?'Review / เตรียมส่งอนุมัติ':(c.notifiedPatientAt?'ยืนยันเข้ารับบริการแล้ว':'แจ้งคนไข้เข้ารับบริการ'))+'</button>';

  return '<tr class="'+rowClass+'">'+

/* Round 6: the Financial/Program/Social type-filter chip row was removed from all 3

/* ==========================================================================

/* Tile 1 — "รอ Approve > 10 วัน". Age is measured from the 'submit' history

function currentMinus(days,h,m){
  const d=new Date(); d.setDate(d.getDate()-days); d.setHours(h||9,m||0,0,0); return d.toISOString();
}
function reqDateLabel(iso){
  const d=new Date(iso), n=new Date(), d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()), x0=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((d0-x0)/86400000);
  const day=diff===0?'วันนี้':(diff===1?'เมื่อวาน':diff+' วันก่อน');
  return day+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function elapsedShort(iso){
  const mins=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  if(mins<60) return mins+' นาที';
  const h=Math.floor(mins/60), m=mins%60;
  return h+' ชม.'+(m?' '+m+' นาที':'');
}
function elapsedClass(iso){
  const mins=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  return mins>=480?'hot':(mins>=120?'warn':'');
}

/* Worklist V4 — stakeholder-confirmed focus model */

function normalizeV5MockData(){
  const assignedTimes=[[0,8,12],[0,8,47],[0,9,18],[0,10,6],[0,11,24]];
  ASSIGNED_TODAY_IDS.forEach(function(id,i){
    const c=DB.consults.find(function(x){return x.id===id;});
    if(c){
      c.createdAt=currentMinus.apply(null,assignedTimes[i]);
      c.status='InProgress';
      c.accepted=true;
      c.assignedTo='SW-001';
      c.assessment=null;
    }
  });
  const newIds=['CS-1002','CS-1003','CS-2005','CS-2018'];
  const offsets=[[0,13,55],[0,12,38],[0,11,12],[0,9,44]];
  newIds.forEach(function(id,i){
    const c=DB.consults.find(function(x){return x.id===id;});
    if(c){
      c.createdAt=currentMinus.apply(null,offsets[i]);
      c.status='Submitted';
      c.accepted=false;
      c.assignedTo=null;
      c.assessment=null;
    }
  });
}

function submittedAgeDays(c){
  const ev = c.history && c.history.slice().reverse().find(function(h){return h.type==='submit';});
  return daysElapsed(ev ? ev.ts : c.createdAt);
}
function isStaleApproval(c){ return c.hasFinancialProblem && c.status==='PendingApproval' && submittedAgeDays(c)>10; }
/* Tile 2 — "Consult ใหม่ > 2 วัน ยังไม่ Assessment": still at New/รับ Consult
   (i.e. assessment not yet saved), aged past 2 days since creation. */
function isStaleNew(c){ return (c.status==='Submitted'||c.status==='InProgress') && !c.assessment && daysElapsed(c.createdAt)>2; }
/* Tile 3 — "ไม่มาตามนัด ไม่แจ้งเลื่อน": a Worklist-2 appointment whose scheduled
   date has passed with no check-in AND no reschedule flag set. The data model
   did not previously distinguish "rescheduled" from "just hasn't happened yet"
   — a real `rescheduled` boolean (+ `rescheduledAt`/`rescheduledTo`) was added
   to the appointment schema so this count is real, not a guess; a genuinely
   rescheduled appointment must NOT be counted (see AP-4007 vs AP-4006 seed
   data, and `openRescheduleDrawer`/`confirmReschedule` below, which is the
   real, live mechanism that sets the flag). */
function isNoShowNotRescheduled(a){
  const todayStr = NOW_FOR_DEMO.toISOString().slice(0,10);
  return a.status==='Scheduled' && !a.rescheduled && a.scheduledDate < todayStr;
}
/* Tile 4 — "ค่าใช้จ่ายเกินวงเงินอนุมัติ": an AMOUNT check, deliberately independent
   of the existing qty-based usedQty/approvedQty check (which the quota-redemption
   mechanic already hard-blocks from ever exceeding). A real per-visit billed
   `amount` (which can legitimately differ from the unit price locked in at
   approval time — e.g. a price increase mid-treatment) was added to the
   redemption schema (`mkRedeem`'s 5th arg) precisely so this can be true
   without touching/faking the quota math. `redeemedAmountFor`/`approvedAmountFor`
   fall back to the record's current unit price for any redemption/record that
   predates this field, so every pre-round-5 seed record's cumulative amount is
   unchanged (never a false positive from old data). */
function redeemedAmountFor(rd, c){ return rd.amount!=null ? rd.amount : (c.items && c.items[0] ? c.items[0].priceFull : 0); }
function totalRedeemedAmount(c){ return (c.redemptions||[]).reduce(function(s,rd){ return s+redeemedAmountFor(rd,c); },0); }
function approvedAmountFor(c){ return c.approvedAmount!=null ? c.approvedAmount : ((c.approvedQty||0) * (c.items && c.items[0] ? c.items[0].priceFull : 0)); }
function isAmountOverrun(c){ return c.hasFinancialProblem && (c.approvedQty||c.approvedAmount) && totalRedeemedAmount(c) > approvedAmountFor(c); }

}

<script>
/* ---------------- ASSESSMENT BUILDING BLOCKS (SMDA + FRA + coding) ---------------- */
const FRA_CRITERIA=[['ผู้ดูแลหลักของผู้ป่วย','ไม่มีผู้ดูแล/ดูแลไม่ต่อเนื่อง'],['สภาพที่อยู่อาศัย','ไม่เหมาะสม/ไม่มั่นคง'],['รายได้ประจำของครอบครัว','ไม่มีรายได้ประจำ'],['การสนับสนุนทางสังคม/เครือข่าย','ไม่มีเครือข่ายสนับสนุน']];
function ecoFormHtml(prefix,e){

    '<tr class="eco-total-row"><td>รายได้สุทธิ = รายได้รวม − (รายจ่ายรวม + หนี้สิน)</td><td class="money" id="'+prefix+'_netcell">฿'+fmtMoney(e.income-(e.expense+e.debt))+'</td></tr>'+
  '</tbody></table>';
}
function fraFormHtml(prefix,fraTotal){
  const per = Math.round((fraTotal||0)/FRA_CRITERIA.length);
  return '<div class="fra-grid">'+FRA_CRITERIA.map(function(c,i){
    const val = FRA_CRITERIA.map(function(){return 0;});
    return '<div class="crit">'+c[0]+'<div class="hint">'+c[1]+' = คะแนนสูง</div></div>'+
      '<div class="rate5" data-fra-row="'+i+'">'+[0,5,10,15].map(function(v){
        return '<button type="button" class="'+(v===clampFraDefault(i,per)?'is-active':'')+'" onclick="setFra(\''+prefix+'\','+i+','+v+',this)">'+v+'</button>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}
function clampFraDefault(i,avg){ const opts=[0,5,10,15]; let best=opts[0],diff=999; opts.forEach(function(o){ if(Math.abs(o-avg)<diff){diff=Math.abs(o-avg);best=o;} }); return best; }
const FRA_STATE={};
function setFra(prefix,row,val,btn){
  FRA_STATE[prefix]=FRA_STATE[prefix]||[0,0,0,0];
  FRA_STATE[prefix][row]=val;
  btn.parentElement.querySelectorAll('button').forEach(function(b){b.classList.remove('is-active');});
  btn.classList.add('is-active');

}
function currentFraTotal(prefix){ return (FRA_STATE[prefix]||[0,0,0,0]).reduce(function(a,b){return a+b;},0); }
function scoreInstrumentHtml(prefix,s){

function recalcScore(prefix){
  const income=+document.getElementById(prefix+'_income').value||0;

function codingHtml(prefix,codes){

  const serviceOptions=['SW-101 ให้คำปรึกษาแนะแนวทางสังคมสงเคราะห์','SW-102 ประเมินและวางแผนสงเคราะห์ค่ารักษา','SW-103 ประสานส่งต่อหน่วยงานภายนอก'];
  return '<div class="vstack">'+
    '<div class="field"><label>รหัส ICD-10 หมวด Z</label><select class="select" id="'+prefix+'_icdz">'+icdOptions.map(function(o){return '<option'+(o===codes.icdz?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>บัญชีปัญหาทางสังคม (Social Problem List)</label><div class="chipset">'+problemOptions.map(function(o){return '<button type="button" class="chip'+(codes.problem.indexOf(o)>-1?' is-selected':'')+'" data-prob="'+o+'" onclick="this.classList.toggle(\'is-selected\')">'+o+'</button>';}).join('')+'</div></div>'+
    '<div class="form-grid">'+
      '<div class="field"><label>ระดับความเสี่ยงทางสังคม</label><select class="select" id="'+prefix+'_risk">'+['ต่ำ','ปานกลาง','สูง'].map(function(o){return '<option'+(o===codes.risk?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>รหัสบริการสังคมสงเคราะห์</label><select class="select" id="'+prefix+'_service">'+serviceOptions.map(function(o){return '<option'+(o===codes.service?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'+
    '</div>'+
  '</div>';
}
function readCoding(prefix){
  const chips=[]; document.querySelectorAll('[data-prob].is-selected').forEach(function(c){chips.push(c.getAttribute('data-prob'));});
  return {icdz:document.getElementById(prefix+'_icdz').value, problem:chips, risk:document.getElementById(prefix+'_risk').value, service:document.getElementById(prefix+'_service').value};

 return '<div class="v41-referral">'+

/* ---- Consent (Yes/No) capture — HOSPITAL CONFIRMED branch from the Flow Chart ---- */
window.__consentChoice='yes';
function consentBlockHtml(c){
  return '<div class="section"><div class="section-head"><h3>ขั้นตอนแรก — บันทึกการยินยอมของผู้ป่วย (Consent)</h3><span class="sub">HOSPITAL CONFIRMED · Flow Chart การให้บริการสังคมสงเคราะห์</span></div>'+
    '<div class="section-body vstack">'+
      '<p class="muted" style="font-size:13px;margin:0">อธิบายบริการให้ผู้ป่วย/ญาติทราบ แล้วบันทึกผลการยินยอมก่อนดำเนินการต่อ — หากปฏิเสธ ระบบจะปิดงานทันทีและแจ้งผู้ส่งปรึกษาโดยอัตโนมัติ โดยไม่ดำเนินการประเมิน/ขออนุมัติต่อ</p>'+
      '<div class="consent-block">'+
        '<div class="choice-card is-selected" id="consentYesCard" onclick="selectConsentChoice(\'yes\')"><h4><span class="icon" data-icon="circle-check" data-size="15"></span>ยินยอม (Yes)</h4><p>ผู้ป่วย/ญาติยินยอมรับบริการ — ดำเนินการประเมิน SDMA/FRA ต่อ</p></div>'+
        '<div class="choice-card" id="consentNoCard" onclick="selectConsentChoice(\'no\')"><h4><span class="icon" data-icon="xmark" data-size="15"></span>ปฏิเสธ (No)</h4><p>ผู้ป่วย/ญาติไม่ยินยอม — ปิดงานและแจ้งผู้ส่งปรึกษาทันที (END)</p></div>'+

        '<div class="hstack" style="margin-top:6px"><button type="button" class="btn btn--quiet btn--sm" onclick="clearSigPad(\'sigPad_consent\')">ล้างลายเซ็น</button></div>'+

function selectConsentChoice(v){
  window.__consentChoice=v;

  document.getElementById('consentConfirmBtn').innerHTML = ic(v==='yes'?'pen':'xmark')+(v==='yes'?'บันทึกการยินยอม':'บันทึกการปฏิเสธและปิดงาน');

function confirmConsent(id){
  if(!hasSignature('sigPad_consent')){ toast('error','กรุณาให้ผู้ป่วย/ญาติลงนามก่อนบันทึก'); return; }
  const c = DB.consults.find(function(x){return x.id===id;});
  const name=document.getElementById('consentSignName').value||getPatient(c.hn).name;
  const nowIso=new Date().toISOString();
  const sig={dataUrl:captureSignature('sigPad_consent'),name:name,ts:nowIso};
  if(window.__consentChoice==='no'){
    c.consent={decision:'no',signature:sig,ts:nowIso,notifiedReferrerAt:nowIso};
    c.status='ConsentDeclined'; c.closedAt=nowIso; c.closedBy='สมหญิง มีใจ (นักสังคมสงเคราะห์)';

    c.history.push({type:'notify_referrer',label:'แจ้งผู้ส่งปรึกษา ('+c.doctor+') ว่าผู้ป่วยปฏิเสธการยินยอม — ปิดงาน',ts:nowIso,actor:'ระบบ'});
    toast('success','บันทึกการปฏิเสธแล้ว — แจ้งผู้ส่งปรึกษา ('+c.doctor+') โดยอัตโนมัติ และปิดงานทันที');
    goto('sw-worklist');
  } else {
    c.consent={decision:'yes',signature:sig,ts:nowIso};

    toast('success','บันทึกการยินยอมแล้ว — ดำเนินการประเมิน SDMA/FRA ต่อ');
    render();
  }
}
/* ---- Assessment form (SMDA + FRA + coding + note) -> saves and moves the record to Verified ---- */
/* Assessment workspace = an ORDERED 3-step sequence unlocked after รับเคส + Consent:
   3.1 FM-MSW-001 S.D.M.A. -> 3.2 FM-MSW-004 M.H.S.C.A. -> 3.3 FM-MSW-002 F.R.A.
   Each real app form saves live state on the record (c.sdma / c.mhsca / c.fra); a step is locked
   until the previous one is saved. Implemented in the ASSESSMENT SEQUENCE ENGINE block below. */
function assessmentFormHtml(c){ return assessmentSequenceHtml(c); }
function submitAssessment(id){
  const note=document.getElementById('asmNote').value.trim();
  if(!note){ toast('error','กรุณาสรุปผลการประเมินก่อนบันทึก'); document.getElementById('asmNote').classList.add('has-error'); return; }
  const income=+document.getElementById('asm_income').value||0, expense=+document.getElementById('asm_expense').value||0, debt=+document.getElementById('asm_debt').value||0;
  const fra=currentFraTotal('asm');
  const c = DB.consults.find(function(x){return x.id===id;});
  c.assessment={income:income,expense:expense,debt:debt,fra:fra,codes:readCoding('asm'),savedAt:new Date().toISOString()};
  c.swNote=note;
  c.status='Verified';
  c.history.push({type:'assess',label:'ประเมิน SMDA+FRA และให้คะแนนกลุ่มสี — Verified',ts:new Date().toISOString(),actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'});

}
/* ---- Verified summary — primary action branches on hasFinancialProblem, per the confirmed
   decision: financial path sends to executive approval; assessment-only path notifies the
   patient directly, then confirms receipt of service (no approval step exists for it). ---- */
function verifiedSummaryHtml(c){
  let actionBtn;
  if(c.hasFinancialProblem) return v43ApprovalPage(c);
  else if(!c.notifiedPatientAt) actionBtn='<button class="btn btn--primary" onclick="notifyPatient(\''+c.id+'\')" data-fa="fa-solid fa-bell"><span class="icon" data-icon="bell"></span>แจ้งคนไข้เข้ารับบริการ</button>';
  else actionBtn='<button class="btn btn--primary" onclick="confirmReceivedService(\''+c.id+'\')" data-fa="fa-solid fa-circle-check"><span class="icon" data-icon="circle-check"></span>ยืนยันเข้ารับบริการแล้ว</button>';
  return assessmentSummaryCard(c.assessment)+
    (c.swNote?'<div class="instrument" style="margin-top:12px"><b>สรุปผลประเมิน</b><p style="margin-top:6px">'+c.swNote+'</p></div>':'')+
    (c.notifiedPatientAt?'<div class="banner banner--info" style="margin-top:12px"><span class="icon" data-icon="circle-info"></span><div><strong>แจ้งคนไข้เข้ารับบริการแล้ว</strong><p>เมื่อ '+fmtDateTime(c.notifiedPatientAt)+'</p></div></div>':'')+
    '<div class="hstack" style="justify-content:flex-end;margin-top:16px">'+actionBtn+'</div>'+

}
function sendForApproval(id){
  const c=DB.consults.find(function(x){return x.id===id;});
  c.status='PendingApproval'; c.approvalStage='manager';
  c.history.push({type:'submit',label:'ส่งสรุปคำขอให้หัวหน้า/Manager พิจารณาอนุมัติ',ts:new Date().toISOString(),actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'});

}
/* notifyPatient() is shared by BOTH paths — the Verified/non-financial screen above, and the
   Approved/financial entitlementDashboard's notify gate below. It only sets a timestamp + logs
   history; it never changes `status` (unlike sendForApproval/confirmReceivedService), which is
   what lets it be reused as a mid-status real gate rather than a terminal transition. */
function notifyPatient(id){
  const c=DB.consults.find(function(x){return x.id===id;});
  c.notifiedPatientAt=new Date().toISOString();
  c.history.push({type:'notify',label:'แจ้งคนไข้เข้ารับบริการ',ts:c.notifiedPatientAt,actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'});
  toast('success','แจ้งคนไข้เข้ารับบริการแล้ว · '+id);
  render();
}
function confirmReceivedService(id){
  const c=DB.consults.find(function(x){return x.id===id;});
  c.status='Completed'; c.receivedServiceAt=new Date().toISOString();
  c.closedAt=c.receivedServiceAt; c.closedBy='สมหญิง มีใจ (นักสังคมสงเคราะห์)';
  c.history.push({type:'complete',label:'ยืนยันเข้ารับบริการแล้ว — ปิดงาน',ts:c.receivedServiceAt,actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'});
