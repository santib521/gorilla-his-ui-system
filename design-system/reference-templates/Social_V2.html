  goto('sw-worklist');
}
function acceptConsultCase(id){
  const c=DB.consults.find(function(x){return x.id===id;}); c.status='InProgress'; c.acceptedAt=new Date().toISOString(); c.assignedTo='สมหญิง มีใจ';
  c.history.push({type:'accept',label:'นักสังคมสงเคราะห์รับเคส',ts:c.acceptedAt,actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'}); toast('success','รับเคสแล้ว · ย้ายไป Case Assign วันนี้'); render();
}
function viewConsultItem(){
  const c = DB.consults.find(function(x){return x.id===STATE.activeId;});
  let body, title;
  if(c.status==='Submitted'){
    title='Consult ใหม่ — ตรวจสอบข้อมูลก่อนรับเคส';
    body='<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>ข้อมูลจากผู้ส่ง Consult เป็น Read-only</strong><p>ตรวจสอบข้อมูลทั้งหมดก่อนรับเคส เมื่อกดรับ รายการจะย้ายจาก New Consult ไป Case Assign วันนี้</p></div></div><div class="hstack" style="justify-content:flex-end;margin-top:12px"><button class="btn btn--primary" onclick="acceptConsultCase(\''+c.id+'\')">รับเคส</button></div>';
  } else if(c.status==='ConsentDeclined'){
    title='ผู้ป่วยปฏิเสธการยินยอม';
    body='<div class="banner banner--critical"><span class="icon" data-icon="circle-exclamation"></span><div><strong>ผู้ป่วย/ญาติไม่ยินยอมรับบริการ</strong><p>บันทึกเมื่อ '+fmtDateTime(c.consent.ts)+' โดย '+c.consent.signature.name+' — ระบบแจ้งผู้ส่งปรึกษา ('+c.doctor+') แล้วเมื่อ '+fmtDateTime(c.consent.notifiedReferrerAt)+' และปิดงานโดยไม่ดำเนินการต่อ (Flow Chart การให้บริการสังคมสงเคราะห์ — HOSPITAL CONFIRMED)</p></div></div>'+
      (c.consent.signature.dataUrl?'<img src="'+c.consent.signature.dataUrl+'" alt="ลายเซ็นปฏิเสธ" style="border:1px solid var(--color-border-subtle);border-radius:8px;margin-top:12px;max-width:220px;background:#fff;display:block">':'')+
      historyTimeline(c);
  } else if(c.status==='InProgress'){
    title='ดำเนินการประเมินทางสังคม';
    body=assessmentFormHtml(c);
  } else if(c.status==='Verified'){
    title='ผลประเมิน (Verified)';
    body=verifiedSummaryHtml(c);
  } else if(c.status==='PendingApproval'){
    title=(c.approvalStage==='director'?'รอ ผอ. Approve':'รอหัวหน้า/Manager Approve');
    body = v43ApprovalPage(c);
  } else if(c.status==='Rejected'){
    title='คำขอถูกปฏิเสธ';
    body = '<div class="banner banner--critical"><span class="icon" data-icon="circle-exclamation"></span><div><strong>คำขอถูกปฏิเสธ</strong><p>'+c.approval.reason+' · โดย '+c.approval.approver+' เมื่อ '+fmtDateTime(c.approval.rejectedAt)+'</p></div></div>'+
      assessmentSummaryCard(c.assessment)+ historyTimeline(c);
  } else if(c.status==='Approved' || c.status==='Off'){
    title = c.status==='Approved'?'สิทธิที่ใช้อยู่':'ประวัติสิทธิ (Off)';
    body = entitlementDashboard(c);
  } else { // Completed
    title='เข้ารับบริการแล้ว';
    body = (c.swNote?'<div class="instrument"><b>สรุปผลประเมิน</b><p style="margin-top:6px">'+c.swNote+'</p></div>':'')+historyTimeline(c);
  }
  return '<div class="page-context"><div><div class="breadcrumb">จัดการ Consult / '+c.id+'</div><h1 class="page-title">'+title+'</h1></div>'+
    '<div class="context-right"><button class="btn btn--quiet" onclick="goto(\'sw-worklist\')" data-fa="fa-solid fa-chevron-left"><span class="icon" data-icon="chevron-left"></span>กลับไปรายการงาน</button></div></div>'+
    patientBanner(c.hn)+
    referralInfoHtml(c)+
    '<div class="content">'+body+'</div>';
}
function assessmentSummaryCard(a){
  const s=computeScoreFrom(a);
  return '<div class="section"><div class="section-head"><h3>ผลประเมินที่ส่งไป</h3><span class="sub">บันทึกเมื่อ '+fmtDateTime(a.savedAt)+'</span></div><div class="section-body">'+scoreInstrumentHtml('sum',s)+
    '<div class="prior-card" style="margin-top:12px"><div class="kv"><span class="k">รายได้รวม</span><span class="v">฿'+fmtMoney(a.income)+'</span></div><div class="kv"><span class="k">รายจ่าย+หนี้สิน</span><span class="v">฿'+fmtMoney(a.expense+a.debt)+'</span></div><div class="kv"><span class="k">รหัส ICD-10 Z</span><span class="v" style="font-family:inherit;font-weight:600">'+ (a.codes?a.codes.icdz:'—') +'</span></div></div>'+
  '</div></div>';
}
function historyTimeline(r){
  return '<div class="section"><div class="section-head"><h3>ประวัติ / Timeline</h3></div><div class="section-body"><div class="appt-progress-fit">'+
    r.history.map(function(h){return '<div class="tl-item"><div class="tl-head">'+h.label+'</div><div class="tl-time">'+fmtDateTime(h.ts)+' · '+h.actor+'</div></div>';}).join('')+
  '</div></div></div>';
}
</script>

<script>
/* ---------------- SW: Entitlement / Redemption dashboard (the core quota mechanic) ---------------- */
function entitlementDashboard(r){
  const used=r.usedQty||0, remain=r.approvedQty-used, isOff=r.status==='Off';
  const pct=Math.round(used/r.approvedQty*100);
  const unitPrice=r.items[0].priceFull;
  const valueUsed=used*unitPrice, valueTotal=r.approvedQty*unitPrice, valueRemain=valueTotal-valueUsed;
  const events = timelineEvents(r);
  /* Round 5 — real AMOUNT-based overrun check, independent of the qty-based used/approved bar
     above (which the redemption-blocking mechanic already hard-caps). See isAmountOverrun() /
     DESIGN_NOTES.md §25 for why a real per-visit `amount` can legitimately diverge from unitPrice. */
  const totalAmt = totalRedeemedAmount(r), approvedAmt = approvedAmountFor(r), overAmt = totalAmt-approvedAmt;
  return assessmentSummaryCard(r.assessment)+
    (overAmt>0?'<div class="banner banner--critical"><span class="icon" data-icon="triangle-exclamation"></span><div><strong>ยอดค่าใช้จ่ายจริงเกินวงเงินที่อนุมัติ</strong><p>ใช้จ่ายจริงสะสม ฿'+fmtMoney(totalAmt)+' จากวงเงินที่อนุมัติ ฿'+fmtMoney(approvedAmt)+' — เกิน ฿'+fmtMoney(overAmt)+'</p></div></div>':'')+
    '<div class="section"><div class="section-head"><h3>สรุปสิทธิสงเคราะห์ที่อนุมัติ</h3><span class="sub">อนุมัติโดย '+r.approval.approver+' เมื่อ '+fmtDateTime(r.approval.approvedAt)+'</span></div>'+
    '<div class="section-body">'+
      '<div class="ent-summary">'+
        '<div class="ent-tile"><div class="k">อนุมัติทั้งหมด</div><div class="v mono">'+r.approvedQty+' <small>ครั้ง</small></div></div>'+
        '<div class="ent-tile"><div class="k">ใช้ไปแล้ว</div><div class="v mono">'+used+' <small>ครั้ง · ฿'+fmtMoney(valueUsed)+'</small></div></div>'+
        '<div class="ent-tile"><div class="k">คงเหลือ</div><div class="v mono" style="color:'+(remain===0?'var(--color-status-inactive)':'var(--color-primary-action)')+'">'+remain+' <small>ครั้ง · ฿'+fmtMoney(valueRemain)+'</small></div></div>'+
        '<div class="ent-tile"><div class="k">สถานะ</div><div class="v" style="font-size:15px">'+statusBadgeFor(r)+'</div></div>'+
      '</div>'+
      '<div class="ent-summary" style="margin-top:'+(overAmt>0?'8px':'0')+';grid-template-columns:1fr 1fr">'+
        '<div class="ent-tile'+(overAmt>0?' has-count':'')+'"><div class="k">ค่าใช้จ่ายจริงสะสม</div><div class="v mono"'+(overAmt>0?' style="color:var(--color-status-critical)"':'')+'>฿'+fmtMoney(totalAmt)+'</div></div>'+
        '<div class="ent-tile"><div class="k">วงเงินที่อนุมัติ</div><div class="v mono">฿'+fmtMoney(approvedAmt)+'</div></div>'+
      '</div>'+
      '<div class="big-qbar"><span style="width:'+pct+'%;background:'+(isOff?'var(--color-status-inactive)':'')+'"></span></div>'+
      (isOff?'<div class="banner banner--locked" style="margin-top:14px"><span class="icon" data-icon="lock"></span><div><strong>ใช้สิทธิ์ครบตามจำนวนที่อนุมัติแล้ว</strong><p>เคสนี้ปิดสถานะเป็น Off โดยอัตโนมัติเมื่อ '+fmtDateTime(r.history[r.history.length-1].ts)+' — ยังคงแสดงในรายการงานเพื่อดูประวัติ แต่ไม่สามารถใช้สิทธิเพิ่มได้</p></div></div>'
        : (!r.notifiedPatientAt
            ? '<div class="banner banner--warning" style="margin-top:14px"><span class="icon" data-icon="triangle-exclamation"></span><div><strong>ยังไม่ได้แจ้งคนไข้เข้ารับบริการ</strong><p>ต้องแจ้งคนไข้ก่อนจึงจะนัดใช้สิทธิ/บันทึกเยี่ยมบ้านได้ (Flow Chart การให้บริการสังคมสงเคราะห์ — HOSPITAL CONFIRMED)</p></div></div>'+
              '<div class="hstack" style="margin-top:12px"><button class="btn btn--primary" onclick="notifyPatient(\''+r.id+'\')" data-fa="fa-solid fa-bell"><span class="icon" data-icon="bell"></span>แจ้งคนไข้เข้ารับบริการ</button></div>'
            : '<div class="hstack" style="margin-top:16px"><button class="btn btn--primary" onclick="openRedeemDrawer(\''+r.id+'\')" data-fa="fa-solid fa-calendar-check"><span class="icon" data-icon="calendar-check"></span>ยืนยันใช้สิทธิครั้งที่ '+(used+1)+'</button>'+
              '<button class="btn btn--secondary" onclick="openHomeVisitDrawer(\''+r.id+'\')" data-fa="fa-solid fa-location-dot"><span class="icon" data-icon="location-dot"></span>บันทึกเยี่ยมบ้าน</button></div>'))+
      (isOff?'<div class="hstack" style="margin-top:12px"><button class="btn btn--secondary btn--sm" onclick="attemptRedeemBlocked(\''+r.id+'\')" data-fa="fa-solid fa-calendar-check">ทดสอบใช้สิทธิเกินโควตา</button></div>':'')+
    '</div></div>'+
    '<div class="section"><div class="section-head"><h3>ประวัติการใช้สิทธิและเหตุการณ์ (Timeline)</h3><span class="sub">'+events.length+' เหตุการณ์</span></div><div class="section-body"><div class="appt-progress-fit">'+
      events.map(function(e){return '<div class="tl-item tl-'+e.cls+'"><div class="tl-head">'+e.title+'<span class="tl-time">'+fmtDateTime(e.ts)+'</span></div><div class="tl-body">'+e.by+'</div>'+(e.card?'<div class="tl-card">'+e.card+'</div>':'')+'</div>';}).join('')+
    '</div></div></div>';
}
function timelineEvents(r){
  const evs=[];
  r.redemptions.forEach(function(rd){
    evs.push({ts:rd.date,cls:'visit',title:'ใช้สิทธิครั้งที่ '+rd.visitNo+' / '+r.approvedQty+(rd.retained?' — คงคะแนนเดิม':' — ประเมินใหม่'),by:rd.savedBy,
      card:'คะแนนรวม <b class="mono">'+rd.total+'</b> · กลุ่ม <span class="badge badge--group-'+rd.group+'" style="margin-left:2px">'+groupLabel(rd.group)+'</span> · รายได้สุทธิ <b class="mono">฿'+fmtMoney(rd.net)+'</b>'});
  });
  r.homeVisits.forEach(function(hv){
    let extra='';
    if(hv.econSnapshot){ const e=hv.econSnapshot; extra += '<br>ผลประเมิน SMDA ใหม่จากการเยี่ยมบ้าน: คะแนนรวม <b class="mono">'+e.total+'</b> · กลุ่ม <span class="badge badge--group-'+e.group+'" style="margin-left:2px">'+groupLabel(e.group)+'</span> · รายได้สุทธิ <b class="mono">฿'+fmtMoney(e.net)+'</b>'; }
    if(hv.consent){ extra += '<br>ลงนามยินยอมโดย '+hv.consent.name+' · '+fmtDateTime(hv.consent.ts); }
    evs.push({ts:hv.date,cls:'homevisit',title:'บันทึกเยี่ยมบ้าน',by:hv.by,card:hv.findings+extra});
  });
  if(r.status==='Off'){
    evs.push({ts:r.history[r.history.length-1].ts,cls:'close',title:'ปิดเคสอัตโนมัติ (Off) — ใช้สิทธิครบตามจำนวนที่อนุมัติ',by:'ระบบ'});
  }
  evs.sort(function(a,b){return new Date(a.ts)-new Date(b.ts);});
  return evs;
}
function attemptRedeemBlocked(id){ toast('error','ปฏิเสธ: สิทธิ์ครบจำนวนที่อนุมัติแล้ว (Remaining = 0) ไม่สามารถใช้สิทธิเพิ่มได้'); }

        '<div class="kv"><span class="k">กลุ่มสี</span><span class="v"><span class="badge badge--group-'+(r.redemptions.length?last.group:computeScoreFrom(r.assessment).group)+'">'+groupLabel(r.redemptions.length?last.group:computeScoreFrom(r.assessment).group)+'</span></span></div>'+
        '<div class="kv"><span class="k">รายได้สุทธิ</span><span class="v">฿'+fmtMoney(r.redemptions.length?last.net:computeScoreFrom(r.assessment).net)+'</span></div>'+

function selectRedeemChoice(c){
  window.__redeemChoice=c;

  document.getElementById('choiceReassess').classList.toggle('is-selected',c==='reassess');

  const nextNo=(r.usedQty||0)+1;
  document.getElementById('confirmRedeemBtn').innerHTML = ic('calendar-check')+'ยืนยันครั้งที่ '+nextNo+(c==='retain'?' — คงคะแนนเดิม':' — บันทึกคะแนนใหม่');
}
function confirmRedeem(id){
  const r = DB.consults.find(function(x){return x.id===id;});
  const last = r.redemptions.length ? r.redemptions[r.redemptions.length-1] : r.assessment;
  const nextNo=(r.usedQty||0)+1;
  const amountEl=document.getElementById('redeemAmount');
  const amount = amountEl ? (+amountEl.value||0) : r.items[0].priceFull;
  let snap;
  if(window.__redeemChoice==='reassess'){
    const income=+document.getElementById('redeem_income').value||0, expense=+document.getElementById('redeem_expense').value||0, debt=+document.getElementById('redeem_debt').value||0;
    const fra=currentFraTotal('redeem')||last.fra||0;
    const s=computeScoreFrom({income:income,expense:expense,debt:debt,fra:fra});
    snap={visitNo:nextNo,date:new Date().toISOString(),retained:false,income:income,expense:expense,debt:debt,fra:fra,net:s.net,copay:s.copay,total:s.total,group:s.group,savedBy:'สมหญิง มีใจ (นักสังคมสงเคราะห์)',amount:amount};
  } else {
    const base=r.redemptions.length?last:r.assessment;
    const s=computeScoreFrom(base);
    snap={visitNo:nextNo,date:new Date().toISOString(),retained:true,income:base.income,expense:base.expense,debt:base.debt,fra:base.fra,net:s.net,copay:s.copay,total:s.total,group:s.group,savedBy:'สมหญิง มีใจ (นักสังคมสงเคราะห์)',amount:amount};
  }
  r.redemptions.push(snap);
  r.usedQty = (r.usedQty||0)+1;
  r.history.push({type:'redeem',label:'ใช้สิทธิครั้งที่ '+snap.visitNo+' — '+(snap.retained?'คงคะแนนเดิม':'ประเมินใหม่'),ts:snap.date,actor:snap.savedBy});
  const remain = r.approvedQty - r.usedQty;
  closeDrawer();
  if(remain<=0){
    r.status='Off';
    DB.cases[r.hn].status='Off';
    r.history.push({type:'close',label:'ปิดเคสอัตโนมัติ (Off) — ใช้สิทธิครบตามจำนวนที่อนุมัติ',ts:new Date().toISOString(),actor:'ระบบ'});
    toast('success','บันทึกใช้สิทธิครั้งที่ '+snap.visitNo+' สำเร็จ · ครบโควตาแล้ว — เคสปิดเป็น Off โดยอัตโนมัติ');
  } else {
    toast('success','บันทึกใช้สิทธิครั้งที่ '+snap.visitNo+' สำเร็จ · คงเหลือ '+remain+' ครั้ง');
  }
  render();
}

<script>
/* ==========================================================================
   NEW SCOPE — added 2026-09-04 per direct stakeholder/product-owner feedback.
   NOT part of Application_Blueprint_TH.docx v1 — see DESIGN_NOTES.md / BLUEPRINT_TRACEABILITY.md
   for the explicit stakeholder-requested-scope flag and Working Assumptions
   (esp. "กด Alive" -> interpreted here as an arrival/check-in action, and the
   exact 8-stage Timeline set, both pending stakeholder confirmation of the
   real terminology).
   1) Appointment (นัดหมาย) worklist + per-visit Timeline + Assessment compare
   2) Reusable signature-pad consent capture (canvas draw-to-sign)
   3) Follow up (ติดตาม) worklist -> Home Visit that adds a real SMDA entry
   ========================================================================== */
function v59LocalDateISO(){
  var d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
const DEFAULT_APPT_DATE=v59LocalDateISO();
const VISIT_STAGES=[
  {key:'Arrived',label:'เช็คอิน / มาถึง'},
  {key:'Assessment',label:'ประเมิน (สังคมสงเคราะห์)'},
  {key:'Nursing',label:'พยาบาล'},
  {key:'Doctor',label:'พบแพทย์'},
  {key:'EndOfTreatment',label:'สิ้นสุดการรักษา'},
  {key:'Finance',label:'การเงิน'},
  {key:'Medicine',label:'รับยา'},
  {key:'GoHome',label:'กลับบ้าน'}
];
/* Round 7 (stakeholder: "ครั้งที่ นอกจากครั้งที่ 1/10 ต้องบอก เงินที่ใช้/เงินที่เหลือ") —
   wherever a Worklist 2 visit count appears, also show money used-so-far / remaining against
   the approved budget AMOUNT. Reuses the SAME real amount data added in round 5 for the
   "ค่าใช้จ่ายเกินวงเงิน" KPI (`totalRedeemedAmount`/`approvedAmountFor`), not a parallel number.
   For a program-only/social consult with no approved budget amount, returns '' → only the
   count is shown (documented in DESIGN_NOTES.md §27). */
function visitMoneyLabel(r){
  const approvedAmt = approvedAmountFor(r);
  if(!(r.hasFinancialProblem && approvedAmt>0)) return '';
  const used = totalRedeemedAmount(r);
  const remain = Math.max(0, approvedAmt - used);
  return ' · <span title="ใช้ไปจริง / คงเหลือ ของวงเงินที่อนุมัติ ฿'+fmtMoney(approvedAmt)+'">ใช้ไป <b>฿'+fmtMoney(used)+'</b> / เหลือ <b>฿'+fmtMoney(remain)+'</b></span>';
}
function fmtTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function apptDateLabel(d){ return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function shiftApptDate(delta){ const d=new Date(STATE.apptDate+'T00:00:00'); d.setDate(d.getDate()+delta); STATE.apptDate=d.toISOString().slice(0,10); render(); }

/* ---------- reusable signature-pad (canvas draw-to-sign) ---------- */
function initSigPad(canvasId){
  const canvas=document.getElementById(canvasId);
  if(!canvas || canvas.__wired) return;
  canvas.__wired=true; canvas.__hasDrawing=false;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#1e2a3a'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  let drawing=false, last=null;
  function pos(e){ const rect=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height)}; }
  function start(e){ drawing=true; last=pos(e); canvas.__hasDrawing=true; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
}
function clearSigPad(canvasId){ const canvas=document.getElementById(canvasId); if(!canvas) return; const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); canvas.__hasDrawing=false; }
function hasSignature(canvasId){ const c=document.getElementById(canvasId); return !!(c && c.__hasDrawing); }
function captureSignature(canvasId){ const c=document.getElementById(canvasId); return c ? c.toDataURL('image/png') : null; }
function seedSignatureDataUrl(seedN){
  try{
    const c=document.createElement('canvas'); c.width=300; c.height=110;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,300,110);
    ctx.strokeStyle='#1e2a3a'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); let x=18,y=70; ctx.moveTo(x,y);
    for(let i=0;i<11;i++){ x+=25; y=68+Math.sin((i+seedN)*1.3)*24-((i%3===0)?12:0); ctx.lineTo(x,y); }
    ctx.stroke();
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
(function seedConsentSignatures(){
  DB.appointments.forEach(function(a,i){ if(a.consent && !a.consent.dataUrl){ a.consent.dataUrl=seedSignatureDataUrl(i+3); } });
})();

/* ---------- assessment history series (per request) — shared by Appointment Assessment + Follow-up ---------- */
function assessmentSeriesFor(r){
  const series=[];
  if(r.assessment){ const s=computeScoreFrom(r.assessment); series.push({label:'ผลประเมินตอนขออนุมัติ',date:r.assessment.savedAt,income:r.assessment.income,expense:r.assessment.expense,debt:r.assessment.debt,fra:r.assessment.fra,net:s.net,copay:s.copay,total:s.total,group:s.group}); }
  (r.redemptions||[]).forEach(function(rd){ series.push({label:'ใช้สิทธิครั้งที่ '+rd.visitNo,date:rd.date,income:rd.income,expense:rd.expense,debt:rd.debt,fra:rd.fra,net:rd.net,copay:rd.copay,total:rd.total,group:rd.group}); });
  series.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  return series;
}
function compareAssessmentsHtml(series){
  if(!series.length) return '<div class="banner banner--info" style="margin:0"><span class="icon" data-icon="circle-info"></span><div><strong>ยังไม่มีประวัติผลประเมินก่อนหน้า</strong></div></div>';
  function col(x){
    return '<div><div class="cmp-head">'+x.label+'<div class="tl-time">'+fmtDateTime(x.date)+'</div></div>'+
      '<div class="prior-card prior-card--col">'+
      '<div class="kv"><span class="k">รายได้รวม</span><span class="v">฿'+fmtMoney(x.income)+'</span></div>'+
      '<div class="kv"><span class="k">รายจ่าย+หนี้สิน</span><span class="v">฿'+fmtMoney(x.expense+x.debt)+'</span></div>'+
      '<div class="kv"><span class="k">รายได้สุทธิ</span><span class="v '+(x.net<0?'net-income is-neg':'')+'">฿'+fmtMoney(x.net)+'</span></div>'+
      '<div class="kv"><span class="k">คะแนนรวม / กลุ่ม</span><span class="v"><span class="badge badge--group-'+x.group+'">'+x.total+' · '+groupLabel(x.group)+'</span></span></div>'+
      '</div></div>';
  }
  const last2=series.slice(-2);
  if(last2.length===1) return '<div class="cmp-grid">'+col(last2[0])+'<div class="muted" style="align-self:center;text-align:center">ยังไม่มีผลประเมินครั้งก่อนหน้าเพื่อเปรียบเทียบ</div></div>';
  return '<div class="cmp-grid">'+col(last2[0])+col(last2[1])+'</div>';
}


function v58OpenAppointmentFunctions(apptId,anchor){
  var a=DB.appointments.find(function(x){return x.id===apptId}); if(!a)return;
  var p=getPatient(a.hn)||{};

/* V59 — Appointment mock data follows the real browser-local current date.
   Exactly 5 records belong to today's worklist so the navigation badge and visible rows agree. */
(function v59NormalizeAppointmentMockDates(){
  var today=DEFAULT_APPT_DATE;
  var times=['09:00','10:30','13:00','14:30','16:00'];
  DB.appointments.slice(0,5).forEach(function(a,i){
    a.scheduledDate=today;
    a.scheduledTime=times[i];

      a.status='Arrived'; a.arrivedAt=new Date().toISOString(); a.stageIndex=0;

    }

/* ---------- Appointment worklist ---------- */
function viewAppointments(){

    } else if(a.status==='Arrived'){
      /* Round 7 — checked in but assessment not yet done: the same primary action that was

         เป็นกด ประเมิน"). Opens the assessment; on save the flow returns to THIS worklist with

    return '<tr>'+

    actionHtml+

function advanceStage(apptId){
  const appt=DB.appointments.find(function(a){return a.id===apptId;});
  const nextIdx=appt.stageIndex+1;
  if(nextIdx>=VISIT_STAGES.length) return;
  if(VISIT_STAGES[nextIdx].key==='Assessment'){ openApptAssessment(apptId); return; }
  const ts=new Date().toISOString();
  appt.stageIndex=nextIdx;
  appt.stageLog.push({stage:VISIT_STAGES[nextIdx].key,ts:ts});
  appt.status = (nextIdx===VISIT_STAGES.length-1) ? 'Done' : 'InProgress';
  toast('success', VISIT_STAGES[nextIdx].label+' — บันทึกเวลาแล้ว');
  render();
  openApptTimeline(apptId);
}

function confirmApptAssessment(apptId){
  const appt=DB.appointments.find(function(a){return a.id===apptId;});
  const r=DB.consults.find(function(x){return x.id===appt.consultId;});

  const nowIso=new Date().toISOString();
  const snap={visitNo:nextNo,date:nowIso,retained:false,income:income,expense:expense,debt:debt,fra:fra,net:s.net,copay:s.copay,total:s.total,group:s.group,savedBy:'สมหญิง มีใจ (นักสังคมสงเคราะห์)',source:'appointment',apptId:appt.id,amount:r.items[0].priceFull};
  r.redemptions.push(snap);
  r.usedQty=(r.usedQty||0)+1;
  r.history.push({type:'redeem',label:'ใช้สิทธิครั้งที่ '+snap.visitNo+' — ประเมินผ่านนัดหมาย '+appt.id,ts:nowIso,actor:snap.savedBy});
  const remain=r.approvedQty-r.usedQty;
  if(remain<=0){
    r.status='Off'; DB.cases[r.hn].status='Off';
    r.history.push({type:'close',label:'ปิดเคสอัตโนมัติ (Off) — ใช้สิทธิครบตามจำนวนที่อนุมัติ',ts:new Date().toISOString(),actor:'ระบบ'});
  }
  /* Home Visit Plan — this is the REAL trigger for Worklist 3 (เยี่ยมบ้าน), reusing the existing
     needsFollowUp mechanic that already served this purpose (per DESIGN_NOTES.md §24) rather than
     inventing a parallel flag. Worklist 3's list is genuinely sourced from what is set here. */
  const hvpEnable=document.getElementById('hvpEnable').checked;
  if(hvpEnable){
    const topic=document.getElementById('hvpTopic').value.trim()||'ติดตามสภาพความเป็นอยู่';
    const plannedCount=Math.max(1,+document.getElementById('hvpCount').value||1);

    r.followUpPlan=r.followUpPlan||{topic:topic,plannedCount:plannedCount,visitsSoFar:0};
    r.followUpPlan.topic=topic; r.followUpPlan.plannedCount=plannedCount;
    r.followUpReason=topic;
    r.history.push({type:'plan_homevisit',label:'กำหนดแผนเยี่ยมบ้าน: '+topic+' ('+plannedCount+' ครั้ง)',ts:nowIso,actor:'สมหญิง มีใจ (นักสังคมสงเคราะห์)'});
  }
  appt.stageIndex=1; appt.stageLog.push({stage:'Assessment',ts:nowIso}); appt.status='InProgress';
  closeModal();
  /* Round 7 — finishing the assessment returns to the Worklist 2 list (do NOT reopen the
     Timeline drawer), and render() updates the row live: its status advances to "ประเมินแล้ว ·
     ใช้สิทธิครั้งที่ N" and the money used/remaining figures reflect the just-recorded
     redemption (stakeholder: "เมื่อประเมินเสร็จ จะกลับมาหน้า Worklist พร้อม Update Status"). */
  const remainAmt = approvedAmountFor(r)>0 ? (' · เหลือ ฿'+fmtMoney(Math.max(0,approvedAmountFor(r)-totalRedeemedAmount(r)))) : '';
  toast('success','บันทึกผลประเมิน + ใช้สิทธิครั้งที่ '+snap.visitNo+' สำเร็จ'+remainAmt+(hvpEnable?' · เพิ่มเข้า Worklist 3 (เยี่ยมบ้าน)':''));
  render();
}

        '<div class="hstack" style="justify-content:flex-end"><button class="btn btn--primary" onclick="commitDecision(\''+r.id+'\')" id="decisionBtn" data-fa="fa-solid fa-circle-check"><span class="icon" data-icon="circle-check"></span>ยืนยันการอนุมัติ</button></div>'+
      '</div></div>'+
    '</div>';
}
function setDecision(d,btn){
  window.__execDecision=d;
  btn.parentElement.querySelectorAll('button').forEach(function(b){b.classList.remove('is-active');});
  btn.classList.add('is-active');
  document.getElementById('approveFields').style.display = d==='approve'?'grid':'none';
  document.getElementById('rejectFields').style.display = d==='reject'?'block':'none';
  document.getElementById('decisionBtn').innerHTML = ic('circle-check')+(d==='approve'?'ยืนยันการอนุมัติ':'ยืนยันการปฏิเสธ');
}
function updApprovedValue(){
  const r = DB.consults.find(function(x){return x.id===STATE.activeId;});
  const qty=+document.getElementById('apprQty').value||0;
  document.getElementById('apprValue').value='฿'+fmtMoney(qty*r.items[0].priceFull);
}
window.__execDecision='approve';
function commitDecision(id){
  const r = DB.consults.find(function(x){return x.id===id;});
  if(window.__execDecision==='approve'){
    const qty=+document.getElementById('apprQty').value||1;
    if(!confirm('ยืนยันอนุมัติ '+qty+' ครั้ง มูลค่า ฿'+fmtMoney(qty*r.items[0].priceFull)+' ใช่หรือไม่?')) return;
    r.status='Approved'; r.approvedQty=qty; r.usedQty=0;
    /* approvedAmount (added round 5) — the real budget CAP in baht, locked in at the moment of
       approval. Kept as its own explicit field (rather than always re-deriving qty*price) so a
       later real per-visit price change is a genuine divergence the "ค่าใช้จ่ายเกินวงเงินอนุมัติ"
       KPI can detect — see isAmountOverrun()/DESIGN_NOTES.md §25. */
    r.approvedAmount = qty*r.items[0].priceFull;
    r.approval={approver:'ผอ.ประเสริฐ ศรีสมบูรณ์ (ผู้อำนวยการ)',approvedAt:new Date().toISOString(),note:'อนุมัติผ่านหน้าจอพิจารณา'};
    r.history.push({type:'approve',label:'อนุมัติ '+qty+' ครั้ง มูลค่า ฿'+fmtMoney(qty*r.items[0].priceFull),ts:new Date().toISOString(),actor:r.approval.approver});
    toast('success','อนุมัติคำขอ '+r.id+' สำเร็จ · เปิดโควตา '+qty+' ครั้ง');
  } else {
    const reason=document.getElementById('rejReason').value.trim();
    if(!reason){ toast('error','กรุณาระบุเหตุผลการปฏิเสธ'); document.getElementById('rejReason').classList.add('has-error'); return; }
    r.status='Rejected';
    r.approval={approver:'ผอ.ประเสริฐ ศรีสมบูรณ์ (ผู้อำนวยการ)',rejectedAt:new Date().toISOString(),reason:reason};
    r.history.push({type:'reject',label:'ปฏิเสธคำขอ — '+reason,ts:new Date().toISOString(),actor:r.approval.approver});
    toast('success','บันทึกผลปฏิเสธคำขอ '+r.id+' แล้ว');
  }
  goto('exec-inbox');
}
</script>

 '</div></div>';

 render();

<script>
/* v36 — Assessment Set Template engine.

   every assessment selected for this case is complete. Forms without source definitions are
   listed truthfully but are not fabricated. */
const ASSESSMENT_CATALOG=[
 {id:'sdma',code:'FM-MSW-001',name:'S.D.M.A. แบบประเมิน วินิจฉัย และการจัดการทางสังคม',exec:true,mandatory:true},
 {id:'fra',code:'FM-MSW-002',name:'F.R.A. แบบประเมินความพร้อมครอบครัว',exec:true},
 {id:'mhsca',code:'FM-MSW-004',name:'M.H.S.C.A. แบบประเมินการดูแลสุขภาพจิตตนเอง',exec:true},
 {id:'ssa',code:'FM-MSW-005',name:'S.S.A. แบบประเมินทักษะพื้นฐานในการทำงานและทักษะการปรับตัวทางสังคม',exec:false},
 {id:'refer',code:'FM-MSW-006',name:'แบบฟอร์มการส่งต่อข้อมูลทางสังคม',exec:false},
 {id:'impact',code:'FM-MSW-007',name:'แบบประเมินผลกระทบจากการเจ็บป่วย',exec:false},
 {id:'homevisit',code:'FM-MSW-008',name:'Home visit (เยี่ยมบ้าน)',exec:true},
 {id:'ability',code:'FM-MSW-009',name:'แบบประเมินความสามารถในการร่วมจ่ายฯ',exec:true},
 {id:'st5',code:'FM-MSW-011',name:'แบบประเมินความเครียด ST-5',exec:false},
 {id:'postpartum',code:'FM-MSW-012',name:'แบบคัดกรองการเลี้ยงดูเด็กหลังคลอด',exec:false}
];
const ASSESSMENT_TEMPLATES=[
 {id:'standard',name:'Standard Social Work',items:['sdma','mhsca','fra']},
 {id:'family',name:'Family / Caregiver',items:['sdma','fra','impact','homevisit']},
 {id:'mental',name:'Mental Health / Psychosocial',items:['sdma','mhsca','st5','fra']},
 {id:'full',name:'Full Assessment (10 แบบ)',items:ASSESSMENT_CATALOG.map(x=>x.id)}

function assessCfg(c){
 if(!c.assessmentPlan)c.assessmentPlan={templateId:'standard',items:['sdma','mhsca','fra'],configured:false};
 if(c.assessmentPlan.items.indexOf('sdma')<0)c.assessmentPlan.items.unshift('sdma');
 return c.assessmentPlan;
}
function assessmentRec(c,id){
 if(id==='sdma')return c.sdma;if(id==='mhsca')return c.mhsca;if(id==='fra')return c.fra;
 return c.extraAssessments&&c.extraAssessments[id];
}
function assessmentDone(c,id){let r=assessmentRec(c,id);return !!(r&&r.status==='saved');}
function selectedAssessmentsComplete(c){
 let cfg=assessCfg(c);return cfg.items.every(id=>assessmentDone(c,id));
}
function setAssessmentTemplate(v){
 let c=A(),t=ASSESSMENT_TEMPLATES.find(x=>x.id===v);if(!t)return;
 c.assessmentPlan={templateId:t.id,items:t.items.slice(),configured:true};
 if(c.assessmentPlan.items.indexOf('sdma')<0)c.assessmentPlan.items.unshift('sdma');
 STATE.assessStep='sdma';toast('success','ใช้ Assessment Set: '+t.name);render();
}
function toggleAssessmentItem(id,on){
 let c=A(),cfg=assessCfg(c);
 if(id==='sdma'){toast('error','S.D.M.A. เป็นแบบบังคับ เพราะมี Consent อยู่ภายใน');render();return;}
 if(on && cfg.items.indexOf(id)<0)cfg.items.push(id);
 if(!on)cfg.items=cfg.items.filter(x=>x!==id);
 cfg.configured=true;render();
}
function assessmentSetManager(c){
 let cfg=assessCfg(c);
 return '<div class="assess-set-panel"><div class="hstack" style="justify-content:space-between;align-items:flex-start"><div><b>Assessment Set Template</b><div class="muted" style="font-size:11px">เลือกชุดมาตรฐาน แล้วเพิ่ม/ลดแบบประเมินเฉพาะ Case ได้</div></div><div class="hstack"><select class="select" onchange="setAssessmentTemplate(this.value)">'+ASSESSMENT_TEMPLATES.map(t=>'<option value="'+t.id+'"'+(cfg.templateId===t.id?' selected':'')+'>'+t.name+'</option>').join('')+'</select></div></div>'+
 '<div class="assess-set-list">'+ASSESSMENT_CATALOG.map(a=>'<label class="assess-set-item"><input type="checkbox" '+(cfg.items.includes(a.id)?'checked':'')+(a.mandatory?' disabled':'')+' onchange="toggleAssessmentItem(\''+a.id+'\',this.checked)"><span><b>'+a.code+' · '+a.name+'</b><small>'+(a.mandatory?'บังคับ · Consent อยู่ในแบบนี้':(a.exec?'แบบประเมินพร้อมใช้งานใน Mockup':'อยู่ใน Catalog · รอผูกแบบฟอร์มต้นฉบับก่อนเปิดกรอกจริง'))+'</small></span></label>').join('')+'</div></div>';
}
function goDynamicAssessment(id){

 if(id==='accept')return;
 if(id!=='sdma' && !(c.sdma&&c.sdma.status==='saved')){toast('error','ต้องบันทึก S.D.M.A. + Consent ให้สมบูรณ์ก่อน');return;}

   return '<div class="at-step '+(done?'done ':'')+(draft?'draft ':'')+(cur?'current ':'')+(locked?'locked':'')+'"><button type="button" '+(locked?'disabled':'')+' onclick="goDynamicAssessment(\''+id+'\')"><div class="at-dot">'+(done?'✓':(draft?'✎':(i+1)))+'</div><div class="at-label">'+a.code+'</div><div class="at-time">'+(done?fmtDateTime(r.savedAt):(draft?'Draft '+fmtDateTime(r.savedAt):'ยังไม่ประเมิน'))+'</div></button></div>';
 }).join('')+'</div></div>';

}

function assessmentSequenceHtml(c){
 let cfg=assessCfg(c),open=STATE.assessStep||'sdma';

 let intro='<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>รับเคสแล้ว — กำหนดและดำเนินการ Assessment Set</strong><p>S.D.M.A. + Consent เป็นแบบบังคับก่อน หลังบันทึกแล้วเจ้าหน้าที่เลือก Assessment Set Template และปรับเพิ่ม/ลดแบบประเมินของ Case ได้ Timeline แสดงสิ่งที่ต้องทำ, Draft, เสร็จแล้ว และเวลาที่บันทึก</p></div></div>';
 let form=open==='sdma'?sdmaFormHtmlV2(c):open==='mhsca'?mhscaFormHtmlV2(c):open==='fra'?fraFormHtmlV2(c):missingAssessmentHtml(c,open);

function assessmentCompletionPanel(c){

function assessmentSummaryV36(c){

<script>
/* v40 — Multi-agent UX outcome:
   BA: one assessment at a time; Clinical SW: preserve source scoring; UX: score/result always visible;
   QA: distinguish completion from clinical result; never invent pass/fail where source has none. */
window.__v40MhPage=window.__v40MhPage||0;
window.__v40FraPage=window.__v40FraPage||0;

function v40SdmaResult(c){
  var p=(c.sdma&&c.sdma.problems)||(c._sdma&&c._sdma.problems)||{};
  var vals=Object.keys(p).map(k=>Number(p[k])).filter(v=>!isNaN(v));
  var assessed=vals.length, high=vals.filter(v=>v>=3&&v<=4).length;
  return {score:assessed?assessed:'—', cls:high?'warn':'neutral',
    title:'S.D.M.A.', result:assessed?(high?('พบปัญหาระดับ 3–4: '+high+' รายการ'):'ประเมินแล้ว '+assessed+' ปัญหา'):'ยังไม่ประเมิน',
    note:'แบบนี้ไม่มีเกณฑ์ “ผ่าน/ไม่ผ่าน” ในเอกสาร · ใช้ระดับความรุนแรงรายปัญหา'};
}
function v40MhResult(c){
  var w=mhscaWork(c), n=mhscaAnswered(w), t=mhscaTotal(w), b=mhscaBand(t);
  if(n<15)return {score:n+'/15',cls:'neutral',title:'M.H.S.C.A.',result:'ยังตอบไม่ครบ',note:'คะแนนจะแปลผลเมื่อครบ 15 ข้อ'};
  return {score:t,cls:t<=39?'warn':'good',title:'M.H.S.C.A.',result:t<=39?'ต่ำกว่าปานกลาง · ต้องติดตาม':'ปานกลางขึ้นไป',note:b.level+' · '+b.method};
}
function v40FraResult(c){
  var w=fraWork(c), t=fraTotal(w), started=w.q1!=null||Object.keys(w.items||{}).length>0;
  if(!started)return {score:'—',cls:'neutral',title:'F.R.A.',result:'ยังไม่ประเมิน',note:'คะแนนรวม 0–47'};
  return {score:t,cls:t>=21?'good':'warn',title:'F.R.A.',result:t>=21?'มีความพร้อม':'ยังไม่มีความพร้อม',note:(t>=21?'≥ 21':'≤ 20')+' · '+fraBand(t).method};
}
function v40Cockpit(c){
  var cfg=assessCfg(c), done=cfg.items.filter(id=>assessmentDone(c,id)).length;
  var arr=[v40SdmaResult(c),v40MhResult(c),v40FraResult(c)];
  var open=STATE.assessStep||'sdma';
  var map={'S.D.M.A.':'sdma','M.H.S.C.A.':'mhsca','F.R.A.':'fra'};
  return '<div class="v40-cockpit"><div class="v40-cockpit-head"><div><b>Assessment Control</b><span> · เห็นคะแนน/ผลทันที ไม่ต้องเลื่อนลงไปหาสรุป</span></div><div class="v40-help">ความครบถ้วน Assessment Set '+done+'/'+cfg.items.length+'</div></div><div class="v40-results">'+arr.map(function(x){var k=map[x.title];return '<div class="v40-result '+x.cls+' '+(open===k?'active':'')+'" onclick="goDynamicAssessment(\''+k+'\')"><div class="v40-score">'+x.score+'</div><div class="v40-rtext"><b>'+x.title+'</b><strong>'+x.result+'</strong><small>'+x.note+'</small></div></div>';}).join('')+'</div></div>';
}
const __v40AssessmentBase=assessmentSequenceHtml;
assessmentSequenceHtml=function(c){return v40Cockpit(c)+__v40AssessmentBase(c);};

function v40Progress(label,done,total){
  var pct=total?Math.round(done*100/total):0;
  return '<div class="v40-form-progress"><b>'+label+' · '+done+'/'+total+'</b><div class="bar"><i style="width:'+pct+'%"></i></div><b>'+pct+'%</b></div>';

function v40EnhanceSdma(){

}
function v40PageMh(dir){
  window.__v40MhPage=Math.max(0,Math.min(2,(window.__v40MhPage||0)+dir));v40EnhanceMh(true);
}

function v40EnhanceFra(force){
  var items=[...document.querySelectorAll('.fra-item')];if(items.length<5)return;

  items.forEach((r,i)=>r.style.display=(i>=page*size&&i<(page+1)*size)?'':'none');

  anchor.after(nav);

function v40Enhance(){

<script>

  }).join('');
  var total=items.reduce(function(sum,it){var q=+(it.qty||it.quantity||1),f=+(it.priceFull||it.price||0),cl=+(it.priceClaim||it.claimable||0);return sum+q*Math.max(0,f-cl)},0);
  if(!items.length){ rows='<tr><td colspan="5" style="color:var(--color-text-muted)">ไม่มีรายการค่าใช้จ่ายที่ต้องขอสนับสนุน</td></tr>'; }

<script>
/* v46: worklist is "cases I own today", not "cases waiting assessment". */
function v46CaseStatus(c){
  if(c.status==='Submitted' && !c.accepted) return ['badge--info','รอรับเรื่อง','รับ Consult'];
  if(c.status==='InProgress'){
    if(typeof assessmentSetComplete==='function' && assessmentSetComplete(c)) return ['badge--normal','ประเมินครบแล้ว','Review / สรุป'];
    if(c.assessment || c.sdma || (c.assessmentSet && c.assessmentSet.saved)) return ['badge--warning','กำลังประเมิน','ประเมินต่อ'];
    return ['badge--info','รับเคสแล้ว','เริ่มประเมิน'];
  }
  if(c.status==='Verified') return ['badge--normal','ประเมินแล้ว · Verified','ดูสรุป / ส่ง Approve'];
  if(c.status==='PendingApproval') return ['badge--warning','รอ Approve','ติดตามการอนุมัติ'];
  if(c.status==='Approved' && !c.notifiedPatientAt) return ['badge--normal','อนุมัติแล้ว','แจ้งผู้ป่วย'];
  if(c.status==='Approved') return ['badge--normal','แจ้งผู้ป่วยแล้ว','ติดตามสิทธิ'];
  if(c.status==='Completed') return ['badge--normal','เข้ารับบริการแล้ว','ดู Case'];

/* Timeline: current case cycle first; old/administrative history is collapsed separately. */
historyTimeline=function(r){
  var hist=(r.history||[]).slice();
  var currentTypes=['accept','consent','assessment-set','draft','assessment','sdma','mhsca','fra',
                    'verify','submit-approval','approve-manager','approve-director','notify-patient'];
  function isCurrent(h){
    var t=(h.type||'').toLowerCase(), l=(h.label||'').toLowerCase();
    return currentTypes.some(function(k){return t.indexOf(k)>=0;}) ||
      /รับเคส|ยินยอม|assessment|fm-msw|ประเมิน|verify|approve|อนุมัติ|แจ้งผู้ป่วย/.test(l);
  }
  var current=hist.filter(isCurrent);
  var old=hist.filter(function(h){return !isCurrent(h);});
  var curHtml=current.map(function(h){
    return '<div class="tl-item"><div class="tl-head">'+h.label+'</div><div class="tl-time">'+fmtDateTime(h.ts)+' · '+h.actor+'</div></div>';

  }).join('');
  return '<div class="v46-cycle">'+
    '<div class="v46-cycle-head"><h3>Timeline · รอบการดำเนินงานปัจจุบัน</h3><span>'+current.length+' เหตุการณ์</span></div>'+
    '<div class="v46-cycle-body"><div class="appt-progress-fit">'+curHtml+'</div>'+
      (oldHtml?'<details class="v46-history-old"><summary>ดูประวัติเดิม / เหตุการณ์ระบบ '+old.length+' รายการ</summary><div class="old-list">'+oldHtml+'</div></details>':'')+
    '</div></div>';
};
</script>

(function(){

    root=root||document;
    root.querySelectorAll('.info-box,.notice,.alert,.callout').forEach(function(el){

        el.remove();

    });
  }

  /* 2) Patient banner: persistent history icon on every application page where patient banner exists. */
  function historyIcon(){
    var s=document.createElement('span');
    s.className='v47-history-flag';
    s.setAttribute('role','button');
    s.setAttribute('tabindex','0');
    s.setAttribute('aria-label','มีประวัติระบบสังคมสงเคราะห์');
    s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>';
    s.onclick=function(e){
      e.stopPropagation();
      var b=[].slice.call(document.querySelectorAll('button,a')).find(function(x){
        return /History Case|ประวัติ Case|ประวัติสังคมสงเคราะห์/.test(x.textContent||'');
      });
      if(b) b.click();
    };
    return s;

  function ensureHistoryFlag(root){
    root=root||document;
    var candidates=[].slice.call(root.querySelectorAll('.patient-banner,.patient-strip,.patient-context,.patient-head,.patient-info-banner'));
    candidates.forEach(function(b){
      if(b.querySelector('.v47-history-flag')) return;

        var anchor=b.querySelector('h1,h2,h3,strong,b') || b.firstElementChild || b;
        anchor.appendChild(historyIcon());
      }
    });
  }
  function apply(){
    removeReadOnlyNote(document);
    ensureHistoryFlag(document);
  }
  new MutationObserver(function(){apply();}).observe(document.documentElement,{childList:true,subtree:true});

})();

    var codes=[];
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb){
      var row=cb.closest('label,.assessment-option,.form-check,.card,div');
      var t=txt(row);

      if(m && codes.indexOf(m[0])<0) codes.push(m[0]);
    });

    var map={
      'FM-MSW-001':'S.D.M.A.',

})();

/* v50 keeps the existing v49 visual language and changes only assessment behaviour requested. */
function v50SdmaSections(c){
  var w=sdmaWork(c), f=w.f||{}, probs=w.problems||{}, soap=w.soap||{};
  function filled(v){return v!==undefined&&v!==null&&String(v).trim()!=='';}
  function state(any,done){return done?'green':(any?'yellow':'red');}
  var sig=!!(c.consent&&c.consent.signature&&c.consent.signature.dataUrl);
  if(typeof hasSignature==='function' && hasSignature('sigPad_consent')) sig=true;
  var s=[];

  var any1=['station','recvDate','recvTime','hn','name','citizenId','birth','age','nationality','ethnicity','religion','marital','education','rights','occupation','income1','phone','addr'].some(k=>filled(f[k]));
  s.push({n:2,name:'ข้อมูลทั่วไป',state:state(any1,filled(f.hn)&&filled(f.name)&&filled(f.recvDate))});
  var any2=['informant','informantName','informantRel','informantPhone','intake','intakeDept','intakeAN','intakeAdmit','icdMed','icdSocial','incomeMonthly','expenseMonthly'].some(k=>filled(f[k]));
  s.push({n:3,name:'Fact Finding',state:state(any2,filled(f.informant)&&filled(f.intake)&&filled(f.icdMed))});
  s.push({n:4,name:'ครอบครัว',state:state(filled(f.familyHistory),filled(f.familyHistory))});
  var np=Object.keys(probs).filter(k=>probs[k]!=null).length, any4=np>0||filled(soap.s)||filled(soap.o)||filled(soap.a)||filled(soap.p);
  s.push({n:5,name:'Social Diagnosis',state:state(any4,np>0&&filled(soap.a))});
  var any5=filled(f.risk)||filled(f.riskLevel);
  s.push({n:6,name:'Risk',state:state(any5,filled(f.riskLevel))});
  s.push({n:7,name:'Family Readiness',state:state(filled(f.frAssessed),filled(f.frAssessed))});
  var any7=!!(f.fuFollowed||f.fuNormal||f.fuRefer||f.fuNot||filled(f.fuDate)||filled(f.fuNextDate)||filled(f.fuNextTopic)||filled(f.fuResult));
  var done7=!!(f.fuNot || (f.fuFollowed&&(filled(f.fuDate)||filled(f.fuResult))));
  s.push({n:8,name:'Follow up',state:state(any7,done7)});
  return s;
}
function v50SdmaReady(c){return v50SdmaSections(c).every(x=>x.state==='green');}
function v50SdmaMissing(c){return v50SdmaSections(c).filter(x=>x.state!=='green').map(x=>x.n+' '+x.name);}
function v50AssessmentMissing(c){
  var cfg=assessCfg(c), miss=[];
  cfg.items.forEach(function(id){
    var a=ASSESSMENT_CATALOG.find(x=>x.id===id);
    if(id==='sdma'){
      var m=v50SdmaMissing(c); if(m.length) miss.push('FM-MSW-001: '+m.join(', '));
    } else if(id==='mhsca'){
      var w=mhscaWork(c), n=mhscaAnswered(w); if(n<15) miss.push('FM-MSW-004: เหลือ '+(15-n)+' ข้อ');
    } else if(id==='fra'){

      else if(!assessmentDone(c,id)) miss.push('FM-MSW-002: ยังไม่ได้บันทึกสมบูรณ์');
    } else if(!assessmentDone(c,id)){
      miss.push((a?a.code:id)+': ยังไม่เสร็จ');
    }
  });

}

<script>

    if(!c || !selectedAssessmentsComplete(c) || (typeof v50AssessmentMissing==='function' && v50AssessmentMissing(c).length)) return false;

    c.history=c.history||[];
    if(!c._assessmentSetCompletedLogged){
      c.history.push({type:'assess',label:'Assessment Set ครบ — พร้อมส่ง Approve',ts:new Date().toISOString(),actor:ACTOR_SW});
      c._assessmentSetCompletedLogged=true;

    goto('sw-worklist');
    return true;
  }

  var _saveSdma=saveSdma;
  saveSdma=function(complete){
    var c=A(); _saveSdma(complete);
    if(complete && c && c.sdma && c.sdma.status==='saved') finishAssessmentIfLast(c);
  };
  var _saveMhsca=saveMhsca;
  saveMhsca=function(complete){
    var c=A(); _saveMhsca(complete);

  var _saveFra=saveFra;

<script>
/* #1 — Timeline = one business-process state per stage. Audit/history entries are deliberately not repeated here. */
function v62FirstEvent(c, tests){
  var hs=c.history||[];
  for(var i=0;i<hs.length;i++){
    var t=String(hs[i].type||'').toLowerCase(), l=String(hs[i].label||'').toLowerCase();
    if(tests.some(function(x){return t.indexOf(x)>=0||l.indexOf(x)>=0;})) return hs[i];
  }
  return null;
}
historyTimeline=function(c){
  var cfg=typeof assessCfg==='function'?assessCfg(c):{items:[]};
  var assessDone=typeof selectedAssessmentsComplete==='function'&&selectedAssessmentsComplete(c);
  var evAccept=v62FirstEvent(c,['accept','รับเคส']);
  var evAssess=v62FirstEvent(c,['assessment set ครบ','assessment','ประเมินครบ','สรุปผลการประเมิน']);
  var evSubmit=v62FirstEvent(c,['submit','ส่งขอ approve','ส่งอนุมัติ']);
  var evApprove=v62FirstEvent(c,['approve-manager','approve-director','อนุมัติ']);
  var evService=v62FirstEvent(c,['notify-patient','redeem','complete','เข้ารับบริการ']);
  var approved=['Approved','Off','Completed'].indexOf(c.status)>=0 || c.approvalStage==='approved';
  var stages=[
    {n:1,label:'รับเคส',done:!!(c.acceptedAt||evAccept),ev:evAccept,tm:c.acceptedAt},
    {n:2,label:'Assessment',done:assessDone||['Verified','PendingApproval','Approved','Off','Completed'].indexOf(c.status)>=0,ev:evAssess},
    {n:3,label:'ส่ง Approve',done:['PendingApproval','Approved','Off','Completed'].indexOf(c.status)>=0,ev:evSubmit},
    {n:4,label:'อนุมัติ',done:approved,ev:evApprove},
    {n:5,label:'รับบริการ / ติดตาม',done:!!(c.notifiedPatientAt||(c.redemptions&&c.redemptions.length)||c.status==='Completed'||c.status==='Off'),ev:evService,tm:c.notifiedPatientAt}
  ];
  var firstOpen=stages.findIndex(function(x){return !x.done});
  var html=stages.map(function(x,i){var ts=x.tm||(x.ev&&x.ev.ts);return '<div class="v62-flow-step '+(x.done?'done ':'')+(i===firstOpen?'current':'')+'"><div class="v62-flow-dot">'+(x.done?'✓':x.n)+'</div><div class="v62-flow-label">'+x.label+'</div><div class="v62-flow-time">'+(ts?fmtDateTime(ts):(x.done?'เสร็จแล้ว':'—'))+'</div></div>';}).join('');
  return '<div class="v62-flow"><div class="v62-flow-head"><h3>สถานะการดำเนินงาน Case</h3><span>แสดงเฉพาะขั้นตอนหลัก</span></div><div class="v62-flow-steps">'+html+'</div></div>';
};

<script>
/* V64 — same SDMA renderer for every visit; prior visits are read-only snapshots. */
function v64Deep(o){return o==null?o:JSON.parse(JSON.stringify(o));}
function v64BuildPriorWork(r,idx){
  var visit=(r.homeVisits||[])[idx]||{}, snap=visit.sdmaSnapshot||{};
  var base=window.__homeVisitMode&&window.__homeVisitMode.baseWork?v64Deep(window.__homeVisitMode.baseWork):v64Deep(r._sdma||{});
  base=base||{}; base.f=base.f||{}; base.problems=base.problems||{}; base.topProblems=base.topProblems||['','','','']; base.soap=base.soap||{s:'',o:'',a:'',p:''};
  if(snap.form) Object.assign(base.f,v64Deep(snap.form));
  if(snap.problems) base.problems=v64Deep(snap.problems);
  if(snap.topProblems) base.topProblems=v64Deep(snap.topProblems);
  if(snap.soap) base.soap=v64Deep(snap.soap);
  if(snap.income!=null) base.f.incomeMonthly=snap.income;
  if(snap.expense!=null) base.f.expenseMonthly=snap.expense;
  if(snap.debt!=null) base.f.debtAmount=snap.debt;
  if(snap.riskLevel) base.f.riskLevel=snap.riskLevel;
  base.f.fuFollowed=true; base.f.fuDate=(visit.date||'').slice(0,10); base.f.fuResult=visit.findings||base.f.fuResult||'';
  return base;
}

<script>
/* V70 — Assessments are independent work items.
   Save Draft can occur in any order. Only Send Approve is gated by the required Assessment Set. */
(function(){
  function v70State(c,id){
    var r=assessmentRec(c,id);
    if(r&&r.status==='saved') return {key:'done',label:'Complete'};
    if(r&&r.status==='draft') return {key:'draft',label:'Draft'};
    return {key:'new',label:'Not Started'};
  }
  window.v70AssessmentMissing=function(c){
    var cfg=assessCfg(c);
    return cfg.items.filter(function(id){return !assessmentDone(c,id);}).map(function(id){
      var a=ASSESSMENT_CATALOG.find(function(x){return x.id===id}), st=v70State(c,id);
      return a.code+' · '+a.name+' ('+st.label+')';
    });
  };

  /* No sequence lock: any executable assessment in the selected set can be opened at any time. */
  goDynamicAssessment=function(id){
    var c=A(), cfg=assessCfg(c), a=ASSESSMENT_CATALOG.find(function(x){return x.id===id});
    if(!a || cfg.items.indexOf(id)<0) return;
    STATE.assessStep=id;
    render();
  };

  dynamicTimeline=function(c){
    var cfg=assessCfg(c), ids=['accept'].concat(cfg.items), missing=v70AssessmentMissing(c);
    return '<div class="v70-assess-note"><div><b>Assessment ทำได้แบบ Free-order</b><span> · Save Draft แล้วข้ามไปทำแบบอื่นได้</span></div><span>'+(missing.length?'ยังไม่ครบ '+missing.length+' แบบ · ส่ง Approve ไม่ได้':'ครบทุกแบบ · พร้อมส่ง Approve')+'</span></div>'+
    '<div class="assess-timeline-wrap"><div class="assess-timeline">'+ids.map(function(id,i){
      if(id==='accept') return '<div class="at-step done"><div class="at-dot">✓</div><div class="at-label">รับเคส</div><div class="at-time">'+(c.acceptedAt?fmtDateTime(c.acceptedAt):'เสร็จแล้ว')+'</div></div>';
      var a=ASSESSMENT_CATALOG.find(function(x){return x.id===id}), r=assessmentRec(c,id), st=v70State(c,id), cur=(STATE.assessStep||cfg.items[0])===id;
      return '<div class="at-step '+(st.key==='done'?'done ':'')+(st.key==='draft'?'draft ':'')+(cur?'current ':'')+'"><button type="button" onclick="goDynamicAssessment(\''+id+'\')"><div class="at-dot">'+(st.key==='done'?'✓':(st.key==='draft'?'✎':(i+1)))+'</div><div class="at-label">'+a.code+'</div><div class="at-time">'+(r&&r.savedAt?st.label+' · '+fmtDateTime(r.savedAt):st.label)+'</div></button></div>';
    }).join('')+'</div></div>';
  };

  /* Compact assessment selector: no locked assessment, clear independent status. */
  v66AssessmentBar=function(c){
    var tablet=document.body.classList.contains('v66-tablet');
    return '<div class="v74-assessment-tools"><span>โหมด Tablet</span><button type="button" class="v74-switch '+(tablet?'on':'')+'" role="switch" aria-checked="'+(tablet?'true':'false')+'" onclick="v74ToggleTablet()"><span></span></button></div>';
  };
  window.v74ToggleTablet=function(){
    var on=!document.body.classList.contains('v66-tablet');
    if(typeof v66SetMode==='function') v66SetMode(on?'tablet':'desktop');
    else { document.body.classList.toggle('v66-tablet',on); render(); }
  };

  /* Replace the old sequential wording only; selected assessment forms and scoring logic remain unchanged. */
  var __v70AssessmentSequence=assessmentSequenceHtml;
  assessmentSequenceHtml=function(c){
    var cfg=assessCfg(c), open=STATE.assessStep;
    if(open==='summaryV36') return __v70AssessmentSequence(c);
    if(!open || cfg.items.indexOf(open)<0) STATE.assessStep=cfg.items[0]||'sdma';
    var form=STATE.assessStep==='sdma'?sdmaFormHtmlV2(c):
             STATE.assessStep==='mhsca'?mhscaFormHtmlV2(c):
             STATE.assessStep==='fra'?fraFormHtmlV2(c):missingAssessmentHtml(c,STATE.assessStep);
    return '<div class="banner banner--info"><span class="icon" data-icon="circle-info"></span><div><strong>Assessment Set — ไม่บังคับลำดับ</strong><p>เลือกทำแบบใดก่อนก็ได้ บันทึก Draft และกลับมาทำต่อได้ Timeline ใช้ติดตามงานค้าง ส่วนการส่ง Approve จะเปิดเมื่อ Required Assessment ครบเท่านั้น</p></div></div>'+
      assessmentSetManager(c)+dynamicTimeline(c)+v66AssessmentBar(c)+form+assessmentCompletionPanel(c);
  };

  /* Approval is the hard gate — navigation and Draft are never blocked. */
  var __v70SendForApproval=sendForApproval;
  sendForApproval=function(id){
    var c=DB.consults.find(function(x){return x.id===id}), miss=v70AssessmentMissing(c);
    if(miss.length){
      toast('error','ส่ง Approve ไม่ได้ · Assessment ยังไม่ครบ '+miss.length+' แบบ');
      STATE.activeId=id; STATE.assessStep=assessCfg(c).items.find(function(x){return !assessmentDone(c,x)})||'sdma';
      STATE.view='sw-consult'; render();
      setTimeout(function(){
        var content=document.querySelector('.content'); if(content) content.scrollIntoView({behavior:'smooth',block:'start'});
      },20);
      return;
    }
    return __v70SendForApproval(id);
  };

  /* ---- SDMA Section 3 genogram: free-draw canvas RETIRED in v76; replaced by the
     structured GenoPro-style builder whose engine (genoRefresh/genoAddPerson/…) is defined
     in the v76 block below. This shim keeps the render-hook name working. ---- */
  window.v70InitGenogram=function(){ if(typeof window.genoRefresh==='function' && document.getElementById('genoHost')) window.genoRefresh(); };

  var __v70SdmaForm=sdmaFormHtmlV2;
  sdmaFormHtmlV2=function(c){
    var h=__v70SdmaForm(c);
    var old='<div class="sdma-block"><div class="hd">ส่วนที่ 3 · ประวัติครอบครัว / ผังครอบครัว (Genogram)</div><div class="bd"><div class="field"><label>ประวัติครอบครัว / บันทึกผังครอบครัว</label><textarea class="textarea" oninput="sdmaField(\\\'familyHistory\\\',this.value)" placeholder="บรรยายโครงสร้างครอบครัว ความสัมพันธ์ ผู้ดูแลหลัก ฯลฯ (ผังครอบครัวเชิงสัญลักษณ์แนบเป็นเอกสาร/วาดในระบบภายหลัง)">';
    var pos=h.indexOf(old);
    if(pos<0) return h;
    var end=h.indexOf('</div></div>',pos);
    if(end<0) return h;
    end+=12;
    var f=sdmaWork(c).f;
    var replacement='<div class="sdma-block"><div class="hd">ส่วนที่ 3 · ประวัติครอบครัว / ผังครอบครัว (Genogram) · <span style="color:var(--color-primary-action)">สร้างผังเชิงสัญลักษณ์แบบ GenoPro</span></div><div class="bd">'+
      '<div class="field"><label>ประวัติครอบครัว</label><textarea class="textarea" oninput="sdmaField(\'familyHistory\',this.value)" placeholder="บรรยายโครงสร้างครอบครัว ความสัมพันธ์ ผู้ดูแลหลัก ฯลฯ">'+(f.familyHistory||'')+'</textarea></div>'+
      '<div id="genoHost" class="geno-host"></div>'+
      '</div></div>';
    setTimeout(v70InitGenogram,0);
    return h.slice(0,pos)+replacement+h.slice(end);
  };

  /* Re-init canvas after every render while Section 3 is present. */
  var __v70Render=render;
  render=function(){var r=__v70Render.apply(this,arguments);setTimeout(v70InitGenogram,20);return r;};
})();
</script>


<style>
/* V75 — Approval Handoff + Fund-based Virtual Payor / Package Assignment */
.v75-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.v75-flow span{font-size:10px;font-weight:700;padding:5px 9px;border:1px solid var(--color-border-subtle);border-radius:999px;color:var(--color-text-secondary);background:#fff}
.v75-flow span.on{background:var(--color-blue-50);border-color:var(--color-primary-action);color:var(--color-primary-action)}
.v75-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.v75-card{border:1px solid var(--color-border-subtle);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:12px}
.v75-card-hd{padding:10px 12px;background:#f7f9fb;border-bottom:1px solid var(--color-border-subtle);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.v75-card-bd{padding:12px}
.v75-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.v75-kv>div{border:1px solid var(--color-gray-100);border-radius:7px;padding:8px}
.v75-kv .k{font-size:9.5px;color:var(--color-text-tertiary)}
.v75-kv .v{font-size:12px;font-weight:700;margin-top:2px}
.v75-min{font-size:10.5px;color:var(--color-text-secondary);line-height:1.55}
.v75-table{width:100%;border-collapse:collapse;font-size:11px}
.v75-table th,.v75-table td{padding:7px 8px;border-bottom:1px solid var(--color-gray-100);text-align:left;vertical-align:middle}
.v75-table th{font-size:9.5px;color:var(--color-text-tertiary);background:var(--color-gray-25)}
.v75-table .num{font-family:var(--font-family-mono);text-align:right}
.v75-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--color-blue-100);background:var(--color-blue-50);color:var(--color-blue-700);padding:4px 8px;border-radius:999px;font-size:9.5px;font-weight:700}
.v75-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px}
.v75-readonly{background:var(--color-gray-75)!important}
.v75-amount{font-family:var(--font-family-mono);font-weight:800}
.v75-alert{padding:9px 11px;border-radius:8px;border:1px solid var(--color-blue-100);background:var(--color-blue-50);font-size:10.5px;color:var(--color-blue-900);line-height:1.5;margin-bottom:10px}
@media(max-width:1000px){.v75-grid{grid-template-columns:1fr}.v75-kv{grid-template-columns:1fr}}
</style>
<script>
/* V75 design intent:
   Case -> Handoff for approval -> Manager/Director approval -> Fund-based Virtual Payor + Virtual Package Assignment
   -> Handoff to requesting unit. One Case ID has one active Package Assignment in this mockup.
*/
(function(){
  window.V75_FUNDS=window.V75_FUNDS||[
    {id:'SW-FUND-01',name:'กองทุนช่วยเหลือผู้ป่วย',payor:'PAYOR-SW-01',payorName:'SW Fund — กองทุนช่วยเหลือผู้ป่วย'},
    {id:'SW-FUND-02',name:'กองทุนผู้ยากไร้',payor:'PAYOR-SW-02',payorName:'SW Fund — กองทุนผู้ยากไร้'}
  ];
  window.v75Fund=function(id){return V75_FUNDS.find(function(x){return x.id===id})||V75_FUNDS[0]};
  function v75Total(c){return (c.items||[]).reduce(function(z,it){return z+(+it.qty||0)*(+it.priceFull||0);},0)}
  function v75NonClaim(c){return (c.items||[]).reduce(function(z,it){return z+(+it.qty||0)*Math.max(0,(+it.priceFull||0)-(+it.claimable||0));},0)}
  function v75Unit(c){return c.requestingUnit||c.referringUnit||((c.items||[])[0]&&((c.items||[])[0].unit))||'หน่วยบริการที่ร้องขอ Consult'}
  function v75Receiver(c){return c.requestingStaff||c.referringDoctor||'ผู้รับผิดชอบหน่วยงาน'}
  function v75Ensure(c){
    c.history=c.history||[];
    c.approvalHandoff=c.approvalHandoff||null;
    c.packageAssignment=c.packageAssignment||null;
    c.serviceHandoff=c.serviceHandoff||null;
    return c;
  }
  window.v75OpenApprovalHandoff=function(id){STATE.activeId=id;STATE.view='sw-approval-handoff';render()};
  window.v75SaveApprovalHandoff=function(id){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===id;})); if(!c)return;
    var note=(document.getElementById('v75ApprovalNote')||{}).value||'';
    var min=(document.getElementById('v75ApprovalMinimum')||{}).value||'รายการบริการ/วงเงินที่ขอ + เหตุผล + ผลประเมินที่จำเป็น';
    c.approvalHandoff={target:'Approval Workflow',unit:'Social Work Approval',minimumData:min,note:note,sentAt:new Date().toISOString(),sentBy:ACTOR_SW,status:'Sent'};
    c.history.push({type:'handoff-approval',label:'ส่ง Handoff เพื่อขออนุมัติ',ts:c.approvalHandoff.sentAt,actor:ACTOR_SW});
    toast('success','บันทึก Handoff แล้ว · พร้อมเข้าสู่ Approval Workflow');goto('exec-inbox');
  };
  window.v75OpenPackage=function(id){STATE.activeId=id;STATE.view='sw-package-generate';render()};
  window.v75GeneratePackage=function(id){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===id;})); if(!c)return;
    if(c.status!=='Approved'){toast('error','ต้องอนุมัติเคสก่อน Generate Package');return}
    var fund=v75Fund((document.getElementById('v75Fund')||{}).value||'SW-FUND-01');
    var pkgName=(document.getElementById('v75PkgName')||{}).value||'กายภาพบำบัด 10 ครั้ง';
    var pkgCode=(document.getElementById('v75PkgCode')||{}).value||'VP-SW-PT-10';
    var qty=+(document.getElementById('v75PkgQty')||{}).value||((c.items&&c.items[0]&&c.items[0].qty)||1);
    var cap=+(document.getElementById('v75PkgCap')||{}).value||v75NonClaim(c);
    var valid=(document.getElementById('v75PkgValid')||{}).value||'31/12/2569';
    c.packageAssignment={packageCode:pkgCode,packageName:pkgName,payorCode:fund.payor,payorName:fund.payorName,fundCode:fund.id,fundName:fund.name,approvedQty:qty,approvedAmount:cap,usedQty:c.usedQty||0,validTo:valid,services:(c.items||[]).map(function(it){return {name:it.name,qty:it.qty,unitPrice:it.priceFull,claimable:it.claimable||0}}),assignedAt:new Date().toISOString(),assignedBy:ACTOR_SW,status:'Assigned'};
    c.history.push({type:'package-assignment',label:'Generate Package '+pkgCode+' · '+fund.name+' · '+fund.payorName,ts:c.packageAssignment.assignedAt,actor:ACTOR_SW});
    toast('success','Generate Package + Payor สำเร็จ');STATE.view='sw-service-handoff';render();
  };
  window.v75SendServiceHandoff=function(id){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===id;})); if(!c||!c.packageAssignment){toast('error','ต้อง Generate Package ก่อนส่งต่อหน่วยงาน');return}
    var unit=(document.getElementById('v75TargetUnit')||{}).value||v75Unit(c),receiver=(document.getElementById('v75TargetReceiver')||{}).value||v75Receiver(c),note=(document.getElementById('v75ServiceNote')||{}).value||'';
    c.serviceHandoff={targetUnit:unit,receiver:receiver,note:note,sentAt:new Date().toISOString(),sentBy:ACTOR_SW,status:'Pending Receive'};
    c.history.push({type:'handoff-service',label:'ส่งต่อหน่วยงาน '+unit+' · '+receiver,ts:c.serviceHandoff.sentAt,actor:ACTOR_SW});
    toast('success','ส่งต่อหน่วยงานที่ร้องขอ Consult แล้ว');goto('sw-handoff');
  };
  window.v75ReceiveService=function(id){var c=v75Ensure(DB.consults.find(function(x){return x.id===id;}));if(!c)return;c.serviceHandoff.status='Received';c.history.push({type:'handoff-received',label:'หน่วยงานรับช่วงจัดบริการ',ts:new Date().toISOString(),actor:c.serviceHandoff.receiver||'หน่วยงานรับช่วง'});toast('success','หน่วยงานรับ Handoff แล้ว');render()};
  window.v75NotifyPatient=function(id){var c=v75Ensure(DB.consults.find(function(x){return x.id===id;}));if(!c)return;c.notifiedPatientAt=new Date().toISOString();c.history.push({type:'patient-notify',label:'Social Work แจ้ง Patient ให้ติดต่อหน่วยงาน/นักสังคมสงเคราะห์เพื่อใช้ Package',ts:c.notifiedPatientAt,actor:ACTOR_SW});toast('success','แจ้ง Patient แล้ว');render()};

  function v75Flow(step){var labels=['Assessment','Handoff ขออนุมัติ','Approve','Generate Package','ส่งต่อหน่วยงาน'];return '<div class="v75-flow">'+labels.map(function(x,i){return '<span class="'+(i<=step?'on':'')+'">'+(i+1)+'. '+x+'</span>'}).join('')+'</div>'}
  function v75Header(title,crumb,back){return '<div class="page-context"><div><div class="breadcrumb">'+crumb+'</div><h1 class="page-title">'+title+'</h1></div><div class="context-right">'+(back?'<button class="btn btn--quiet" onclick="goto(\''+back+'\')">'+ic('chevron-left')+'กลับ</button>':'')+'</div></div>'}

  window.viewSWApprovalHandoff=function(){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===STATE.activeId;}));if(!c)return '';
    var p=getPatient(c.hn)||{}, note=c.approvalHandoff&&c.approvalHandoff.note||'';
    return v75Header('Handoff Form — ขออนุมัติ','Social Work / '+c.id,'sw-consult')+patientBanner(c.hn)+'<div class="content">'+v75Flow(1)+
      '<div class="v75-alert"><b>หลักการ Handoff:</b> ส่งเฉพาะข้อมูลที่จำเป็นต่อการพิจารณาอนุมัติ ไม่ส่งรายละเอียด SDMA/FRA ทั้งชุด หากไม่จำเป็นต่อการตัดสินใจ</div>'+
      '<div class="v75-grid"><div><div class="v75-card"><div class="v75-card-hd">ข้อมูลคำขอ</div><div class="v75-card-bd"><div class="v75-kv"><div><div class="k">Case ID</div><div class="v">'+esc(c.id)+'</div></div><div><div class="k">Patient</div><div class="v">'+esc(p.name||c.hn)+'</div></div><div><div class="k">เหตุผล Consult</div><div class="v">'+esc(c.reason||'ขอรับการสงเคราะห์')+'</div></div><div><div class="k">หน่วยงานที่ร้องขอ</div><div class="v">'+esc(v75Unit(c))+'</div></div></div></div></div>'+
      '<div class="v75-card"><div class="v75-card-hd">รายการที่เสนอขออนุมัติ</div><div class="v75-card-bd"><table class="v75-table"><thead><tr><th>บริการ/รายการ</th><th>จำนวน</th><th>ราคาเต็ม</th><th>เบิกได้</th><th>ขอสงเคราะห์</th></tr></thead><tbody>'+((c.items||[]).map(function(it){var ask=(+it.qty||0)*Math.max(0,(+it.priceFull||0)-(+it.claimable||0));return '<tr><td>'+esc(it.name)+'</td><td class="num">'+it.qty+'</td><td class="num">฿'+fmtMoney((+it.qty||0)*(+it.priceFull||0))+'</td><td class="num">฿'+fmtMoney((+it.qty||0)*(+it.claimable||0))+'</td><td class="num">฿'+fmtMoney(ask)+'</td></tr>'}).join('')||'<tr><td colspan="5">ไม่มีรายการ</td></tr>')+'</tbody></table><div class="v75-actions"><span class="v75-tag">วงเงินขออนุมัติ ฿'+fmtMoney(v75NonClaim(c))+'</span></div></div></div></div>'+ 
      '<div><div class="v75-card"><div class="v75-card-hd">ส่งต่อเพื่อพิจารณา</div><div class="v75-card-bd"><div class="field"><label>ข้อมูลขั้นต่ำที่ส่งให้ผู้อนุมัติ</label><textarea class="textarea" id="v75ApprovalMinimum">รายการบริการที่ขอ, จำนวน, วงเงินที่ขอ, เหตุผลทางการแพทย์/สังคม และผลประเมินที่จำเป็นต่อการตัดสินใจ</textarea></div><div class="field" style="margin-top:10px"><label>หมายเหตุประกอบ Handoff</label><textarea class="textarea" id="v75ApprovalNote" placeholder="ประเด็นสำคัญสำหรับผู้อนุมัติ">'+esc(note)+'</textarea></div><div class="v75-actions"><button class="btn btn--primary" onclick="v75SaveApprovalHandoff(\''+c.id+'\')">ส่ง Handoff เพื่อขออนุมัติ</button></div></div></div></div></div></div>';
  };

  window.viewSWPackageGenerate=function(){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===STATE.activeId;}));if(!c)return '';
    var a=c.packageAssignment||{}, f=v75Fund(a.fundCode||'SW-FUND-01');
    return v75Header('Generate Package + Payor','Social Work / '+c.id,'exec-inbox')+patientBanner(c.hn)+'<div class="content">'+v75Flow(3)+
      '<div class="v75-alert"><b>HIS-native:</b> Payor = ผู้รับผิดชอบค่าใช้จ่าย · Package = ชุดบริการ/จำนวนที่อนุมัติ · Package Assignment = การผูก Package กับ HN/Case นี้</div>'+
      '<div class="v75-grid"><div><div class="v75-card"><div class="v75-card-hd">1. Fund → Virtual Payor</div><div class="v75-card-bd"><div class="field"><label>กองทุนที่ Social Work ใช้</label><select class="select" id="v75Fund">'+V75_FUNDS.map(function(x){return '<option value="'+x.id+'" '+(x.id===f.id?'selected':'')+'>'+esc(x.name)+' · '+esc(x.payorName)+'</option>'}).join('')+'</select></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Virtual Payor Code</label><input class="input v75-readonly" value="'+esc(f.payor)+'" readonly></div><div class="field"><label>Payor</label><input class="input v75-readonly" value="'+esc(f.payorName)+'" readonly></div></div></div></div>'+ 
      '<div class="v75-card"><div class="v75-card-hd">2. Virtual Package</div><div class="v75-card-bd"><div class="form-grid"><div class="field"><label>Package Code</label><input class="input" id="v75PkgCode" value="'+esc(a.packageCode||'VP-SW-PT-10')+'"></div><div class="field"><label>Package Name</label><input class="input" id="v75PkgName" value="'+esc(a.packageName||((c.items&&c.items[0]&&c.items[0].name)||'บริการสงเคราะห์'))+'"></div><div class="field"><label>จำนวนที่อนุมัติ</label><input class="input" id="v75PkgQty" type="number" min="1" value="'+(a.approvedQty||((c.items&&c.items[0]&&c.items[0].qty)||1))+'"></div><div class="field"><label>วงเงิน Package</label><input class="input" id="v75PkgCap" type="number" min="0" value="'+(a.approvedAmount||v75NonClaim(c))+'"></div><div class="field"><label>ใช้ได้ถึง</label><input class="input" id="v75PkgValid" value="'+esc(a.validTo||'31/12/2569')+'"></div></div></div></div></div>'+ 
      '<div><div class="v75-card"><div class="v75-card-hd">Package Assignment — 1 Case : 1 Package</div><div class="v75-card-bd"><div class="v75-kv"><div><div class="k">Case ID</div><div class="v">'+esc(c.id)+'</div></div><div><div class="k">HN</div><div class="v">'+esc(c.hn)+'</div></div><div><div class="k">บริการจากคำขอ</div><div class="v">'+esc((c.items&&c.items[0]&&c.items[0].name)||'—')+'</div></div><div><div class="k">วงเงินที่ขอ</div><div class="v v75-amount">฿'+fmtMoney(v75NonClaim(c))+'</div></div></div><div class="divider"></div><div class="v75-min">Package Master ไม่ใช่ Patient Right ใหม่ และไม่สร้าง Entitlement/Coupon Engine แยกต่างหากใน Mockup นี้ การใช้งานจริงให้ Charge ของ HIS เกิดตามบริการ แล้วให้ Payor/Package Coverage เป็นตัวจัดสรรตามที่อนุมัติ</div><div class="v75-actions"><button class="btn btn--secondary" onclick="goto(\'exec-inbox\')">ยกเลิก</button><button class="btn btn--primary" onclick="v75GeneratePackage(\''+c.id+'\')">Generate Package + Payor</button></div></div></div></div></div>';
  };

  window.viewSWServiceHandoff=function(){
    var c=v75Ensure(DB.consults.find(function(x){return x.id===STATE.activeId;}));if(!c)return '';
    var a=c.packageAssignment||{};
    return v75Header('Handoff Form — ส่งต่อหน่วยงานที่ร้องขอ Consult','Social Work / '+c.id,'sw-handoff')+patientBanner(c.hn)+'<div class="content">'+v75Flow(4)+
      '<div class="v75-grid"><div><div class="v75-card"><div class="v75-card-hd">Package ที่อนุมัติและผูกกับ HN</div><div class="v75-card-bd"><div class="v75-kv"><div><div class="k">Virtual Payor</div><div class="v">'+esc(a.payorName||'—')+'</div></div><div><div class="k">Fund</div><div class="v">'+esc(a.fundName||'—')+'</div></div><div><div class="k">Package</div><div class="v">'+esc(a.packageCode||'—')+' · '+esc(a.packageName||'—')+'</div></div><div><div class="k">จำนวน</div><div class="v">'+(a.approvedQty||0)+' ครั้ง/หน่วย</div></div><div><div class="k">วงเงิน</div><div class="v v75-amount">฿'+fmtMoney(a.approvedAmount||0)+'</div></div><div><div class="k">ใช้ได้ถึง</div><div class="v">'+esc(a.validTo||'—')+'</div></div></div><div class="divider"></div><div class="v75-min"><b>Used / Remaining:</b> '+(a.usedQty||0)+' / '+Math.max(0,(a.approvedQty||0)-(a.usedQty||0))+' · หน่วยบริการสามารถใช้ Package Assignment นี้ประกอบการรับบริการและคิดค่าใช้จ่ายตาม HIS</div></div></div></div>'+ 
      '<div><div class="v75-card"><div class="v75-card-hd">ส่งต่อไปยังหน่วยงาน</div><div class="v75-card-bd"><div class="field"><label>หน่วยงานที่ร้องขอ Consult</label><input class="input" id="v75TargetUnit" value="'+esc(v75Unit(c))+'"></div><div class="field" style="margin-top:9px"><label>ผู้รับช่วง</label><input class="input" id="v75TargetReceiver" value="'+esc(v75Receiver(c))+'"></div><div class="field" style="margin-top:9px"><label>Handoff Note</label><textarea class="textarea" id="v75ServiceNote" placeholder="สิ่งที่หน่วยงานต้องดำเนินการ / นัด / ตรวจสอบสิทธิ">รับช่วงจัดบริการตาม Package ที่อนุมัติแล้ว ตรวจสอบความพร้อมของบริการและใช้ Package Assignment ของ Case นี้ในการคิดค่าใช้จ่าย</textarea></div><div class="v75-actions"><button class="btn btn--primary" onclick="v75SendServiceHandoff(\''+c.id+'\')">ส่งต่อหน่วยงาน</button></div></div></div></div></div>';
  };

  /* Replace the old entitlement wording in the Care Handoff views with Package/Payor semantics. */
  window.viewCareHandoff=function(){
    var list=V69_HANDOFFS, pending=list.filter(function(x){return x.status==='Pending Handoff'}).length, accepted=list.filter(function(x){return x.status==='Accepted by Nurse'||x.status==='Service Setup'}).length, scheduled=list.filter(function(x){return x.status==='Appointment Scheduled'}).length, ready=list.filter(function(x){return x.status==='Patient Notified'||x.status==='Ready to Use'}).length;
    var rows=list.map(function(h){var p=getPatient(h.hn)||{},c=DB.consults.find(function(x){return x.hn===h.hn && x.status==='Approved'})||null,a=c&&c.packageAssignment;return '<tr><td class="cid">'+h.id+'</td><td><b>'+esc(p.name||h.hn)+'</b><div class="muted">HN '+h.hn+'</div></td><td>'+(a?'<b>'+esc(a.packageCode)+'</b><div class="muted">'+esc(a.payorName)+'</div>':'<span class="badge badge--warning">ยังไม่ Generate Package</span>')+'</td><td>'+h.used+'/'+h.approvedQty+'</td><td>'+esc(h.unit)+'</td><td>'+v69Status(h.status)+'</td><td>'+esc(h.appt)+'</td><td><button class="btn btn--primary btn--sm" onclick="v69Open(\''+h.id+'\')">เปิด Handoff</button>'+(c&&!a?' <button class="btn btn--secondary btn--sm" onclick="v75OpenPackage(\''+c.id+'\')">Generate Package</button>':'')+'</td></tr>'}).join('');
